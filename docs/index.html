leverage data, technology, and operational rigor to optimize great patient outcomes while offering highly personalized care and shared decision making with patients. \n\nHere’s What You’ll Do:\n\n• Provide best-in-class care for Galileo patients managing complex and chronic illnesses through our innovative, proprietary app and technology and your excellent clinical judgment.\n\n• Provide compassionate and empathetic care to patients from age 0-100 across all needs, including complex, chronic medical conditions such as: diabetes, hypertension, obesity and mental health.\n\n• Work with a diverse patient population. We pride ourselves on fostering a culture that is inclusive of all backgrounds.\n\n• Solve patient problems in an efficient, nimble manner by drawing on resourcefulness, collaborating with team members to leverage their expertise, and a “can-do” approach.\n\nHow We Work\n\nGalileo is a 24/7 medical group utilizing asynchronous text-based chat and synchronous video to provide high-quality, comprehensive primary care. We work in 4-hour shifts (mornings, afternoons, evenings, overnight on weekdays and weekends). At 24+ hours you will be considered full-time and benefits eligible. Providers are required to work at least two 4 hour shifts each weekend, in addition to their weekday hours.\n\nWe are currently looking for a Nurse Practitioner who can work a minimum of 24 hours/week.\n\nCompensation\n\n$80/hour (regular rate) and $90/hour (premium rate)\n\nAbout You\n\nWe look for passionate clinicians who are invested in solving complex problems that impact millions of lives and are excited about fixing what’s broken to improve care quality and health outcomes for everyone. We believe in a culture that fosters teamwork, excellence, and sound decision-making—one that is based on mutual respect and trust. We appreciate individuals who are open and honest about what they’re looking for so we can ensure it’s a fit on both sides.\n\nWe would love to hear from you if you have the following or equivalent experience:\n\n• Have 5+ years of advanced clinical experience in complex care, chronic care management, or primary care.\n\n• Are experienced in or have an appetite for learning digital-first healthcare (e.g. virtual medicine).\n\n• Are interested in new, innovative models of care that balance evidence-based approaches with creative ideas.\n\n• Are highly comfortable with using technology and various applications to deliver care to patients virtually. Our current tech stack is:\n\n• Proprietary built clinician-patient platform \n\n• Google Suite (gmail, sheets, docs, etc) \n\n• Slack\n\n• Board certified as a Nurse Practitioner\n\n• Have an active NP license in MA. Multi-licensed in other states preferred.\n\n• Proficiency with written and spoken medical Spanish is a nice to have\n\nHow We Care for You:\n\n• Flexible scheduling - design the schedule that works best for YOU\n\n• Competitive health, vision and dental plans\n\n• Company paid short and long term disability\n\n• 12 weeks paid parental leave \n\n• Malpractice insurance provided, including tail coverage \n\n• 401(k) with company match\n\nHow We Hire\n\nGalileo Health is an equal-opportunity employer and welcomes applicants from all backgrounds.\n\nWe have recently become aware of the fraudulent use of our name on job postings and via recruiting emails that are illegitimate and not in any way associated with us. We will never ask you to provide sensitive personal information as part of the recruiting process, such as your social security number; send you any unsolicited job offers or employment contracts; require any fees, payments or access to any financial accounts; and/or conduct text-only interviews. If you suspect you are being scammed or have been scammed online, you may report the crime to the Federal Bureau of Investigation and obtain more information regarding online scams at the Federal Trade Commission.\n\nTo apply: https://weworkremotely.com/remote-jobs/galileo-digital-nurse-practitioner-remote-ma-license", "tags": ["All Other Remote"], "salary": "", "location": "Anywhere in the World", "first_seen": "2026-11-20T01:39:02.020517+00:00", "is_new": false}, {"id": "WeWorkRemotely:https://weworkremotely.com/remote-jobs/dropbox-application-security-engineer", "source": "WeWorkRemotely", "kind": "Emprego remoto", "title": "Application Security Engineer", "company": "Dropbox", "url": "https://weworkremotely.com/remote-jobs/dropbox-application-security-engineer", "date": "2026-11-19T18:31:14+00:00", "desc": "Headquarters: Remote - US: Select locations Role Description As part of the Product Security Engineering team, you’ll focus on reducing risk at scale by building the security infrastructure, automation, and tooling that empowers engineers to ship secure products with confidence. …", "full": "Headquarters: Remote - US: Select locations\n\nRole Description\n\nAs part of the Product Security Engineering team, you’ll focus on reducing risk at scale by building the security infrastructure, automation, and tooling that empowers engineers to ship secure products with confidence. We work closely with engineering and product teams throughout the software development lifecycle (SDLC), embedding secure-by-default practices and delivering scalable solutions.\n\nProduct Security Engineers create impact by implementing security tooling, writing custom security rules, and building frameworks that address broad classes of vulnerabilities. In addition to proactive development, we support teams through threat modeling, documentation, and education to uplift security culture across Dropbox.\n\nOur Engineering Career Framework is viewable by anyone outside the company and describes what’s expected for our engineers at each of our career levels. Check out our blog post on this topic and more here.\n\nResponsibilities\n\n• Build and maintain security tools, automation, and libraries to enable secure-by-default development across engineering teams.\n\n• Design and implement custom security rules (e.g., Semgrep, CodeQL) to detect and prevent common and emerging vulnerability patterns.\n\n• Act as a subject matter expert on application security across web, mobile, and desktop environments.\n\n• Improve and scale the Secure Development Lifecycle (SDLC) by integrating tools, checks, and processes into engineering workflows.\n\n• Perform targeted code reviews, and develop follow-up tooling or controls to prevent regressions.\n\n• Collaborate cross-functionally with engineering, product, GRC, and AI/ML teams to proactively address security risks, especially in fast-moving and emerging tech areas.\n\nMany teams at Dropbox run Services with on-call rotations, which entails being available for calls during both core and non-core business hours. If a team has an on-call rotation, all engineers on the team are expected to participate in the rotation as part of their employment. Applicants are encouraged to ask for more details of the rotations to which the applicant is applying.\n\nRequirements\n\n• 4+ years of experience in application security or security engineering roles.\n\n• Hands-on experience building or using security automation tools to improve developer workflows and product security.\n\n• Demonstrated ability to work across the SDLC, including supporting and interpreting findings from penetration tests and bug bounty reports.\n\n• Familiarity with modern tech stacks, including microservices, CI/CD pipelines, and cloud-native environments.\n\n• Solid understanding of common vulnerability classes (e.g., injection, XSS, authN/authZ issues) and practical mitigation strategies.\n\n• Comfortable working in cross-functional environments and supporting multiple product and engineering teams simultaneously.\n\n• Experience participating in or supporting incident response or security on-call rotations is a plus\n\nPreferred Qualifications\n\n• Experience in application security engineering, with a strong focus on security tooling and automation.\n\n• Demonstrated ability to write and maintain custom security rules and integrate them into developer workflows.\n\n• Experience with machine learning systems, particularly generative AI, and the ability to support secure development in AI-driven products.\n\n• Experience developing internal libraries or frameworks that reduce or eliminate entire classes of vulnerabilities.\n\n• Proficient in software development, with experience contributing production-level code in one or more modern languages.\n\n• Familiarity with securing diverse application types, including web, mobile, and native platforms.\n\n• Experience with data security, including tooling for data protection, access control, and encryption.\n\n• Strong communication skills and ability to build trusted partnerships with cross-functional teams.\n\nDurable Skills\n\nAI fluency means using these tools to amplify human judgment, not replace it. We believe people with these skills will thrive as work and technology continue to evolve:\n\n• Awareness: Understand yourself and others.\n\n• Judgment: Evaluate information and make decisions in complex situations.\n\n• Adaptability: Learn, adjust, and stay effective through change.\n\n• Connection: Communicate, collaborate, and build trust.\n\nTo learn more about why these skills matter and what the data shows about thriving through change, read this blog post from our Chief People Officer, Melanie Rosenwasser.\n\nCompensation\nUS Zone 1\n\nThis role is not available in Zone 1\n\nUS Zone 2\n$193,500—$261,900 USD\n\nUS Zone 3\n$172,000—$232,800 USD\n\nTo apply: https://weworkremotely.com/remote-jobs/dropbox-application-security-engineer", "tags": ["DevOps and Sysadmin"], "salary": "", "location": "Anywhere in the World", "first_seen": "2026-11-20T01:39:02.020517+00:00", "is_new": false}, {"id": "WeWorkRemotely:https://weworkremotely.com/remote-jobs/airtable-customer-success-manager", "source": "WeWorkRemotely", "kind": "Emprego remoto", "title": "Customer Success Manager", "company": "Airtable", "url": "https://weworkremotely.com/remote-jobs/airtable-customer-success-manager", "date": "2026-11-19T18:31:14+00:00", "desc": "Headquarters: Remote - US Airtable helps organizations build the applications and workflows they need to run their most important business processes, without being constrained by off-the-shelf software. Its flexible platform combines a relational database, custom applications, au…", "full": "Headquarters: Remote - US\n\nAirtable helps organizations build the applications and workflows they need to run their most important business processes, without being constrained by off-the-shelf software. Its flexible platform combines a relational database, custom applications, automations, and AI, giving teams the building blocks to create solutions around the way they actually work. Just like Lego blocks, what our customers can build with Airtable is virtually limitless.  That flexibility is why more than 500,000 organizations, including 80% of the Fortune 100, use Airtable to power critical work across their businesses.\n\nAbout the role\n\nAt Airtable, we are passionate about how our product democratizes software creation and empowers teams to build applications that connect their organization and drive outcomes, no code needed. As a Customer Success Manager, you will be the post-sales owner for a portfolio of enterprise customers, guiding them from onboarding through renewal as they adopt Airtable and our AI capabilities. You will help customers turn AI adoption and workflow innovation into measurable business outcomes, and you will partner closely with Account Executives so they can focus on growth.\n\nCustomer Success at Airtable sits at the nexus of our Sales, Product and Marketing teams. We hire Customer Success Managers into one of two teams (Scaled and High Touch), depending on your experience and where our team needs you most. We will talk with you about which team is the best fit during the interview process.\n\nWhat you'll do\n\n• Serve as the post-sales point of contact for your accounts, guiding customers to the right answer or the right Airtable team when you cannot resolve something yourself\n\n• Drive onboarding excellence, working with customers on a mutual plan so their primary workflows launch within 90 days, with governance and best practices in place from the start\n\n• Build joint success plans with customers focused on AI adoption, business outcomes and operational efficiency\n\n• Lead Executive Business Reviews and data-driven value reviews that document ROI, surface risk and identify growth\n\n• Develop champions across existing users so each account has multiple advocates who can sustain adoption\n\n• Deliver enablement that accelerates adoption: Airtable 101, feature-specific sessions, AI and MCP workshops, and hands-on build sessions\n\n• Guide governance conversations, including license deployment, long-term app strategy and stakeholder orchestration\n\n• Run workflow consultations for new use cases and determine the right build path\n\n• Monitor account health, adoption trends and risk signals, and flag risk early to your Account Executive and the Renewals team\n\n• Qualify expansion opportunities and hand them to your Account Executive with context\n\n• Maintain a current account record: use cases, success stories, ROI and a stakeholder map, refreshed quarterly\n\n• Serve as the voice of the customer internally, translating usage and feedback into insights that shape our product and AI roadmap, and partner with Marketing and Product on customer stories\n\n• Develop reusable frameworks, AI-enabled health insights and playbooks that scale customer impact across the enterprise segment\n\nWho you are\n\n• You have 5+ years of experience in enterprise customer success, account management, solutions consulting or technical account management supporting B2B SaaS or workflow automation platforms\n\n• You have a track record of delivering measurable results for customers through onboarding, adoption, retention and expansion\n\n• You have owned relationships with multi-stakeholder enterprise accounts and are comfortable being the customer's primary contact\n\n• You have technical fluency and can guide both business and technical audiences. You are comfortable discussing workflow automation, integrations and data, and you have a working understanding of AI and how customers apply it to real workflows\n\n• You are a teacher at heart, able to distill technical or intricate systems into clear, actionable guidance, with strong facilitation, storytelling and presentation skills\n\n• You are skilled at building success plans, running business reviews and mapping platform capabilities to customer outcomes\n\n• You are organized and detail-oriented, and can prioritize across a large portfolio without losing sight of the \"why\" behind the \"what\"\n\n• You partner well with Sales and are at ease working alongside Account Executives, Renewals, Support and Services on a shared account\n\n• You are a team player and a self-starter who can operate in a motion that is still being refined\n\nNice to have\n\n• Experience with no-code or low-code platforms, workflow automation tools or AI-driven SaaS products\n\n• Background in management consulting, product management or solution architecture within enterprise technology\n\n• Experience designing AI-powered workflows or using LLMs to improve customer operations\n\n• Familiarity with data visualization and analytics tools for quantifying customer value\n\n• Understanding of enterprise governance, change management and security frameworks relevant to SaaS adoption\n\nAirtable is an equal opportunity employer. We embrace diversity and strive to create a workplace where everyone has an equal opportunity to thrive. We welcome people of different backgrounds, experiences, abilities, and perspectives. All qualified applicants will receive consideration for employment without regard to race, color, religion, sex, sexual orientation, gender identity, national origin, disability, protected veteran status or any characteristic protected by applicable federal and state laws, regulations and ordinances. Learn more about your EEO rights as an applicant. \n\nVEVRAA-Federal Contractor\n\nIf you have a medical condition, disability, or religious belief/practice which inhibits your ability to participate in any part of the application or interview process, please complete our Accommodations Request Form and let us know ho…", "tags": ["Customer Support"], "salary": "", "location": "Anywhere in the World", "first_seen": "2026-11-20T01:39:02.020517+00:00", "is_new": false}, {"id": "WeWorkRemotely:https://weworkremotely.com/remote-jobs/fivetran-manager-sales-engineering-specialists", "source": "WeWorkRemotely", "kind": "Emprego remoto", "title": "Manager, Sales Engineering Specialists", "company": "Fivetran", "url": "https://weworkremotely.com/remote-jobs/fivetran-manager-sales-engineering-specialists", "date": "2026-11-19T18:30:56+00:00", "desc": "Headquarters: Remote, California, United States, AMER From Fivetran’s founding until now, our mission has remained the same: to make access to data as simple and reliable as electricity. With Fivetran, customer data arrives in their warehouses, canonical and ready to query, with …", "full": "Headquarters: Remote, California, United States, AMER\n\nFrom Fivetran’s founding until now, our mission has remained the same: to make access to data as simple and reliable as electricity. With Fivetran, customer data arrives in their warehouses, canonical and ready to query, with no engineering or maintenance required. We’re proud that more organizations continue to leverage our technology every day to become truly data-driven.\n\nAbout Us\n\nFivetran and dbt Labs are bringing together two industry-leading companies with a shared mission: helping organizations unlock the full value of their data.\n\nTogether, we’re delivering the data infrastructure layer that helps organizations move, transform, and trust their data — from the moment data moves, through every transformation, to the context teams and AI systems rely on.\n\nFivetran helps organizations automate data movement across the systems, clouds, engines, and tools they rely on. dbt Labs pioneered analytics engineering, helping teams transform data into reliable, governed insights. Together, we support thousands of organizations as they build a trusted foundation for analytics, AI, and better business decisions.\n\nAs we bring our teams and technology together, we’re building on the strengths of both companies while continuing to deliver the products and experiences our customers know and trust. It’s an exciting time to join us: we’re creating a company with the scale, talent, and technology to help more organizations put their data to work with greater speed, confidence, and impact.\n\nDuring this transition period, you may see references to both Fivetran and dbt Labs throughout our recruiting process as we integrate our teams, systems, and career sites.\n\nAbout the Role\n\nFivetran is building data pipelines to power the modern data stack for thousands of companies.\n\nWe’re looking for a Manager Sales Engineering Specialists to oversee our data platform Specialists functions. In this role, you will work alongside global Sales Engineering leadership to leverage a team of technical experts to accelerate our most complex enterprise deals, drive customer adoption after the sale, and improve the efficiency of the Sales Engineering motion at large. As customers build toward AI and agentic workloads, you will keep your team ahead of what those workloads demand of the data platform.\n\nYou will need a deep understanding of how modern data movement and transformation platforms like ours are architected, including the AI use cases built on top of them, and a keen ability to lead a team of highly specialized resources. You will be tasked with developing and retaining experienced, high-performing talent who can speak the language of enterprise architects, data engineers, and data platform owners, and with hiring where the team needs to grow.\n\nThis is a full-time position based in the US.\n\nTechnologies You’ll Use\n\nFivetran, dbt, Enterprise databases and applications (including SAP), cloud data warehouses and lakehouses (Snowflake, BigQuery, Databricks), open table formats (Apache Iceberg), dbt, SQL, reverse ETL, AI and agent tooling, AWS, GCP, Azure\n\nWhat You’ll Do\n\n• Lead a team of tenured experts across our data platform specialties to act as technical liaisons between Sales Engineering, Sales, Product, and Engineering.\n\n• Support Global Sales teams by proactively embedding specialist functions to remove technical blockers in complex enterprise deals and in customer adoption after the sale.\n\n• Implement strategies to maximize deal velocity and customer adoption by streamlining how specialists are engaged, prioritized, and measured.\n\n• Execute hands-on tasks when needed, including architecture reviews, critical customer calls, or complex proofs of value.\n\n• Ensure the team provides timely, strategic, and accurate guidance during technical evaluations and customer escalations.\n\n• Build strong working relationships with strategic internal partners, including Product, Engineering, and other sales teams.\n\n• Coach team members to maximize performance and efficiency, and prepare them for future roles.\n\n• Ensure the team shares specialist knowledge across the field through enablement and documentation.\n\n• Keep the team current on how AI and agentic workloads change customer requirements, and turn that into field guidance.\n\nSkills We’re Looking For\n\n• People Leadership: Proven experience leading and developing a Sales Engineering, Solution Architecture, or other technical team, with people management experience preferred.\n\n• Technical Depth: Hands-on expertise in one or more areas across the data lifecycle, such as database and application replication, SAP, lake and warehouse architectures, transformation, activation, or AI and context engineering, and the breadth to credibly lead specialists in other disciplines. Experience applying a narrower specialty across several of these areas also counts.\n\n• Cloud and Data Architecture: Proficiency with major cloud providers (AWS, GCP, Azure), specifically regarding deployment and connectivity, and with modern data architectures, including cloud data warehouses and lakehouses.\n\n• AI Fluency: Working understanding of how AI and agentic workloads change customers' data requirements, and fluency using AI tools to scale your own and your team's work.\n\n• Technical Sales Acumen: Extensive Sales Engineering or specialist experience supporting complex enterprise sales cycles, including proofs of value and senior stakeholders, and deep knowledge of the broader technical sales and demonstration process.\n\n• Communication Skills: Best-in-class ability to explain complex data and AI concepts to non-technical buyers and technical architects alike, and to influence Product and Engineering priorities with customer evidence.\n\nBonus Skills​\n\n• Prior experience at an analytics, ETL, BI, or open-source data software company\n\n• Familiarity with dbt, Terraform, or similar tools for transformation and managing cloud infrastructure\n\n• Experience mana…", "tags": ["All Other Remote"], "salary": "", "location": "Anywhere in the World", "first_seen": "2026-11-20T01:39:02.020517+00:00", "is_new": false}, {"id": "WeWorkRemotely:https://weworkremotely.com/remote-jobs/gemini-senior-fraud-data-scientist-credit-card", "source": "WeWorkRemotely", "kind": "Emprego remoto", "title": "Senior Fraud Data Scientist (Credit Card)", "company": "Gemini", "url": "https://weworkremotely.com/remote-jobs/gemini-senior-fraud-data-scientist-credit-card", "date": "2026-11-19T18:30:55+00:00", "desc": "Headquarters: New York, New York; Miami, Florida; Remote (USA) About the Company Gemini is a global crypto and Web3 platform founded by Cameron and Tyler Winklevoss in 2014, offering a wide range of simple, reliable, and secure crypto products and services to individuals and inst…", "full": "Headquarters: New York, New York; Miami, Florida; Remote (USA)\n\nAbout the Company\n\nGemini is a global crypto and Web3 platform founded by Cameron and Tyler Winklevoss in 2014, offering a wide range of simple, reliable, and secure crypto products and services to individuals and institutions in over 70 countries. Our mission is to unlock the next era of financial, creative, and personal freedom by providing trusted access to the decentralized future. We envision a world where crypto reshapes the global financial system, internet, and money to create greater choice, independence, and opportunity for all — bridging traditional finance with the emerging cryptoeconomy in a way that is more open, fair, and secure. As a publicly traded company, Gemini is poised to accelerate this vision with greater scale, reach, and impact.\n\nThe Department: Risk Engineering (Fraud Operations)\n\nThe Fraud Operations team is committed to protecting our users by stopping bad actors, safeguarding funds, and upholding the integrity of Gemini’s digital asset marketplace - all while operating at scale to deliver a seamless experience for our users. Our diverse team brings expertise across technology, legal, risk, data, and operations, leveraging advanced tools and analytics to protect users and disrupt fraud. We collaborate closely with product, engineering, operations, and compliance teams to manage risk effectively and support sustainable business growth.\n\nThe Role: Senior Fraud Data Scientist (Credit Card)\n\nAs a Senior Fraud Data Scientist, you will play a critical role in protecting Gemini and our customers from emerging fraud risks. You’ll lead initiatives to strengthen our fraud prevention strategies, design and implement effective rules and controls, and proactively mitigate risk before it impacts our platform. Your work will range from evaluating fraud exposure to driving cross-functional projects that enhance detection capabilities and safeguard customer trust.\n\nYou are strategic, detail-oriented, and collaborative, with the ability to navigate complex risk landscapes while balancing prevention with a seamless customer experience. You thrive in fast-paced environments, excel at working independently, and bring deep subject matter expertise in fraud trends and mitigation techniques.\n\nThis role requires strong experience with fraud detection systems, risk management methodologies, and regulatory frameworks. You’ll partner closely with teams across product, engineering, operations, and compliance to deliver impactful improvements to risk controls. Strong analytical and technical skills are essential, including expert level proficiency in SQL (and other data tools), along with the ability to design, manage, and measure the effectiveness of fraud prevention rules.\n\nThis role requires on-call rotations.\n\nResponsibilities:\n\n• Program Development: Design and lead the development of end-to-end fraud prevention and detection strategies, including procedures, fraud rules, and controls.\n\n• Risk Analysis: Conduct sophisticated data analysis on large datasets (structured and unstructured) to identify emerging fraud trends, patterns, and potential risks.\n\n• Monitoring & Optimization: Continuously monitor fraud prevention system performance, measure key risk metrics, and implement data-driven enhancements to improve accuracy and reduce false positives.\n\n• Cross-Functional Collaboration: Partner with data science, risk operations, product, engineering, and customer support teams to integrate fraud prevention into products and services.\n\n• Project Management: Oversee initiatives aimed at advancing fraud detection systems and optimizing operational processes.\n\n• Reporting & Communication: Develop and deliver clear, actionable reports and insights for leadership and stakeholders, highlighting fraud risk exposure and the effectiveness of strategies and controls.\n\nMinimum Qualifications:\n\n• 5+ years in fraud strategy, program management, or related risk management roles.\n\n• Advanced analytical skills with proficiency in SQL, Python, Looker, and other data analysis and visualization tools.\n\n• Hands-on experience with fraud detection and monitoring platforms, with the ability to analyze data and identify emerging fraud patterns.\n\n• Strong verbal, written, and interpersonal skills with the ability to convey complex ideas clearly to both technical and non-technical audiences.\n\n• Track record of working effectively across cross-functional teams (e.g., product, engineering, operations, compliance) to achieve shared goals.\n\n• Comfortable making sound decisions in ambiguous or rapidly changing environments; skilled at using data to drive informed choices.\n\n• Demonstrated ability to lead and execute projects spanning multiple teams, balancing priorities and driving results.\n\n• Strong critical-thinking skills with the ability to stay composed under pressure and resolve complex issues.\n\n• Hands-on experience with fraud transaction monitoring for credit card or debit card.\n\nPreferred Qualifications:\n\n• Strong expertise in detecting and mitigating fraud risk, including account takeover, synthetic identity, distributed attacks, payment fraud, and collusion.\n\n• Proven experience addressing and preventing fraud in digital channels and card-not-present environments.\n\n• In depth knowledge of ACH risks, including reversal flows and related vulnerabilities.\n\n• Background working in fast paced, high growth environments, ideally within fintech or other technology driven industries.\n\n• Comprehensive understanding of scam, phishing, and social engineering threats with experience implementing effective mitigation strategies.\n\n• Knowledge of dispute representment requirements and industry best practices.\n\n• Proven ability to thrive in fast paced, technology driven environments and adapt quickly to change.\n\n• Familiarity with financial markets, banking, or digital asset exchanges.\n\nIt Pays to Work Here\n\nThe compensation & benefits package for this role inclu…", "tags": ["All Other Remote"], "salary": "", "location": "Anywhere in the World", "first_seen": "2026-11-20T01:39:02.020517+00:00", "is_new": false}, {"id": "WeWorkRemotely:https://weworkremotely.com/remote-jobs/fivetran-manager-customer-support-engineering", "source": "WeWorkRemotely", "kind": "Emprego remoto", "title": "Manager, Customer Support Engineering", "company": "Fivetran", "url": "https://weworkremotely.com/remote-jobs/fivetran-manager-customer-support-engineering", "date": "2026-11-19T18:30:55+00:00", "desc": "Headquarters: Remote, Australia, APAC From Fivetran’s founding until now, our mission has remained the same: to make access to data as simple and reliable as electricity. With Fivetran, customer data arrives in their warehouses, canonical and ready to query, with no engineering o…", "full": "Headquarters: Remote, Australia, APAC\n\nFrom Fivetran’s founding until now, our mission has remained the same: to make access to data as simple and reliable as electricity. With Fivetran, customer data arrives in their warehouses, canonical and ready to query, with no engineering or maintenance required. We’re proud that more organizations continue to leverage our technology every day to become truly data-driven.\n\nAbout Us\n\nFivetran and dbt Labs are bringing together two industry-leading companies with a shared mission: helping organizations unlock the full value of their data. Together, we’re delivering the data infrastructure layer that helps organizations move, transform, and trust their data — from the moment data moves, through every transformation, to the context teams and AI systems rely on. Fivetran helps organizations automate data movement across the systems, clouds, engines, and tools they rely on. dbt Labs pioneered analytics engineering, helping teams transform data into reliable, governed insights. Together, we support thousands of organizations as they build a trusted foundation for analytics, AI, and better business decisions.\n\nAs we bring our teams and technology together, we’re building on the strengths of both companies while continuing to deliver the products and experiences our customers know and trust. It’s an exciting time to join us: we’re creating a company with the scale, talent, and technology to help more organizations put their data to work with greater speed, confidence, and impact. During this transition period, you may see references to both Fivetran and dbt Labs throughout our recruiting process as we integrate our teams, systems, and career sites.\n\nAbout the role\n\nCustomer support is on the very front-lines of assisting our dbt Cloud customers and we are looking for a Manager of our Customer Solutions Engineering team who will be the first line of defense for our Enterprise customers. The person will play a pivotal role in impacting dbt Cloud's usage and increase retention by helping users quickly adopt dbt Cloud within their organizations. \n\nWhat You'll Do\n\n• Lead and develop a team of Customer Solutions Engineers across the APJ regions, ensuring high-quality technical support for enterprise customers.\n\n• Strategize and implement support processes to enhance support operations, facilitating smooth and efficient issue resolution.\n\n• Foster a culture of continuous learning and professional growth within your team, ensuring they are equipped to support the evolving landscape of dbt Cloud and the modern data stack.\n\n• Collaborate with cross-functional teams to enhance customer satisfaction, drive product adoption, and ensure a seamless customer experience.\n\n• Monitor and analyze team performance, providing regular feedback and coaching to improve efficiency and effectiveness.\n\n• Advocate for customers within the organization, ensuring their needs and feedback influence product development and innovation.\n\n• Lead by example, offering hands-on support and guidance to both customers and team members, driving towards excellence in every interaction.\n\nSkills We're Looking For\n\n• Extensive experience in technical support or engineering, preferably with enterprise-level customers in a SaaS environment.\n\n• A proven track record of building and leading high-performing technical support or engineering teams.\n\n• Exceptional problem-solving skills, with a capacity to handle complex technical issues and provide effective solutions.\n\n• Excellent communication and interpersonal skills, capable of navigating diverse cultural and regional nuances within a global team.\n\n• Adeptness at project and program management, with a keen ability to organize, prioritize, and manage cross-functional projects.\n\n• Experience with analytics engineering tools and processes.\n\n• Familiarity with SQL, including the ability to read, interpret, and write queries.\n\n• A proven background in collaborating with engineering and product teams to build scalable solutions for bug triage and investigation, quantitative product feedback, and communicating “the voice of the customer”.\n\n#LI-REMOTE\n\n#LI-SA1\n\nPerks and Benefits\n\n• 100% employer-paid medical insurance*\n\n• Generous paid time away from work, including paid vacation or flexible/unlimited vacation depending on role and country, plus paid sick time, inclusive parental leave, paid holidays, including a year-end Global Week of Rest, and volunteer days off.\n\n• RSU stock grants*\n\n• Professional development and training opportunities\n\n• Company virtual happy hours, free food, and fun team-building activities\n\n• Monthly cell phone stipend\n\n• Access to an innovative mental health support platform that offers personalized care and resources in areas such as: therapy, coaching, and self-guided mindfulness exercises for all covered employees and their covered dependents.\n\n*May vary by country and worker type - please reach out to your recruiter for more information\n\nClick here to learn more about Fivetran's Benefits by Region.\n\nWe’re honored to be valued at over $5.6 billion, but more importantly, we’re proud of our core values of Get Stuck In, Do the Right Thing, and One Team, One Dream. Read about us in Forbes.     \n\nFivetran brings together high-quality talent across the globe to make data access as easy and reliable as electricity for our customers. We value and recognize that our customers benefit from having innovative teams made of people from many backgrounds, experiences, and identities. Fivetran promotes diversity, equity, inclusion & belonging through attracting, recruiting, developing, and retaining a diverse workforce, not only because it is the right thing to do, but because it helps us build a world-class company to better serve our customers, our people and our communities.\n\nTo learn more about Fivetran’s culture and what it’s like to be part of the team, click here and enjoy our video.\n\nTo learn more about our candidate privacy policy, you ca…", "tags": ["Customer Support"], "salary": "", "location": "Anywhere in the World", "first_seen": "2026-11-20T01:39:02.020517+00:00", "is_new": false}, {"id": "WeWorkRemotely:https://weworkremotely.com/remote-jobs/databricks-enterprise-account-executive-financial-services", "source": "WeWorkRemotely", "kind": "Emprego remoto", "title": "Enterprise Account Executive - Financial Services", "company": "Databricks", "url": "https://weworkremotely.com/remote-jobs/databricks-enterprise-account-executive-financial-services", "date": "2026-11-19T17:02:48+00:00", "desc": "Headquarters: Remote - New York SLSQ128R164 As an Enterprise Account Executive at Databricks, you are a seasoned sales professional with experience selling to Financial Services accounts. You know how to sell innovation and change through customer vision expansion and can guide d…", "full": "Headquarters: Remote - New York\n\nSLSQ128R164\n\nAs an Enterprise Account Executive at Databricks, you are a seasoned sales professional with experience selling to Financial Services accounts. You know how to sell innovation and change through customer vision expansion and can guide deals forward to compress decision cycles. You love understanding a product in depth and are passionate about communicating its value to Customers and System Integrators. Always looking for new opportunities, you will be asked to hunt after net new logos. Along with the chance to close an exciting deal, we also offer accelerators above 100% quota attainment.\n\nThe impact you will have:\n\n• Meet with CIOs, IT executives, LOB executives, Program Managers, and other important partners\n\n• Close both new accounts and existing accounts\n\n• Identify and close quick, small wins while managing longer, complex sales cycles\n\n• Exceed activity, pipeline, and revenue targets\n\n• Track all customer details including use case, purchase time frames, next steps, and forecasting in Salesforce\n\n• Use a solution-based approach to selling and creating value for customers\n\n• Promote Databricks' enterprise cloud data platform powered by Apache Spark™\n\n• Ensure 100% satisfaction among all customers\n\n• Prioritize opportunities and applying appropriate resources\n\n• Build a plan for success internally at Databricks and externally with your accounts\n\nWhat we look for:\n\n• You have previously worked in an early stage company and you know how to navigate and be successful\n\n• Field sales experience within big data, Cloud, or SaaS sales\n\n• Prior customer relationships with CIOs, program managers, and essential decision makers\n\n• Simply articulate intricate cloud technologies\n\n• 6+ years experience exceeding sales quotas\n\n• Expertise with financial services institutions preferable\n\n• Success closing net new business\n\n• Understanding of Spark and big data preferable\n\n• Passion for cloud technologies\n\n• Bachelor's Degree\n\nPay Range Transparency\n\nDatabricks is committed to fair and equitable compensation practices. The pay range(s) for this role is listed below and represents the expected base salary range for non-commissionable roles or on-target earnings for commissionable roles.  Actual compensation packages are based on several factors that are unique to each candidate, including but not limited to job-related skills, depth of experience, relevant certifications and training, and specific work location. Based on the factors above, Databricks anticipated utilizing the full width of the range. The total compensation package for this position may also include eligibility for annual performance bonus, equity, and the benefits listed above. For more information regarding which range your location is in visit our page here.\n\nZone 1 Pay Range\n$272,000—$374,000 USD\n\nZone 2 Pay Range\n$272,000—$374,000 USD\n\nZone 3 Pay Range\n$272,000—$374,000 USD\n\nZone 4 Pay Range\n$272,000—$374,000 USD\n\nAbout Databricks\n\nDatabricks is the Data and AI company. More than 20,000 organizations worldwide — including adidas, AT&T, Bayer, Block, Mastercard, Rivian, Unilever, and 70% of the Fortune 500 — rely on the Databricks Data + AI Platform to build and scale data and AI apps, analytics and agents. Headquartered in San Francisco with 30+ offices around the globe, Databricks offers a unified platform that includes Genie, Lakebase, Agent Bricks, Lakeflow, Lakehouse, and Unity Catalog. To learn more, follow Databricks on LinkedIn, X, YouTube, and Instagram.\n\nBenefits\n\nAt Databricks, we strive to provide comprehensive benefits and perks that meet the needs of all of our employees. For specific details on the benefits offered in your region click here.\n\nOur Commitment to Diversity and Inclusion\n\nAt Databricks, we are committed to fostering a diverse and inclusive culture where everyone can excel. We take great care to ensure that our hiring practices are inclusive and meet equal employment opportunity standards. Individuals looking for employment at Databricks are considered without regard to age, color, disability, ethnicity, family or marital status, gender identity or expression, language, national origin, physical and mental ability, political affiliation, race, religion, sexual orientation, socio-economic status, veteran status, and other protected characteristics.\n\nCompliance\n\nIf access to export-controlled technology or source code is required for performance of job duties, it is within Employer's discretion whether to apply for a U.S. government license for such positions, and Employer may decline to proceed with an applicant on this basis alone.\n\nTo apply: https://weworkremotely.com/remote-jobs/databricks-enterprise-account-executive-financial-services", "tags": ["Sales and Marketing"], "salary": "", "location": "USA Only", "first_seen": "2026-11-20T01:39:02.020517+00:00", "is_new": false}, {"id": "Freelancer:https://www.freelancer.com/projects/data-analysis/Asia-Tourism-Efficiency-Papers-40826278", "source": "Freelancer", "kind": "Freela", "title": "Asia Tourism Efficiency Papers", "company": "Cliente Freelancer", "url": "https://www.freelancer.com/projects/data-analysis/Asia-Tourism-Efficiency-Papers-40826278", "date": "2026-11-19T15:36:10+00:00", "desc": "I need two separate, publishable-quality research papers that will feed directly into my PhD dissertation on tourism productivity and efficiency across Asian economies. Both studies must apply Data Envelopment Analysis and the Malmquist Productivity Index to a broad country set t…", "full": "I need two separate, publishable-quality research papers that will feed directly into my PhD dissertation on tourism productivity and efficiency across Asian economies. Both studies must apply Data Envelopment Analysis and the Malmquist Productivity Index to a broad country set that spans South, Southeast, and East Asia, explicitly including India. \n\nCore empirical inputs will be tourism arrivals, tourism receipts, and tourism employment for each country, covering the period 2010-2026. I will supply any institutional materials from my university on formatting; you will handle everything else—data acquisition or verification, coding (Stata, R, or Python are all fine), robustness checks, interpretation, and full manuscript write-up ready for submission to an SSCI-indexed economics journal. \n\nDeliverables \n• Paper 1: Benchmarking Tourism Productivity and Efficiency in Selected Asian Countries: A DEA Perspective\nUse malmquist productivity index and dea ccr and bcc model \n• Paper 2: Towards sustainable tourism in Asia: a DEA framework for balancing revenue and emissions\nUse BCC DEA AND SBM DEA\n• Clean datasets and commented code files \n• Tables, figures, and reference lists in APA style \n• Brief methodology note so I can explain your steps during my viva \n\nBoth papers must pass Turnitin, show clear policy implications for Asian tourism development, and be accompanied by a short slide deck summarising key findings.", "tags": ["Data Processing", "Research", "Research Writing", "Data Mining", "Statistical Analysis", "SPSS Statistics"], "salary": "INR 12500.0–37500.0", "location": "", "first_seen": "2026-11-20T01:39:02.020517+00:00", "is_new": false}, {"id": "Freelancer:https://www.freelancer.com/projects/data-analysis/Asia-Tourism-Efficiency-Papers", "source": "Freelancer", "kind": "Freela", "title": "Asia Tourism Efficiency Papers", "company": "Cliente Freelancer", "url": "https://www.freelancer.com/projects/data-analysis/Asia-Tourism-Efficiency-Papers", "date": "2026-11-19T15:11:54+00:00", "desc": "I need two separate, publishable-quality research papers that will feed directly into my PhD dissertation on tourism productivity and efficiency across Asian economies. Both studies must apply Data Envelopment Analysis and the Malmquist Productivity Index to a broad country set t…", "full": "I need two separate, publishable-quality research papers that will feed directly into my PhD dissertation on tourism productivity and efficiency across Asian economies. Both studies must apply Data Envelopment Analysis and the Malmquist Productivity Index to a broad country set that spans South, Southeast, and East Asia, explicitly including India. \n\nCore empirical inputs will be tourism arrivals, tourism receipts, and tourism employment for each country, covering the period 2010-2026. I will supply any institutional materials from my university on formatting; you will handle everything else—data acquisition or verification, coding (Stata, R, or Python are all fine), robustness checks, interpretation, and full manuscript write-up ready for submission to an SSCI-indexed economics journal. \n\nDeliverables \n• Paper 1: Benchmarking Tourism Productivity and Efficiency in Selected Asian Countries: A DEA Perspective\nUse malmquist productivity index and dea ccr and bcc model \n• Paper 2: Towards sustainable tourism in Asia: a DEA framework for balancing revenue and emissions\nUse BCC DEA AND SBM DEA\n• Clean datasets and commented code files \n• Tables, figures, and reference lists in APA style \n• Brief methodology note so I can explain your steps during my viva \n\nBoth papers must pass Turnitin, show clear policy implications for Asian tourism development, and be accompanied by a short slide deck summarising key findings.", "tags": ["Data Processing", "Research", "Research Writing", "Data Mining", "Statistical Analysis", "SPSS Statistics"], "salary": "INR 12500.0–37500.0", "location": "", "first_seen": "2026-11-20T01:39:02.020517+00:00", "is_new": false}, {"id": "Freelancer:https://www.freelancer.com/projects/api/Python-Fix-NBA-Stats-API", "source": "Freelancer", "kind": "Freela", "title": "Python Fix NBA Stats API 403", "company": "Cliente Freelancer", "url": "https://www.freelancer.com/projects/api/Python-Fix-NBA-Stats-API", "date": "2026-11-19T14:21:31+00:00", "desc": "I have an existing Python NBA player-stat collector running on an AWS Windows server. It receives live player statistics from NBA endpoints but intermittently gets HTTP 403 / Access Denied responses. The program can remain running while fresh NBA data stops arriving. I need an ex…", "full": "I have an existing Python NBA player-stat collector running on an AWS Windows server. It receives live player statistics from NBA endpoints but intermittently gets HTTP 403 / Access Denied responses. The program can remain running while fresh NBA data stops arriving.\n\nI need an experienced developer to diagnose the cause and implement a reliable solution while preserving the feed’s speed.\n\nCurrent setup\n- Python on Windows Server / AWS.\n- Existing collector and reader in C:\\NBAReader81.\n- NBA player statistics published to local JSON files.\n- ESPN and BallDontLie available for comparison and fallback.\n- A residential proxy has been tested, but 403 errors still occur.\n- A separate live trading application consumes the feed.\nWork required\n1. Identify whether failures come from the request implementation, proxy/session handling, duplicate collectors, request volume, cooldown logic, or upstream access restrictions.\n2. Implement and test a solution using permitted access methods. If provider authorization or a licensed source is necessary, document that clearly.\n3. Ensure one game’s failure does not stop updates for other games.\n4. Make recovery automatic and report why data is unavailable.\n5. Preserve the existing freshness limits: receipt age no more than 6 seconds and source age no more than 30 seconds.\n6. Verify recovery from temporary Windows file-write failures.\n7. Leave one dependable double-click launcher.\nAcceptance test\n\nDuring live NBA games, demonstrate player-stat changes reaching the reader. Run a 10-minute read-only comparison against ESPN and BallDontLie, matching the same player, game, and rebound change. Report fresh-data availability, errors, recovery times, and median lead or lag where matching observations exist.\n\nCritical restriction\n\nKeep the existing trading application running. Do not change trading rules, credentials, orders, positions, or account settings. Test proposed changes separately before deployment.\n\nPlease include relevant Python/API experience, your diagnostic approach, availability during live NBA games, and a fixed-price quote for an initial diagnostic milestone. Success must be demonstrated with live measurements, not just one successful HTTP request", "tags": ["PHP", "Python", "Web Scraping", "Software Architecture", "Amazon Web Services", "API"], "salary": "USD 250.0–750.0", "location": "", "first_seen": "2026-11-20T01:39:02.020517+00:00", "is_new": false}, {"id": "Freelancer:https://www.freelancer.com/projects/ai-automation/Automated-Daily-Faceless-Video-Workflow", "source": "Freelancer", "kind": "Freela", "title": "Automated Daily Faceless Video Workflow form creating to uplod using AI automation", "company": "Cliente Freelancer", "url": "https://www.freelancer.com/projects/ai-automation/Automated-Daily-Faceless-Video-Workflow", "date": "2026-11-19T13:42:54+00:00", "desc": "I’m looking for a streamlined, budget-friendly system that turns a single prompt into a complete YouTube-ready video every day—no manual touch from me until final review. Scope • Topic generation: Each morning the workflow should ask an AI (e.g., OpenAI, Gemini) to create a brief…", "full": "I’m looking for a streamlined, budget-friendly system that turns a single prompt into a complete YouTube-ready video every day—no manual touch from me until final review.\n\nScope\n• Topic generation: Each morning the workflow should ask an AI (e.g., OpenAI, Gemini) to create a brief script around History and interesting facts. The angle must stay within the broader “news, facts, or educational” style.\n• Video production: Convert that script into a short faceless video (30–90 sec is ideal). A synthetic voiceover, dynamic text-on-screen, and royalty-free background visuals/music are fine as long as no people’s faces appear.\n• Upload: When the render finishes, automatically upload the file to my YouTube channel via the YouTube Data API, set the visibility to Unlisted (or Draft if you prefer the Studio API), and drop the link in a Google Sheet or email summary so I can approve and publish.\n• Cost control: Use free tiers or very low-cost tools wherever possible; paid APIs must be optional or kept minimal.\n\nWhat I need from you\n1. A fully working automation (scripts, no-code workflow, or a mix) that can run on a modest VPS or my local machine.\n2. Clear setup instructions so I can replicate or adjust the pipeline later.\n3. A quick demo showing one video generated end-to-end.\n\nIf you’ve already stitched together tools like Python, Zapier/Make, FFmpeg, TTS engines, or Canva APIs, great—show me how you’ll adapt them here. Let’s keep it simple, reliable, and inexpensive while delivering a fresh, engaging history fact video to my channel every single day.", "tags": ["PHP", "Python", "Video Services", "Animation", "After Effects", "Video Production"], "salary": "INR 1500.0–12500.0", "location": "", "first_seen": "2026-11-20T01:39:02.020517+00:00", "is_new": false}, {"id": "Freelancer:https://www.freelancer.com/projects/trading/Dhan-Autotrading-Bot-Development", "source": "Freelancer", "kind": "Freela", "title": "Dhan Autotrading Bot Development", "company": "Cliente Freelancer", "url": "https://www.freelancer.com/projects/trading/Dhan-Autotrading-Bot-Development", "date": "2026-11-19T13:36:38+00:00", "desc": "I'm looking for an experienced developer to create a trading bot for Dhan. The bot should: - Trade Indian stocks and options contracts. - Use price and technical indicators for buy/sell decisions. Ideal Skills and Experience: - Proficiency in trading and financial markets, partic…", "full": "I'm looking for an experienced developer to create a trading bot for Dhan. \n\nThe bot should:\n- Trade Indian stocks and options contracts.\n- Use price and technical indicators for buy/sell decisions.\n\nIdeal Skills and Experience:\n- Proficiency in trading and financial markets, particularly Indian stocks and options.\n- Strong programming skills, preferably in Python or similar languages.\n- Experience with technical indicators and trading algorithms.\n- Familiarity with Dhan platform and its API.\n\nPlease provide examples of similar work done.", "tags": ["PHP", "Python", "Software Architecture", "Financial Markets", "C++ Programming", "Financial Analysis"], "salary": "INR 600.0–1500.0", "location": "", "first_seen": "2026-11-20T01:39:02.020517+00:00", "is_new": false}, {"id": "Freelancer:https://www.freelancer.com/projects/github/GitHub-Repository-Audit-Demo-Portal", "source": "Freelancer", "kind": "Freela", "title": "GitHub Repository Audit and Demo Portal", "company": "Cliente Freelancer", "url": "https://www.freelancer.com/projects/github/GitHub-Repository-Audit-Demo-Portal", "date": "2026-11-19T11:22:23+00:00", "desc": "GITHUB AUDIT: 65 REPOSITORIES, TESTING AND WEB DEMO PORTAL Company: NEVIE-GLOBAL Budget: USD $30-$60 fixed, total Remote project. 68 repositories identified; 65 require review and testing. OBJECTIVE We need an experienced GitHub/open-source developer to assess 65 repositories, de…", "full": "GITHUB AUDIT: 65 REPOSITORIES, TESTING AND WEB DEMO PORTAL\n\nCompany: NEVIE-GLOBAL\nBudget: USD $30-$60 fixed, total\nRemote project. 68 repositories identified; 65 require review and testing.\n\nOBJECTIVE\n\nWe need an experienced GitHub/open-source developer to assess 65 repositories, determine which are technically functional and commercially reusable, install and test feasible applications, and build a simple centralized web portal linking to working demonstrations. We want reproducible evidence, not AI-generated descriptions presented as tests.\n\n1. REPOSITORY INVENTORY\n\nFor every repository, record: GitHub URL, name, purpose, category, main language/framework, last activity, release, maintenance status, documentation, operating systems, installation instructions, Docker support, database/API requirements, dependencies, existing tests and apparent risks. Flag duplicates, abandoned projects, incomplete code and unavailable dependencies.\n\n2. LICENSE AND COMMERCIAL REVIEW\n\nIdentify the exact license and version, license file and third-party dependency licenses. Check commercial use, modification, redistribution, SaaS hosting, white-label potential, copyright notices, copyleft/source disclosure, trademarks and other restrictions. Separate legal permission from technical feasibility. Missing or unclear rights must be flagged; do not guarantee legal compliance.\n\n3. NEVIE P0-P5 PRELIMINARY RANKING\n\nP0: verified maximum legal freedom, including third-party code review.\n\nP1: verified permissive commercial license with manageable obligations.\n\nP2: commercially usable with specific obligations.\n\nP3: conditional use due to material licensing or technical constraints.\n\nP4: high-risk, insecure, unstable or impractical.\n\nP5: unsuitable for our intended commercial use.\n\nSupport each classification with evidence. Never award P0 solely from an open-source label. NEVIE approves final rankings.\n\n4. INSTALLATION AND REAL TESTING\n\nUse an isolated environment (Docker or equivalent), never our production systems. Where feasible: clone, install dependencies, configure, start, access UI/API, run existing tests, test key features, capture logs/screenshots, and document reproducible steps.\n\nTest authentication, data handling, API, integrations, errors and basic security only when applicable. For libraries or CLI tools, use appropriate command/unit tests.\n\nRecord failures and precise reasons. Distinguish: REVIEWED, INSTALL ATTEMPTED, INSTALLED, FUNCTIONALLY TESTED, DEMO CONNECTED, BLOCKED and UNSUITABLE.\n\nNo functional-test claim without execution proof.\n\n5. BASIC SECURITY CHECKS\n\nLook for known vulnerable/outdated dependencies, exposed secrets, hardcoded credentials, unsafe defaults, suspicious scripts and excessive permissions.\n\nRecord severity and evidence. No unauthorized external penetration tests. A basic scan is not a complete security audit.\n\n6. CENTRAL WEB DEMO PORTAL\n\nCreate a lightweight, mobile-friendly dashboard listing all 65 repositories with name, category, description, technology, license, P0-P5 ranking, audit/test status, commercial suitability, GitHub URL and demo URL where available.\n\nShow totals for reviewed, installed, tested, connected and blocked items.\n\nPrefer search/filter by category, license, ranking and status.\n\nFor applications actually deployed, provide working access links and safe demo credentials if needed.\n\nSeparate services or links are acceptable; do not merge unrelated codebases.\n\nA catalog link alone does not count as a running demo. Hosting or paid infrastructure requires prior approval.\n\n7. COMMERCIAL FEASIBILITY\n\nEvaluate relevance for AI agents, automation/n8n, CRM, ERP, POS, cybersecurity, websites, e-commerce, SaaS, mobile, education, analytics, industrial software and IoT.\n\nIdentify usable now, needs fixes, requires major development or unsuitable.\n\nEstimate extra integration effort, hosting/maintenance requirements and major risks.\n\nDo not describe a demo-ready tool as production-ready without evidence.\n\n8. AUTOMATION\n\nUse GitHub API, license/dependency scanners, scripts, CI and containerized tests to work efficiently.\n\nClearly label automated metadata checks versus manual installation and verified functional tests.\n\nNever invent results.\n\n9. DELIVERABLES\n\nA. Spreadsheet covering all 65 repositories and every required status.\n\nB. License/rights matrix with source evidence and uncertainties.\n\nC. Installation and functional-test report with screenshots/logs and reproduction steps.\n\nD. Source code and working demo portal with links to genuinely running applications, where feasible.\n\nE. List of deployable, promising, fixable, blocked and unsuitable projects.\n\nF. Final prioritized recommendations, approximate follow-on effort and handover instructions.\n\nG. Scripts and configuration templates created for this project, without secrets.\n\n10. ACCEPTANCE AND SAFETY\n\nAll 65 must be accounted for, but a repository must not be marked installed/tested without proof.\n\nDocument any blocked installation.\n\nProvide a precise count of apps actually deployed and connected.\n\nDo not access private repositories, change company GitHub, expose data, purchase services, deploy to production or subcontract without written approval.\n\nRespect third-party licenses and confidentiality. Deliver original project work under agreed contract terms.\n\n11. WORKFLOW\n\nPhase 1: confirm scope and method.\n\nPhase 2: pilot on 5 representative repositories.\n\nPhase 3: automated inventory/review of all 65.\n\nPhase 4: prioritize and run feasible installations/tests.\n\nPhase 5: deliver demo portal and evidence.\n\nPhase 6: final report and handover.\n\nSuggest your own realistic schedule and milestones.\n\n12. PRICE AND SCOPE\n\nTotal available budget is USD $30-$60 fixed.\n\nWe favor a highly automated assessment and a limited but real demo implementation.\n\nWe understand that manually installing and fully integrating all 65 complex applications may not fit this budget.\n\nIn your bid, specify EXACTLY how many repositories you will review…", "tags": ["JavaScript", "Python", "Linux", "Git", "Typescript", "Docker"], "salary": "USD 30.0–60.0", "location": "", "first_seen": "2026-11-20T01:39:02.020517+00:00", "is_new": false}, {"id": "WeWorkRemotely:https://weworkremotely.com/remote-jobs/proxify-ab-senior-dbt-developer-analytics-engineer", "source": "WeWorkRemotely", "kind": "Emprego remoto", "title": "Senior dbt Developer (Analytics Engineer)", "company": "Proxify AB", "url": "https://weworkremotely.com/remote-jobs/proxify-ab-senior-dbt-developer-analytics-engineer", "date": "2026-11-19T11:16:48+00:00", "desc": "Headquarters: Sweden URL: http://career.proxify.io The Role: We are looking for a Senior dbt Developer to lead the transformation of our clients' raw enterprise data into clean, high-performance, business-ready data models. In this role, you will own our clients' dbt architecture…", "full": "Headquarters: Sweden\n\nURL: http://career.proxify.io\n\nThe Role:\n\nWe are looking for a Senior dbt Developer to lead the transformation of our clients' raw enterprise data into clean, high-performance, business-ready data models. In this role, you will own our clients' dbt architecture, standardizing how data is modeled, tested, documented, and deployed across their entire cloud data warehouse.\n\nThis role requires an engineer who treats analytics code like software: using version control, writing automated tests, optimizing warehouse compute costs, and implementing continuous integration (CI) pipelines. You will transform complex pipelines into dry, modular data environments that enable fast, accurate business decision-making.\n\nWhat we are looking for:\n\n• 3+ years of deep, hands-on production experience architecting complex dbt Core or dbt Cloud projects.\n\n• Master-level proficiency in writing highly complex, optimized, and readable SQL. Deep understanding of dimensional modeling (Kimball methodology), Data Vault 2.0, or wide-table strategies for analytics.\n\n• Proven track record in configuring and managing large datasets within modern platforms like Snowflake, Google BigQuery, or Databricks.\n\n• Strong version control experience using Git and setting up automated CI/CD workflows (e.g., Slim CI via GitHub Actions or GitLab CI) to test data changes before production deployment.\n\n• Experience extending dbt functionality using Jinja templating, writing custom macros, and implementing st for you\n\nSkip the typical recruitment roadblocks and biases with personally matched positions.\n\nOne seamless process, multiple opportunities\n\nA one-time contracting process for endless opportunities, with no extra assessments.\n\nCompensation\n\nEnjoy the same pay, every month with positions landed through Proxify.\n\nTo apply: https://weworkremotely.com/remote-jobs/proxify-ab-senior-dbt-developer-analytics-engineer", "tags": ["All Other Remote"], "salary": "", "location": "Anywhere in the World", "first_seen": "2026-11-20T01:39:02.020517+00:00", "is_new": false}, {"id": "Freelancer:https://www.freelancer.com/projects/android-sdk/Android-APK-EncryptionTelegram-BOT", "source": "Freelancer", "kind": "Freela", "title": "Android APK EncryptionTelegram BOT Expert", "company": "Cliente Freelancer", "url": "https://www.freelancer.com/projects/android-sdk/Android-APK-EncryptionTelegram-BOT", "date": "2026-11-19T10:01:15+00:00", "desc": "Urgently Hiring – Android Encryption & Security Developer We are looking for an experienced Android Encryption & Application Security Developer for an existing encryption project. The project already has complete source code and project files. The developer must be capable of und…", "full": "Urgently Hiring – Android Encryption & Security Developer\n\nWe are looking for an experienced Android Encryption & Application Security Developer for an existing encryption project.\n\nThe project already has complete source code and project files. The developer must be capable of understanding the entire existing codebase, analysing its architecture, reconstructing the source code, and implementing new encryption and security solutions according to our requirements.\n\nRequired Technical Skills\n\n1. Java & Android Development\n * Strong knowledge of Java.\n * Android application architecture and source-code analysis.\n * Understanding of Android SDK, Gradle and build systems.\n * APK structure and DEX file analysis.\n2. Python Development\n * move from reactive support towards smarter, more proactive IT operations.\n\nWhat you'll do\n\nOwn and improve our IT operations\n\n• Act as a senior escalation point for complex IT incidents, requests and technical challenges, taking ownership through to resolution.\n\n• Help maintain secure, reliable and scalable internal technology systems.\n\n• Apply ITIL best practices across incident, change, problem and service management.\n\n• Improve service performance, documentation, operational processes and the overall employee experience.\n\n• Work closely with the wider IT team to balance daily support with longer term engineering projects.\n\nBuild smarter systems through AI and automation\n\n• Identify opportunities to automate repetitive tasks and improve workflows across IT.\n\n• Design and implement AI powered solutions that improve service delivery, productivity and operational efficiency.\n\n• Improve employee onboarding, offboarding, access management and software lifecycle processes.\n\n• Use APIs, integrations, scripting and automation tools to connect systems and remove unnecessary manual work.\n\n• Explore emerging AI technologies and turn promising ideas into practical solutions, with appropriate security and governance.\n\nThink like a product owner\n\n• Take ownership of specific IT services and capabilities, from identifying problems through to delivering improvements.\n\n• Work with stakeholders to understand their needs and prioritise improvements based on business impact.\n\n• Build and maintain clear roadmaps and project backlogs.\n\n• Measure the success of improvements through service quality, efficiency, reliability and employee experience.\n\n• Lead technical changes, migrations and improvements with clear communication, risk management and planning.\n\nCollaborate across Typeform\n\n• Partner with Security, People, Finance, Procurement and Engineering to deliver secure and effective technology solutions.\n\n• Communicate technical concepts clearly to both technical and nontechnical colleagues.\n\n• Share knowledge, improve documentation and support the development of other IT team members.\n\n• Help create a culture of ownership, continuous improvement and experimentation.\n\nWhat you'll bring\n\n• Strong experience in corporate IT engineering, systems engineering or IT service management within a modern SaaS or technology company.\n\n• ITIL certification and practical experience applying ITIL principles across incident, change, problem and service management.\n\n• Proven experience troubleshooting complex issues across corporate IT systems, identity, access, devices, applications and integrations.\n\n• Strong hands on experience with modern IT environments, particularly Apple devices, Okta, Google Workspace, Slack and Atlassian.\n\n• Experience building automation using APIs, scripting, integrations or workflow automation tools.\n\n• Practical experience using AI to improve IT operations, support processes or internal productivity.\n\n• Experience improving employee lifecycle processes, including onboarding, offboarding, provisioning and access management.\n\n• Strong problem solving skills and the ability to take ownership of technical challenges from investigation through to resolution.\n\n• A product mindset, with experience prioritising improvements, managing stakeholders and delivering measurable outcomes.\n\n• Excellent communication skills and the ability to work effectively across technical and business teams.\n\nNice to have\n\n• Experience designing AI driven IT workflows or introducing AI into internal service operations.\n\n• Familiarity with AI agents, intelligent workflow orchestration and knowledge management systems.\n\n• Experience integrating HR, identity, finance, asset management and IT service platforms.\n\n• Experience building internal tooling, dashboards or operational reporting.\n\n• Exposure to security, compliance, endpoint management and IT governance.\n\n• Experience leading Customers include Uber, Pennymac, Airbnb, Doordash, and Anthropic.\n\nWe’re a team that thrives on solving complex problems with innovative solutions that advance our mission. Checkr is recognized on Forbes Cloud 100 2025 List and is a Y Combinator 2024 Breakthrough Company.\n\nReporting to the Senior Manager, Solutions Architect, you will lead and execute customer onboarding and technical delivery across Checkr's Guided API and partner integration programs. You will own a high volume of Guided API implementations end-to-end, deploy repeatable Workday integration patterns, and provide technical guidance and optimization support to existing customers. Partnering closely with Customer Success, Customer Support Engineering, Product, and Engineering, you will accelerate time-to-value for our customers and drive scalable platform adoption, fueling Checkr's growth.\n\nWhat you'll do\n\n• Lead and execute high-volume Guided API customer implementations end to end, from initial technical kickoff through successful go-live.\n\n• Deliver Workday and other partner integrations using established, repeatable implementation frameworks and best practices.\n\n• Provide responsive technical guidance, troubleshooting, and optimization support for existing customers and Customer Success Managers.\n\n• Execute data queries and analyze payloads to validate system configurations, troubleshoot integration issues, and confirm solution integrity.\n\n• Identify, document, and escalate complex, non-standard, or high-risk architectural challenges to senior Solutions Architects and Engineering.\n\n• Contribute to continuous improvement of implementation runbooks, developer documentation, and standard operating procedures to increase team efficiency.\n\nWhat you bring\n\n• 4+ years of experience in technical consulting, solutions engineering, implementation, or a customer-facing technical delivery role.\n\n• Strong technical grasp of RESTful APIs, webhooks, JSON, and hosted versus embedded/self-hosted integration architectures.\n\n• Proven hands-on experience supporting or delivering HRIS, HCM, or ATS integrations (e.g., Workday).\n\n• Demonstrated ability to write and run basic-to-moderate data queries to troubleshoot issues and validate technical workflows.\n\n• Exceptional organizational and multitasking abilities, with a track record of managing a high volume of concurrent implementations without sacrificing quality or timeline commitments.\n\n• An A-player mindset with a strong bias for action: you raise the bar, move with urgency, stay resilient through ambiguity, and take ownership to deliver meaningful outcomes.\n\n#LI-TD1\nPay Transparency Disclosure\n\nWe use geographic cost of labor as an input to develop ranges for our roles and as such, each location where we hire may have a different range. If this role is remote, we have listed the top to the bottom of the possible range, but we will specify the target range for an exact location when you are selected for a recruiting discussion. For more information on our compensation philosophy, see our website.\n\nOn-target Earnings OR Base Salary range (Denver, CO)\n$133,000—$156,000 USD\n\nWhat We Offer\n\n• A fast-paced and collaborative environment\n\n• Learning and development allowance\n\n• Competitive cash and equity compensation, and opportunity for advancement\n\n• 100% medical, dental, and vision coverage\n\n• Up to $25K reimbursement for fertility, adoption, and parental planning services\n\n• Flexible PTO policy\n\n• Monthly wellness stipend\n\nAt Checkr, we believe an in office work environment strengthens collaboration, drives innovation, and encourages connection. Our hub locations are Denver, CO; San Francisco, CA; Nashville, TN; and Santiago, Chile. Individuals are expected to work from the office 3+ days a week. In-office perks are provided, such as lunch five times a week, a commuter stipend, and an abundance of snacks and beverages. A relocation stipend may be available for those willing to relocate to a Checkr hub location.\n\nEqual Employment Opportunities at Checkr\nCheckr is committed to building the best product and company, which requires hiring talented and qualified individuals with a diverse set of perspectives and lived experiences. Checkr believes in hiring people of all backgrounds, including those whose histories are impacted by the justice system in accordance with local, state, and/or federal laws, including the San Francisco’s Fair Chance Ordinance.\n\nApplicant Privacy Policy\nIf you are a California resident or are located in Alberta or British Columbia, our Applicant Privacy Policy applies to our collection and processing of your personal information when you apply for a role with us or otherwise participate in our recruitment process.\n\nFor applicants in Massachusetts: It is unlawful in Massachusetts to require or administer a lie detector test as a condition of employment or continued employment. An employer who violates this law shall be subject to criminal penalties and civil liability.\n\n*Legitimate Checkr emails will always include our official domain name after the @ symbol (e.g., name@checkr.com or name@ext.checkr.com).\n\nTo apply: https://weworkremotely.com/remote-jobs/checkr-solutions-architect", "tags": ["Back-End Programming"], "salary": "", "location": "Anywhere in the World", "first_seen": "2026-11-20T01:39:02.020517+00:00", "is_new": false}, {"id": "Freelancer:https://www.freelancer.com/projects/ai-chatbot-development/Powered-WhatsApp-Assistant-Development", "source": "Freelancer", "kind": "Freela", "title": "AI-Powered WhatsApp Assistant Development", "company": "Cliente Freelancer", "url": "https://www.freelancer.com/projects/ai-chatbot-development/Powered-WhatsApp-Assistant-Development", "date": "2026-11-19T05:27:42+00:00", "desc": "I'm looking for a developer to create an AI-powered WhatsApp personal assistant. This assistant will be essential for automating various tasks and managing workflows efficientl
