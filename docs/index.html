<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d12;--bg2:#12151c;--card:#161a23;--card2:#1c212c;--ink:#eef1f6;--mute:#8a93a6;--line:#252b37;--acc:#7c5cff;--acc2:#22d3ee;--new:#ff5d73;--free:#22c55e;--br:#facc15;--r:18px}
@media(prefers-color-scheme:light){:root{--bg:#f4f5fb;--bg2:#fff;--card:#fff;--card2:#f7f8fc;--ink:#12141a;--mute:#626b7f;--line:#e5e7ef}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font:15px/1.5 Inter,-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
body:before{content:"";position:fixed;inset:-20% -10% auto;height:520px;background:radial-gradient(600px 300px at 20% 20%,#7c5cff33,transparent),radial-gradient(500px 260px at 80% 0%,#22d3ee26,transparent);pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:1320px;margin:0 auto;padding:0 22px}
.hero{padding:42px 0 18px}.brand{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;font-size:22px;box-shadow:0 8px 30px #7c5cff55}
h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.03em}h1 span{background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;color:transparent}
.sub{color:var(--mute);margin-top:6px;font-size:14px}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0 4px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;min-width:120px}
.stat b{display:block;font-size:22px;font-weight:800}.stat small{color:var(--mute);font-size:12px}
.tools{position:sticky;top:0;z-index:5;padding:14px 0;backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 78%,transparent);border-bottom:1px solid var(--line)}
.search{display:flex;gap:10px;flex-wrap:wrap}
.search input{flex:1;min-width:220px;font:inherit;padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);outline:none}
.search input:focus{border-color:var(--acc);box-shadow:0 0 0 4px #7c5cff22}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{font:500 13px Inter,sans-serif;padding:7px 13px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--mute);cursor:pointer;transition:.15s}
.chip:hover{color:var(--ink);border-color:var(--mute)}.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
select.chip{appearance:none;padding-right:28px;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px;padding:22px 0 60px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;cursor:pointer;display:flex;flex-direction:column;gap:12px;transition:transform .18s,box-shadow .18s,border-color .18s;animation:in .35s both}
.card:hover{transform:translateY(-4px);border-color:#7c5cff66;box-shadow:0 18px 40px -18px #7c5cff88}
.card.seen{opacity:.5}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.head{display:flex;gap:12px;align-items:flex-start}
.av{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:18px;color:#fff}
.t{flex:1;min-width:0}.t h3{margin:0;font-size:16px;font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.t .co{color:var(--mute);font-size:13px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font:600 11px Inter,sans-serif;padding:3px 9px;border-radius:99px;letter-spacing:.02em}
.b-new{background:var(--new);color:#fff;position:absolute;top:-8px;right:14px;box-shadow:0 6px 16px #ff5d7366}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.m{font-size:12px;padding:4px 10px;border-radius:8px;background:var(--card2);color:var(--mute);border:1px solid var(--line)}
.m.k-free{color:var(--free);border-color:#22c55e55}.m.k-br{color:var(--br);border-color:#facc1555}.m.k-rem{color:var(--acc2);border-color:#22d3ee55}
.m.sal{color:var(--ink);font-weight:600}
.desc{color:var(--mute);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin:0}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;font-size:12px;color:var(--mute)}
.foot .go{color:var(--acc);font-weight:600}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:80px 0}
/* modal */
.ov{position:fixed;inset:0;background:#05060acc;backdrop-filter:blur(6px);z-index:20;display:none;align-items:center;justify-content:center;padding:20px}
.ov.open{display:flex;animation:fade .2s}@keyframes fade{from{opacity:0}}
.modal{width:min(760px,100%);max-height:90vh;background:var(--bg2);border:1px solid var(--line);border-radius:24px;overflow:hidden;display:flex;flex-direction:column;animation:pop .25s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{transform:translateY(20px) scale(.97);opacity:0}}
.mh{padding:26px 28px 18px;background:linear-gradient(135deg,#7c5cff22,#22d3ee11);border-bottom:1px solid var(--line);position:relative}
.mh .head .av{width:56px;height:56px;font-size:22px;border-radius:16px}
.mh h2{margin:0;font-size:22px;line-height:1.25;letter-spacing:-.02em}
.x{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;cursor:pointer}
.mb{padding:22px 28px;overflow:auto;flex:1}
.mb .full{white-space:pre-line;color:var(--ink);opacity:.88;font-size:14.5px;line-height:1.7}
.mb .tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.mf{padding:16px 28px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;background:var(--bg2)}
.apply{flex:1;text-align:center;text-decoration:none;font-weight:700;font-size:15px;color:#fff;padding:14px;border-radius:14px;background:linear-gradient(135deg,var(--acc),#5b8cff);box-shadow:0 10px 30px -8px #7c5cffaa;transition:.15s}
.apply:hover{transform:translateY(-1px);filter:brightness(1.1)}
.ghost{font:600 14px Inter,sans-serif;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.status{font-size:12px;color:var(--mute);padding-bottom:30px}
@media(max-width:600px){h1{font-size:24px}.mh,.mb,.mf{padding-left:18px;padding-right:18px}.ov{padding:0;align-items:flex-end}.modal{max-height:94vh;border-radius:24px 24px 0 0}}
</style></head><body>

ucharest-based-position-relocation-package-possible-93844", "source": "Arbeitnow", "kind": "Emprego remoto", "title": "Senior Sales Development Representative, with French (Strategic Accounts) (Bucharest-based position, relocation package possible)", "company": "veeamsoftware", "url": "https://www.arbeitnow.fr/jobs/companies/veeamsoftware/remote-senior-sales-development-representative-with-french-strategic-accounts-bucharest-based-position-relocation-package-possible-93844", "date": "2026-11-20T00:55:24+00:00", "desc": "Veeam is the Data and AI Trust Company, specializing in helping organizations ensure their data and AI are fully understood, secured, and resilient to enable the acceleration of safe AI at scale. As the market leader in both data resilience and data security posture management, V…", "full": "Veeam is the Data and AI Trust Company, specializing in helping organizations ensure their data and AI are fully understood, secured, and resilient to enable the acceleration of safe AI at scale. As the market leader in both data resilience and data security posture management, Veeam is built for the convergence of identity, data, security, and AI risk. Headquartered in Seattle with offices in more than 30 countries, Veeam protects over 550,000 customers worldwide, who trust Veeam to keep their businesses running. Join us as we go fearlessly forward together, growing, learning, and making a real impact for some of the world’s biggest brands.\n\n&nbsp;\n\nSDR for Strategic Accounts works alongside Veeam Account Executives to expand Veeam reach in existing Strategic accounts as well as net new prospects.&nbsp;\n\nSDRs qualify marketing-generated demand, which is demonstrated by engagement with marketing campaigns, specific actions, and meeting the scoring threshold. These initial marketing interactions are used as starting points to identify and engage other members of the buying group in an outbound effort to further validate buying signals and qualify the potential opportunity.&nbsp;\n\nJob Location: Bucharest, Romania (hybrid, 3 days/week to the office)\n\nWhat You’ll Do\n\n• Generate new demand (e.g., opportunities with buying group members attached) for the sales organization to pursue.\n\n• Qualify marketing-generated demand against established criteria before passing a qualified opportunity to the account executives.&nbsp;\n\n• Discover, validate, and reach out to additional personas or members of a buying group that may be involved in the buying decision and share this with sales.\n\n• Nurture predetermined groups of prospects for account executives by using multiple touch tactics or cadences to foster meaningful interactions and determine the level of interest for potential opportunities.\n\n• Comply with all demand management-related service-level agreements.\n\n• Track and manage account info, prospecting, qualification, and nurture activities, in the company’s CRM (Salesforce).\n\n• Allocate cadence workflows to all key players in opportunities and using Salesforce queue to manage daily outreach which includes outbound calls, voicemails, social outreach and emails.\n\n• Build and drive tight collaboration with aligned sales teams.\n\n• Reach and have meaningful, productive conversations with individuals representing the buyer personas targeted by the organization.\n\n• Coordinates sales activities within the expanded Veeam Team.\n\n• Develops and maintains a solid working knowledge of Veeam Software and related products and the benefits they provide to potential prospects.\n\n• Meet identified monthly KPIs (example: # signals converted to sales qualified opportunity, #prospecting opportunities created, number of meetings set up for sellers).\n\n• Participate in call out days and events.\n\n• Participate in ongoing enablement around product releases, marketing updates, sales methodology and customer buying behaviors.&nbsp;&nbsp;\n\nWhat You’ll Bring\n\n• 2 years plus experience in similar role&nbsp;\n\n• Bachelor’s Degree&nbsp;or&nbsp;a combination of education and experience will be considered&nbsp;\n\n• Fluent level of English and French\n\n• Previous&nbsp;sales experience, ideally&nbsp;of high-tech products/services,&nbsp;is&nbsp;a plus&nbsp;&nbsp;\n\n• Outbound calling and/or Revenue Development Representative experience&nbsp;is a plus&nbsp;\n\n• Technical education and technology understanding of storage backup, cloud backup and the key manufacturers in the industry that Veeam works with is preferred.&nbsp;\n\n• Ability to multi-task, prioritize, and manage time effectively.&nbsp;\n\n• Ability to adapt to changes in roles and responsibilities.&nbsp;\n\n• Social medias and social selling best practices&nbsp;\n\n• Collaboration across internal teams to ensure&nbsp;actionable&nbsp;results.&nbsp;\n\n• Ability to work independently with limited direction in a fast-paced environment; must be a high-energy, motivated self-starter.&nbsp;\n\n• Knowledge of basic business research tools (LinkedIn, Google, Salesforce or similar CRM, Hoovers)&nbsp;\n\n• Excellent correspondence skills (Outlook, Instant Messaging, and over the phone)&nbsp;\n\n• Exceptional verbal and written communication skills\n\nWhat You’ll Get\n\n• 21 annual vacation days, additional days based on tenure, plus&nbsp;4 extra global VeeaMe Days for self-care and 24 paid volunteer hours annually through Veeam Cares\n\n• Private health, dental, and vision insurance for employees and dependents, including outpatient care, hospitalization, pregnancy monitoring, and psychology support\n\n• Monthly lifestyle and daily meal benefits: 40 RON/day via Edenred and 600 RON/month through a flexible cafeteria platform\n\n• Life insurance (2× annual gross salary), critical illness, and disability coverage, plus vision reimbursement\n\n• Free access to Bookster library platform for borrowing your favorite books for free\n\n• Opportunities to learn and grow through on-demand libraries (LinkedIn Learning, O’Reilly), mentoring, workshops and learning events like our annual Global Day of Learning\n\n• An attractive relocation package to support your move to Bucharest, Romania\n\n#LI-JB1\n\nVeeam Software is an equal opportunity employer and does not tolerate discrimination in any form on the basis of race, color, religion, gender, age, national origin, citizenship, disability, veteran status or any other classification protected by federal, state or local law. All your information will be kept confidential.\n\nPersonal data collected during the recruitment process will be processed in accordance with our Recruiting Privacy Notice, which explains how your information is collected, used, and handled in connection with hiring activities. By applying for this position, you consent to this processing.&nbsp;\n\nBy submitting your application, you confirm that the information provided, including any supporting documents, is complete an…", "tags": ["Sales Development - EMEA 1009470"], "salary": "", "location": "Remote", "first_seen": "2026-11-20T01:39:02.020517+00:00", "is_new": false}, {"id": "Freelancer:https://www.freelancer.com/projects/css/Python-App-Backend-Frontend-Enhancement", "source": "Freelancer", "kind": "Freela", "title": "Python App Backend-Frontend Enhancement", "company": "Cliente Freelancer", "url": "https://www.freelancer.com/projects/css/Python-App-Backend-Frontend-Enhancement", "date": "2026-11-20T00:06:54+00:00", "desc": "I’m looking to bring our existing Python web application up to the standard our users expect. The system already works, but the moment someone tries to create, edit, or manage information the cracks show—glitches surface where the backend and frontend meet, newer ideas can’t be s…", "full": "I’m looking to bring our existing Python web application up to the standard our users expect. The system already works, but the moment someone tries to create, edit, or manage information the cracks show—glitches surface where the backend and frontend meet, newer ideas can’t be slotted in easily, and the interface still feels clunky.\n\nHere is what I need tackled in one coherent push:\n\n• Add the new features we have specced (mainly around richer data-entry forms and smarter list views). \n• Track down and fix the bugs that crop up during those create / edit flows—some sit in the API layer, others reveal themselves in the JavaScript that consumes those endpoints. \n• Refresh the UI so the updated functionality feels fluid and modern rather than patched on.\n\nThe codebase is pure Python on the server side (framework details and repo access will be shared once we start) and standard HTML / CSS / JS on the client. I’ll provide a short ticket list, staging credentials, and test data; you return clean, well-commented code and a brief changelog so QA can verify each fix or addition.\n\nDeliverable is a merge-ready pull request that: \n1. Implements the agreed new features end-to-end. \n2. Resolves the reported errors without introducing regressions (all existing unit tests must still pass). \n3. Polishes the affected pages for an intuitive user experience. \n4. Includes concise documentation of the changes.\n\nIf your workflow already covers version control, virtual environments, and issue tracking, you’ll feel right at home here.", "tags": ["JavaScript", "Python", "CSS", "Django", "Git", "Backend Development"], "salary": "USD 25.0–50.0", "location": "", "first_seen": "2026-11-20T01:39:02.020517+00:00", "is_new": false}, {"id": "Freelancer:https://www.freelancer.com/projects/data-analysis/Used-Car-Market-Demand-Analysis", "source": "Freelancer", "kind": "Freela", "title": "Used Car Market Demand Analysis", "company": "Cliente Freelancer", "url": "https://www.freelancer.com/projects/data-analysis/Used-Car-Market-Demand-Analysis", "date": "2026-11-19T23:17:31+00:00", "desc": "I need a concise, data-driven picture of current prices and demand in the used-car market. Your task is to gather recent sales and listing data, interpret supply-versus-demand trends, and present clear insights that can guide purchase timing and negotiation strategy. Focus exclus…", "full": "I need a concise, data-driven picture of current prices and demand in the used-car market. Your task is to gather recent sales and listing data, interpret supply-versus-demand trends, and present clear insights that can guide purchase timing and negotiation strategy. \n\nFocus exclusively on used vehicles; new, classic, and collectible segments are outside this scope. I expect a short written report supported by charts or tables that highlight:\n\n• Average asking vs. transaction prices by make, model, year, and mileage \n• Regional or online-platform variations revealing the best buying zones \n• Notable demand spikes or dips over the past 6-12 months \n\nI’m comfortable with whichever tools you prefer—Excel, Google Sheets, Python (pandas), or specialized automotive data platforms—as long as source links and methods are documented so I can replicate or update the analysis later. \n\nWhen you reply, tell me about similar market-pricing projects you’ve completed and the datasets or techniques you used; experience matters more to me than a polished proposal deck.", "tags": ["Python", "Research", "Excel", "Statistical Analysis", "Data Analytics", "Data Visualization"], "salary": "GBP 10.0–20.0", "location": "", "first_seen": "2026-11-20T01:39:02.020517+00:00", "is_new": false}, {"id": "Freelancer:https://www.freelancer.com/projects/data-analysis/Food-Content-Sales-Data-Insights", "source": "Freelancer", "kind": "Freela", "title": "Food Content & Sales Data Insights", "company": "Cliente Freelancer", "url": "https://www.freelancer.com/projects/data-analysis/Food-Content-Sales-Data-Insights", "date": "2026-11-19T23:04:58+00:00", "desc": "I need a clear, data-driven picture of how my food-related content and products are performing so I can turn those findings into higher sales. I will supply three data streams—social-media performance metrics, point-of-sale numbers, and customer reviews/comments—and I’d like you …", "full": "I need a clear, data-driven picture of how my food-related content and products are performing so I can turn those findings into higher sales. I will supply three data streams—social-media performance metrics, point-of-sale numbers, and customer reviews/comments—and I’d like you to blend them into one coherent analysis.\n\nYour task covers: \n• Performa konten media sosial: identify which posts, formats, and publishing times draw the most engagement and how that engagement correlates with sales spikes. \n• Data penjualan makanan: surface trends, seasonality, and product pairings that move revenue. \n• Ulasan dan komentar pelanggan: mine sentiment and keyword patterns to uncover what people love, complain about, or still want.\n\nEverything should roll up into actionable recommendations focused on one goal: meningkatkan penjualan makanan. Please use tools you’re comfortable with—Python (pandas, scikit-learn), R, SQL, Power BI, or Tableau are all fine as long as the final output is easy for a non-technical team to digest.\n\nDeliverables \n1. A concise written report (PDF or Google Doc) summarising key findings, supporting charts, and clear next steps. \n2. An interactive dashboard or notebook so I can explore the data myself. \n3. Source files and cleaned datasets so any follow-up work is straightforward.\n\nAcceptance criteria: insights must directly link content performance and customer sentiment to sales movement, and recommendations should be specific enough to test in upcoming campaigns.\n\nTimeline and communication cadence are flexible; suggest what you think is realistic, and I’ll confirm.", "tags": ["Python", "SQL", "Statistics", "Statistical Analysis", "SPSS Statistics", "Data Analytics"], "salary": "USD 25.0–50.0", "location": "", "first_seen": "2026-11-20T01:39:02.020517+00:00", "is_new": false}, {"id": "Arbeitnow:https://www.arbeitnow.com/jobs/companies/purestorage/remote-territory-account-executive-bw-hessen-396477", "source": "Arbeitnow", "kind": "Emprego remoto", "title": "Territory Account Executive - BW/Hessen", "company": "purestorage", "url": "https://www.arbeitnow.com/jobs/companies/purestorage/remote-territory-account-executive-bw-hessen-396477", "date": "2026-11-19T21:55:33+00:00", "desc": "Everpure (NYSE: P) has evolved from storage pioneer to data platform, closing fiscal 2026 with $3.7 billion in revenue, its first billion-dollar quarter, and accelerating growth into FY27. Our strategic agenda spans the companies defining the next era of technology - hyperscalers…", "full": "Everpure (NYSE: P) has evolved from storage pioneer to data platform, closing fiscal 2026 with $3.7 billion in revenue, its first billion-dollar quarter, and accelerating growth into FY27. Our strategic agenda spans the companies defining the next era of technology - hyperscalers, AI labs, the AI hardware supply chain, data platform providers, and the broader AI ecosystem.\n\nThis type of work—work that changes the world—is what the tech industry was founded on. So, if you're ready to seize the endless opportunities and leave your mark, come join us.\n\nThe Role\n\nThe Territory Account Executive (TAE) is a key growth role within Everpure (formerly Pure Storage) Germany's Go-To-Market organisation. This position focuses on driving growth across all accounts not currently managed by an Account Executive, including the full install base, dormant accounts, and new inbound opportunities. TAEs are responsible for expanding Pure’s footprint, reigniting customer relationships, and capturing new business through a combination of direct engagement and partner collaboration.\n\nAs a Territory Account Executive (TAE), you’ll play a pivotal role in bringing this vision to life - helping customers unlock the power of their data, modernise their infrastructure, and accelerate transformation. You’ll join our Commercial team in Germany, with the autonomy to own a dynamic territory, driving growth across a broad set of customers, from re-engaging dormant relationships to winning new logos.\n\nAt Pure, you’ll join a culture built on curiosity, innovation, and integrity. We celebrate diverse perspectives, challenge convention, and empower our people to think big, take bold action, and make a measurable impact. This is your opportunity to grow your career with one of the most innovative technology companies in the world and to do work that truly changes how businesses use data to compete and win.\n\n&nbsp;\n\nWhat You'll Do\n\n• Drive Account Growth &amp; Pipeline: Execute sales activities to generate revenue, manage a high-volume pipeline, and contribute to closing deals on a quarterly basis.\n\n• Execute Outreach &amp; Prospecting: Perform consistent, high-activity prospecting to penetrate new accounts, reach decision-makers, and learn how to win new business effectively.\n\n• Support Partner Strategy: Collaborate closely with Channel Partners and Partner Managers to align on customer engagement and utilise partner resources to advance opportunities.\n\n• Reactivate Customer Relationships: Focus on re-engaging dormant or inactive customers by discovering new business use cases and identifying potential refresh and expansion opportunities.\n\n• Build Foundational Skills: Develop and deliver proposals and business cases that clearly demonstrate the value of Pure's solutions, supported by internal experts.\n\n• Maintain Sales Discipline: Diligently manage sales technology (Salesforce), deliver accurate forecasts, and maintain strong time management to thrive in a fast-paced, team environment.\n\nWhat You Bring\n\n• Proven Sales Experience: Demonstrated success in direct, full-lifecycle B2B technology sales with a consistent record of meeting or exceeding sales metrics (KPIs).\n\n• Sales Drive &amp; Motivation: A high degree of self-motivation, strong time management skills, demonstrates initiative and the drive to learn quickly and succeed across both transactional and early-stage strategic sales motions.&nbsp;\n\n• Collaborative Mindset: Demonstrated success working with both internal teams and channel partners to ensure seamless customer engagement and shared goal achievement.\n\n• Digital Proficiency: Proficiency with core sales technologies, including Salesforce and G Suite, and an ability to use data to prioritise daily activities.&nbsp;\n\n• Communication &amp; Presence: Strong verbal and written communication skills suitable for engaging with business leaders and maintaining professional business relationships.\n\n• Resilience &amp; Focus: A competitive, positive attitude combined with strong organisational and time management skills necessary to handle a dynamic, high-activity territory.\n\n• Language Skills: Business Level, written and spoken, German and English language skills required.\n\nNice to Have\n\n• Industry Knowledge: Prior knowledge of the storage industry and familiarity with how data solutions drive business outcomes.\n\n• Channel Sales Expertise: Understanding of channel-led sales motions and experience collaborating effectively within the broader partner ecosystem.\n\n• Sales Training: Completion of a structured B2B sales methodology training (e.g., Business Value Selling or similar).\n\n• Digital Tools: Experience using digital prospecting and engagement tools (e.g., Outreach, LinkedIn Sales Navigator) to accelerate the sales cycle.\n\nJoin Everpure Germany team and be part of a team that's redefining data storage. Apply now and unleash your potential!\n\n#LI-Remote\n\n&nbsp;\nWHAT YOU CAN EXPECT FROM US:\n\n• Innovation: We celebrate those who think critically, like a challenge, and aspire to be trailblazers.\n\n• Growth: We give you the space and support to grow along with us and to contribute to something meaningful. We have been named Fortune's Best Workplaces in Technology™, Fortune's Best Workplaces in the Bay Area™, and certified as a Great Place to Work®!\n\n• Team: We build each other up and set aside ego for the greater good.\n\nAnd because we understand the value of bringing your full and best self to work, we offer a variety of perks to manage a healthy balance, including flexible time off, wellness resources, and company-sponsored team events. Check out http://benefits.everpuredata.com/ for more information.\n\nACCOMMODATIONS AND ACCESSIBILITY:\n\nCandidates with disabilities may request accommodations for all aspects of our hiring process. For more on this, contact us at OUR COMMITMENT TO A STRONG AND INCLUSIVE TEAM:\n\nWe’re forging a future where everyone finds their rightful place and where every voice matters. Where uniqueness isn’t just…", "tags": ["Sales"], "salary": "", "location": "Remote", "first_seen": "2026-11-20T01:39:02.020517+00:00", "is_new": false}, {"id": "Freelancer:https://www.freelancer.com/projects/docker/Fix-Failing-Python-Docker-Container", "source": "Freelancer", "kind": "Freela", "title": "Fix Failing Python Docker Container Build and Deployment on Cloud Rahti", "company": "Cliente Freelancer", "url": "https://www.freelancer.com/projects/docker/Fix-Failing-Python-Docker-Container", "date": "2026-11-19T20:48:24+00:00", "desc": "I need support to complete my 5 tasks, which are very simple for a DevOps engineer with Docker Container Cloud Kubernetes knowledge. I can pay 10 dollars for each task if someone is interested please let me know. I will share repos on chat; please let me know. Thanks", "full": "I need support to complete my 5 tasks, which are very simple for a DevOps engineer with Docker Container Cloud Kubernetes knowledge. I can pay 10 dollars for each task if someone is interested please let me know. I will share repos on chat; please let me know. Thanks", "tags": ["Python", "Linux", "Software Architecture", "Ubuntu", "Docker", "Cloud"], "salary": "EUR 2.0–6.0", "location": "", "first_seen": "2026-11-20T01:39:02.020517+00:00", "is_new": false}, {"id": "Freelancer:https://www.freelancer.com/projects/audio-processing/Audio-Sensor-Pattern-Detection", "source": "Freelancer", "kind": "Freela", "title": "Audio & Sensor Pattern Detection", "company": "Cliente Freelancer", "url": "https://www.freelancer.com/projects/audio-processing/Audio-Sensor-Pattern-Detection", "date": "2026-11-19T19:18:30+00:00", "desc": "A project will be developed to analyze patterns and identify sleep stages using microphone data recorded during sleep. Further details will be provided after an agreement is reached. Scope • Clean and pre-process the raw audio and sensor streams to remove obvious noise and artefa…", "full": "A project will be developed to analyze patterns and identify sleep stages using microphone data recorded during sleep. Further details will be provided after an agreement is reached.\n\nScope\n• Clean and pre-process the raw audio and sensor streams to remove obvious noise and artefacts. \n• Apply signal processing techniques (e.g., FFT, wavelet, filtering) and statistical analysis to highlight candidate repetitions. \n• Develop an algorithm or script—Python, MATLAB, or another well-documented environment is fine—that automatically flags segments where the audio and sensor signatures recur together or in a consistent sequence. \n• Produce concise visualisations or summary tables showing when and how often each pattern appears. \n\nDeliverables\n1. Well-commented source code/notebooks. \n2. A short report explaining methods, parameter choices, and the key findings. \n3. Processed datasets or indexes that map time stamps to detected patterns so I can inspect them quickly. \n\nSuccess criteria\n• Low false-positive rate on the flagged events. \n• Clear, reproducible steps so I can run the pipeline on new data. \n• Results packaged in a way that lets me verify individual detections by listening or plotting. \n\nIf you have experience with audio feature extraction, sensor fusion, or anomaly detection, your insight will be valuable. Let me know which libraries or toolkits you prefer and how you would tackle iterative testing to refine accuracy.", "tags": ["Python", "Matlab and Mathematica", "Algorithm", "Software Architecture", "Statistical Analysis", "Audio Processing"], "salary": "USD 10.0–30.0", "location": "", "first_seen": "2026-11-20T01:39:02.020517+00:00", "is_new": false}, {"id": "Arbeitnow:https://www.arbeitnow.ch/jobs/companies/celonis/remote-account-executive-cross-industries-174981", "source": "Arbeitnow", "kind": "Emprego remoto", "title": "Account Executive - Cross Industries", "company": "celonis", "url": "https://www.arbeitnow.ch/jobs/companies/celonis/remote-account-executive-cross-industries-174981", "date": "2026-11-19T18:55:33+00:00", "desc": "Celonis is the trusted platform to industrialize Enterprise AI. At our core is the Celonis Context Model — which combines process data, business knowledge, and intelligence into a living digital twin of the enterprise that AI can actually understand, turning AI's operational blin…", "full": "Celonis is the trusted platform to industrialize Enterprise AI. At our core is the Celonis Context Model — which combines process data, business knowledge, and intelligence into a living digital twin of the enterprise that AI can actually understand, turning AI's operational blind spots into operational clarity. World's leading companies trust Celonis and its global ecosystem of partners to make their AI agents, people, systems, and processes work together, achieving transformational outcomes. We believe there's a massive opportunity to unlock global productivity and sustainability by giving AI the context to understand how every business process really works. Join our mission to make processes work for people, companies, and the planet.\n\nThe Team:\n\nYou will join our high-performing Swiss sales team. We help leading enterprise organizations in Switzerland optimize their end-to-end processes, increase operational efficiency through our Process Intelligence platform, and provide the contextual layer to industrialize Enterprise AI.\n\nThe Role:\n\nApplying a value-driven consultative sales approach, you will build and grow relationships to drive sales cycles from discovery to value realization. You will be responsible for a portfolio of enterprise accounts headquartered in Switzerland, combining existing customers, where you will expand our footprint, with new / greenfield accounts, where you will win new logos for Celonis. Navigating complex organizations from operational leaders up to the C-suite, you will collaborate cross-functionally to understand your accounts' needs and drive the end-to-end sales cycle to a successful close.\n\nThe work you'll do:\n\n● &nbsp; &nbsp;Manage a balanced portfolio of existing customers (land-and-expand) and new / greenfield accounts (new logo acquisition)\n● &nbsp; &nbsp;Build pipeline in greenfield accounts through targeted prospecting and account planning\n● &nbsp; &nbsp;Engage stakeholders across lines of business, from operational leaders up to C-level\n● &nbsp; &nbsp;Drive Celonis Process Intelligence sales motions across the core enterprise value chain, translating business challenges into compelling, AI-enabled use cases that deliver measurable execution capacity\n● &nbsp; &nbsp;Hold an individual revenue target for closing six-figure+ deals within your accounts\n● &nbsp; &nbsp;Engage closely with partners e.g., consulting firms and SaaS vendors\n● &nbsp; &nbsp;Drive sales cycles through orchestrating virtual teams including business development representatives, marketing managers, partner managers, sales engineers / pre-sales, customer success managers, professional services, implementation partners...\n● &nbsp; &nbsp;Grow your skills through structured enablement, coaching and close collaboration with experienced Strategic Account Executives and your Sales Manager\n\n&nbsp;\n\nThe qualifications you need:\n\n●&nbsp; &nbsp; 3+ years of relevant experience in either one - or ideally both - of the following domains:\n○&nbsp; &nbsp;SaaS Sales: Track record of applying a consultative sales approach to sell complex B2B software solutions to enterprise accounts, ideally with experience in both expanding existing customers and winning new logos.\n○ &nbsp; &nbsp;AI / Management Consulting: Experience in a (boutique) consultancy, delivering AI or digital transformation projects with exposure to account management, client relationships, and business development.\n● &nbsp; &nbsp;A track record of meeting or exceeding targets, commitment, and successful career progression with your previous companies\n● &nbsp; &nbsp;A hunter mentality: proven ability to prospect, open doors and build pipeline in new accounts\n● &nbsp; &nbsp;Strong business acumen and a solid understanding of core processes and KPIs across the enterprise value chain (e.g., Finance, Procurement, Supply Chain)\n● &nbsp; &nbsp;Curiosity and the ability to quickly understand different industries and business models\n● &nbsp; &nbsp;Ability to build trusted relationships with Business and IT stakeholders and the confidence to engage up to the C-level\n● &nbsp; &nbsp;Grit, a hands-on mindset, strong discovery skills and a structured approach to running sales processes\n● &nbsp; &nbsp;Excellent communication and presentation skills in German (fluent) and English\n● &nbsp; &nbsp;Eagerness to learn and develop, open to feedback and coaching\n● &nbsp; &nbsp;Ability to adapt to a fast moving, ever changing, high growth environment and approach challenges with positivity, creative thinking, and a growth mindset\n● &nbsp; &nbsp;Willingness to be collaborative, inclusive, to embrace diversity and to have strong interpersonal skills #differentmakesusbetter\n● &nbsp; &nbsp;Ability to leverage internal resources and work as a team #bestteamwins\n\nZurich area location preferred; candidates based elsewhere in Switzerland must be available for weekly in-person presence and customer visits (primarily in German-speaking Switzerland).\n\n#LI-SS6\nWhat Celonis can offer you:\n\n• Pioneer Innovation: Work with the global leader in Process Mining and the Process Intelligence Graph to shape the future of AI-driven business operations.\n\n• Ownership from Day 1: Every full-time \"Celonaut\" is an owner, receiving Restricted Stock Units (RSUs) and merit-based refresh grants.\n\n• Unrivaled Family Support: Benefit from our inclusive parental leave policy—24 weeks of fully paid leave for primary carers and 12 weeks for supporting carers, available from your first day of employment.\n\n• Work-Life Integration: Enjoy Unlimited PTO (in applicable regions) and generous PTO globally, as well as a flexible hybrid work model that balances remote focus with vibrant office collaboration.\n\n• Continuous Growth: Elevate your skills through our 70-20-10 learning framework, mentorship programs, and access to a dedicated learning platform.\n\n• Holistic Well-being: Prioritize your health with subsidized Wellhub memberships, mental health counseling, and dedicated \"Wellness Weeks\" that pri…", "tags": ["Sales"], "salary": "", "location": "Remote", "first_seen": "2026-11-20T01:39:02.020517+00:00", "is_new": false}, {"id": "WeWorkRemotely:https://weworkremotely.com/remote-jobs/airbnb-senior-data-engineer-tech-foundations", "source": "WeWorkRemotely", "kind": "Emprego remoto", "title": "Senior Data Engineer Tech Foundations", "company": "Airbnb", "url": "https://weworkremotely.com/remote-jobs/airbnb-senior-data-engineer-tech-foundations", "date": "2026-11-19T18:31:48+00:00", "desc": "Headquarters: US - Remote Airbnb was born in 2007 when two hosts welcomed three guests to their San Francisco home, and has since grown to over 5 million hosts who have welcomed over 2 billion guest arrivals in almost every country across the globe. Every day, hosts offer unique …", "full": "Headquarters: US - Remote\n\nAirbnb was born in 2007 when two hosts welcomed three guests to their San Francisco home, and has since grown to over 5 million hosts who have welcomed over 2 billion guest arrivals in almost every country across the globe. Every day, hosts offer unique stays and experiences that make it possible for guests to connect with communities in a more authentic way.\n\nSenior Data Engineer, Enterprise Core Datasets, Tech Foundations\n\nThe Community You Will Join\n\nAt Airbnb, trustworthy data powers business decisions, product innovation, and operational efficiency. The Enterprise Core Datasets team builds the technical data foundations that help Airbnb understand how the business operates, where resources are invested, and how new technologies create value.\n\nOur scope spans high-impact datasets across the organization: measuring AI adoption, usage, and cost; understanding revenue, costs, and profitability through Unit Economics; integrating non-platform data from Jira and other enterprise applications; and powering critical company metrics such as Gross Booking Value and Revenue.\n\nYou will join a team that values thoughtful architecture, engineering rigor, and operational ownership. We collaborate with engineering, product, analytics, finance, and business teams to turn complex requirements into dependable, reusable data assets. We welcome strong engineers who are curious about the business and eager to solve problems across diverse domains.\n\nThe Difference You Will Make\n\nAs a Senior Data Engineer, you will design, build, and operate datasets that shape decisions across Airbnb. Your work will help the organization measure AI adoption and spending, understand the economics of its products, and connect enterprise application data to meaningful business and operational insights.\n\nYou will own complex data engineering projects from requirements gathering and technical design through implementation, validation, and production operations. Working closely with stakeholders and engineering partners, you will build maintainable data models and pipelines that accommodate new AI tools, products, cost categories, and enterprise systems while preserving clear definitions, traceability, and reliable historical data.\n\nOperating in an ecosystem that includes petabyte-scale datasets, you will improve correctness, freshness, performance, and cost efficiency. You will build reusable components that simplify source onboarding and reduce duplicated logic. Through design reviews, knowledge sharing, and mentorship, you will help strengthen the team’s engineering practices and contribute to Airbnb’s broader data community.\n\nA Typical Day\n\n• Design, build, and operate high-impact data pipelines across AI usage and cost, Unit Economics, enterprise applications, and critical financial metrics.\n\n• Partner with stakeholders to clarify how AI adoption, consumption, and spending are measured, and implement consistent data models that support those definitions.\n\n• Evolve Unit Economics datasets to connect revenue and diverse cost drivers, enabling teams to understand product profitability and resource efficiency.\n\n• Build reliable ingestion and transformation pipelines for non-platform systems such as Jira and other BizTech enterprise applications.\n\n• Translate complex requirements into clear source contracts, reusable fact and dimension models, and practical technical designs.\n\n• Develop configurable pipelines and shared components that simplify onboarding new data sources, products, and business requirements.\n\n• Implement automated testing, reconciliation, anomaly detection, and monitoring to protect data accuracy, completeness, and availability.\n\n• Plan and execute safe migrations and historical backfills through dependency analysis, validation, controlled cutovers, and recovery planning.\n\n• Optimize distributed processing, storage, and query performance to improve freshness and reduce compute costs.\n\n• Own production reliability for your datasets and pipelines through on-call participation, incident response, and improvements to systems and runbooks.\n\n• Contribute to technical planning and design reviews, mentor fellow engineers, and improve Airbnb’s Data Engineering Paved Path.\n\nYour Expertise\n\n• 5+ years of relevant industry experience, with a Bachelor’s or Master’s degree in Computer Science, Electrical Engineering, or a related field, or equivalent practical experience.\n\n• A track record of independently delivering complex data engineering projects, from requirements and technical design through implementation and sustained production ownership.\n\n• Strong expertise in SQL and programming skills in Python or Scala, with experience building maintainable, well-tested data systems.\n\n• Hands-on experience with distributed processing technologies such as Apache Spark and large-scale analytical storage systems.\n\n• Strong data modeling skills, including fact and dimension design, slowly changing dimensions, incremental processing, and historical data management.\n\n• Experience integrating heterogeneous sources, including APIs, enterprise applications, event data, and transactional systems, while managing schema changes and source reliability.\n\n• Proven ability to build reliable pipelines and execute migrations and backfills while preserving correctness and downstream compatibility.\n\n• Experience implementing data quality controls, observability, lineage, and governance practices, and troubleshooting production data issues.\n\n• The ability to diagnose performance bottlenecks and optimize distributed computation, storage, and query execution.\n\n• Strong collaboration and communication skills, including the ability to clarify requirements with business partners, explain technical tradeoffs, and coordinate delivery across teams.\n\n• Experience contributing to design and code reviews, sharing knowledge, and supporting the development of other engineers.\n\n• Curiosity and sound judgment when learning new domains a…", "tags": ["All Other Remote"], "salary": "", "location": "Anywhere in the World", "first_seen": "2026-11-20T01:39:02.020517+00:00", "is_new": false}, {"id": "WeWorkRemotely:https://weworkremotely.com/remote-jobs/gong-io-sr-manager-enterprise-sales", "source": "WeWorkRemotely", "kind": "Emprego remoto", "title": "Sr. Manager, Enterprise Sales", "company": "Gong.io", "url": "https://weworkremotely.com/remote-jobs/gong-io-sr-manager-enterprise-sales", "date": "2026-11-19T18:31:40+00:00", "desc": "Headquarters: Remote (US) Gong harnesses the power of AI to transform how revenue teams win. The Gong Revenue AI Operating System unifies data, insights, and workflows into a single, trusted system that observes, guides, and acts alongside the world’s most successful revenue team…", "full": "Headquarters: Remote (US)\n\nGong harnesses the power of AI to transform how revenue teams win. The Gong Revenue AI Operating System unifies data, insights, and workflows into a single, trusted system that observes, guides, and acts alongside the world’s most successful revenue teams. Powered by the Gong Revenue Graph, AI-powered intelligence, specialized agents, and trusted applications, Gong helps more than 5,000 companies around the world deeply understand their teams and customers, automate critical sales workflows, and close more deals with less effort. For more information, visit www.gong.io.\n\nAt Gong, you will join a company built on innovative products, ambitious goals, and passionate people. We are shaping the future of revenue intelligence and we want people who are excited to build what comes next. You will work with a team that dreams big, moves fast, and cares deeply about the craft and about each other. Here, transparency and trust are core to how we operate, and every person has the opportunity to make a visible impact. If you want to grow, stretch, and do work that truly matters, Gong is the place to do the best work of your career.\n\nAs an Enterprise Sales Leader, you will lead the growth of the enterprise segment, shaping and scaling a world-class sales organization by codifying strategy, optimizing execution, and driving long-term business impact. You will lead and grow a team of Enterprise Account Executives, driving revenue growth, team development, and overall success for the Enterprise segment at Gong.  This role may be based anywhere in the U.S., however, there is a strong preference for East region.\n\nRESPONSIBILITIES\n\n• Own and drive strategies to improve sales processes, team efficiency, and productivity.\n\n• Lead, hire, and develop Account Executives across regions.\n\n• Consistently meet or exceed team revenue and ARR targets.\n\n• Support team through complex sales cycles by understanding customer needs and aligning them with product value.\n\n• Define and refine a scalable, repeatable sales process in partnership with sales leadership.\n\n• Clear obstacles and provide support to help teams succeed.\n\n• Monitor pipeline health and forecast performance accurately.\n\n• Collaborate with Marketing, Product, and Customer Success to align on growth initiatives.\n\n• Use data to identify areas for improvement and guide decision-making.\n\nQUALIFICATIONS \n\n• 10+ years of experience in software sales, with at least 4+ years of managing a Enterprise sales team within enterprise accounts.\n\n• Track record of leading high-performing, distributed teams in fast-growth SaaS companies.\n\n• Proven success in exceeding revenue targets as both a leader and individual contributor.\n\n• Strong experience in recruiting, training, and developing sales teams from the ground up.\n\n• Excellent communication skills with the ability to influence at all levels, including VP and C-suite.\n\n• Deep understanding of sales leadership challenges and how to position value in a B2B environment.\n\n• Comfortable using CRM and sales tools for forecasting and performance management.\n\nPERKS & BENEFITS \n\n• We offer Gongsters a variety of medical, dental, and vision plans, designed to fit you and your family’s needs.\n\n• Wellbeing Fund - flexible wellness stipend to support a healthy lifestyle.\n\n• Mental Health benefits with covered therapy and coaching.\n\n• 401(k) program to help you invest in your future.\n\n• Education & learning stipend for personal growth and development.\n\n• Flexible vacation time to promote a healthy work-life blend.\n\n• Paid parental leave to support you and your family.\n\n• Company-wide recharge days each quarter.\n\n• Work from home stipend to help you succeed in a remote environment.\n\nThe annual OTE for this position is $350,000 - $400,000 USD.  \n\nCompensation is based on factors unique to each candidate, including, but not limited to, job-related skills, qualification, education, experience, and location. At Gong, we have a location-based compensation structure, which means there may be a different range for candidates in other locations. The total compensation package for this position, in addition to base compensation, may include incentive compensation, bonus, equity, and benefits. Some of our sales compensation programs also offer the potential to achieve above targeted earnings for those who exceed their sales targets. \n\nWe are always looking for outstanding Gongsters! So if this sounds like something that interests you regardless of compensation, please reach out. We may have more roles for you to consider and would love to connect.\n\nWe have noticed a rise in recruiting impersonations across the industry, where scammers attempt to access candidates' personal and financial information through fake interviews and offers. All Gong recruiting email communications will always come from the @gong.io domain. Any outreach claiming to be from Gong via other sources should be ignored.\n\nTo apply: https://weworkremotely.com/remote-jobs/gong-io-sr-manager-enterprise-sales", "tags": ["Customer Support"], "salary": "", "location": "Anywhere in the World", "first_seen": "2026-11-20T01:39:02.020517+00:00", "is_new": false}, {"id": "WeWorkRemotely:https://weworkremotely.com/remote-jobs/galileo-digital-nurse-practitioner-remote-ny-license", "source": "WeWorkRemotely", "kind": "Emprego remoto", "title": "Digital Nurse Practitioner (Remote, NY License)", "company": "Galileo", "url": "https://weworkremotely.com/remote-jobs/galileo-digital-nurse-practitioner-remote-ny-license", "date": "2026-11-19T18:31:23+00:00", "desc": "Headquarters: Remote, United States About Us Galileo is a team-based medical practice working to improve the quality and affordability of health care for all. Operating across 50 states, Galileo offers high-touch, data-driven, multi-specialty, longitudinal care to diverse and com…", "full": "Headquarters: Remote, United States\n\nAbout Us\n\nGalileo is a team-based medical practice working to improve the quality and affordability of health care for all. Operating across 50 states, Galileo offers high-touch, data-driven, multi-specialty, longitudinal care to diverse and complex patients—on the phone, in the home, and everywhere in between. Regional and national health plans, employers, and Fortune 500 organizations trust Galileo as the leading solution to improve population health. Founded by Dr. Tom X. Lee, the healthcare pioneer behind One Medical and Epocrates, Galileo is a team of leading innovators from healthcare, technology, and human-centered design. Our mission is to apply that talent and scientific thinking to transform society by solving our largest, toughest healthcare problems, while at the same time bringing patient and provider closer.\n\nAbout The Role\n\nGalileo is looking for culturally sensitive clinicians to join our digital-first, primary care medical group. In this role, you will use asynchronous text-based chat and synchronous video to provide high-quality, comprehensive and evidence-based primary care. As a part of our collaborative clinical care team, you will leverage data, technology, and operational rigor to optimize great patient outcomes while offering highly personalized care and shared decision making with patients. \n\nHere’s What You’ll Do:\n\n• Provide best-in-class care for Galileo patients managing complex and chronic illnesses through our innovative, proprietary app and technology and your excellent clinical judgment.\n\n• Provide compassionate and empathetic care to patients from age 0-100 across all needs, including complex, chronic medical conditions such as: diabetes, hypertension, obesity and mental health.\n\n• Work with a diverse patient population. We pride ourselves on fostering a culture that is inclusive of all backgrounds.\n\n• Solve patient problems in an efficient, nimble manner by drawing on resourcefulness, collaborating with team members to leverage their expertise, and a “can-do” approach.\n\nHow We Work\n\nGalileo is a 24/7 medical group utilizing asynchronous text-based chat and synchronous video to provide high-quality, comprehensive primary care. We work in 4-hour shifts (mornings, afternoons, evenings, overnight on weekdays and weekends). At 24+ hours you will be considered full-time and benefits eligible. Providers are required to work at least two 4 hour shifts each weekend, in addition to their weekday hours.\n\nWe are currently looking for a Nurse Practitioner who can work a minimum of 24 hours/week.\n\nCompensation\n\n$80/hour (regular rate) and $90/hour (premium rate)\n\nAbout You\n\nWe look for passionate clinicians who are invested in solving complex problems that impact millions of lives and are excited about fixing what’s broken to improve care quality and health outcomes for everyone. We believe in a culture that fosters teamwork, excellence, and sound decision-making—one that is based on mutual respect and trust. We appreciate individuals who are open and honest about what they’re looking for so we can ensure it’s a fit on both sides.\n\nWe would love to hear from you if you have the following or equivalent experience:\n\n• Have 5+ years of advanced clinical experience in complex care, chronic care management, or primary care.\n\n• Are experienced in or have an appetite for learning digital-first healthcare (e.g. virtual medicine).\n\n• Are interested in new, innovative models of care that balance evidence-based approaches with creative ideas.\n\n• Are highly comfortable with using technology and various applications to deliver care to patients virtually. Our current tech stack is:\n\n• Proprietary built clinician-patient platform \n\n• Google Suite (gmail, sheets, docs, etc) \n\n• Slack\n\n• Board certified as a Nurse Practitioner\n\n• Have an active NP license in NY. Multi-licensed in other states preferred.\n\n• Proficiency with written and spoken medical Spanish is a nice to have\n\nHow We Care for You:\n\n• Flexible scheduling - design the schedule that works best for YOU\n\n• Competitive health, vision and dental plans\n\n• Company paid short and long term disability\n\n• 12 weeks paid parental leave \n\n• Malpractice insurance provided, including tail coverage \n\n• 401(k) with company match\n\nHow We Hire\n\nGalileo Health is an equal-opportunity employer and welcomes applicants from all backgrounds.\n\nWe have recently become aware of the fraudulent use of our name on job postings and via recruiting emails that are illegitimate and not in any way associated with us. We will never ask you to provide sensitive personal information as part of the recruiting process, such as your social security number; send you any unsolicited job offers or employment contracts; require any fees, payments or access to any financial accounts; and/or conduct text-only interviews. If you suspect you are being scammed or have been scammed online, you may report the crime to the Federal Bureau of Investigation and obtain more information regarding online scams at the Federal Trade Commission.\n\nTo apply: https://weworkremotely.com/remote-jobs/galileo-digital-nurse-practitioner-remote-ny-license", "tags": ["All Other Remote"], "salary": "", "location": "An
