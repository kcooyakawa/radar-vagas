real-estate professionals that is already live in MVP/BETA. Early users in Canada like the concept, yet their calls and emails point to three clear priorities: the workflow still feels clunky in places, some AI recommendations miss the mark, and a few screens lag under heavier load.\n\nI need a part-time collaborator who can take that real-world feedback and translate it into concrete product improvements. In practice, that means streamlining navigation so a busy agent never wonders what to click next, refining the underlying AI prompts/models so answers feel sharper and market-specific, and tracing performance bottlenecks or hidden bugs before we widen the rollout.\n\nYou’ll work side-by-side with me, digging into our existing codebase (React front end, Node & Python services, AWS infrastructure) and shipping weekly updates that we can immediately validate with the same beta group. Once the Canadian experience feels frictionless, we will apply the same rigor to compliance tweaks and feature localization for the U.S. launch.\n\nDeliverables\n• UX flow revisions deployed to production \n• Updated AI logic or prompt engineering with measurable accuracy gains \n• Bug fixes / performance patches verified by monitoring dashboards \n• A concise changelog summarizing what changed and why\n\nAcceptance criteria: each sprint must show at least one resolved usability pain point, one verifiable AI improvement, and zero new critical errors in error tracking.\n\nIf iterative product polish, user-centred design, and pragmatic AI tuning excite you, let’s talk and push this platform toward a national release.", "tags": ["Python", "Node.js", "AngularJS", "Git", "User Experience Research", "AI Model Development"], "salary": "CAD 30.0–250.0", "location": "", "first_seen": "2026-11-20T01:39:02.020517+00:00", "is_new": false}, {"id": "Freelancer:https://www.freelancer.com/projects/c-sharp-programming/MapleStoryWorld-Memory-Reader", "source": "Freelancer", "kind": "Freela", "title": "MapleStoryWorld Memory Reader Development", "company": "Cliente Freelancer", "url": "https://www.freelancer.com/projects/c-sharp-programming/MapleStoryWorld-Memory-Reader", "date": "2026-11-19T02:26:47+00:00", "desc": "Development of a Memory Reader for MapleStoryWorld (NGS Bypass & Data Acquisition) 1. Project Overview The objective of this project is to develop a program capable of securely attaching to the MapleStoryWorld process, bypassing Nexon Game Security (NGS) restrictions to obtain a …", "full": "Development of a Memory Reader for MapleStoryWorld (NGS Bypass & Data Acquisition)\n\n1. Project Overview\nThe objective of this project is to develop a program capable of securely attaching to the MapleStoryWorld process, bypassing Nexon Game Security (NGS) restrictions to obtain a process handle, and reading specific memory values (e.g., character coordinates) without triggering security flags or causing game instability.\n\n2. Technical Environment\nTarget Process: MapleStoryWorld(protected by NGS)\nOS: Windows 10/11 (x64)\nKey Challenge: The program must be able to obtain a valid process handle and read memory addresses despite the presence of the NGS anti-cheat system, which may block standard OpenProcess calls.\n\n3. Functional Requirements\n3.1. Process Access & Handle Acquisition\nProcess Discovery: The tool must accurately identify the PID of the running msw.exe.\nPermission Bypass: Implement a reliable method to acquire a handle with PROCESS_VM_READ and PROCESS_QUERY_INFORMATION access rights.\nStability: The method of acquisition must be stable and not cause the game client to crash or trigger \"unauthorized access\" warnings.\n\n3.2. Error Handling & Resource Management\nException Handling: The program must gracefully handle cases where the process is not found or memory cannot be read (e.g., returning a null value instead of crashing).\nResource Cleanup: All acquired handles must be properly closed using CloseHandle to prevent memory leaks.\n\n4. Final Deliverables\nSource Code: Fully commented source code (C++, C#, or Python).\nExecutable: A compiled binary (.exe) for testing.\nTechnical Documentation:\nA brief guide on how the program was implemented.\nInstructions on how to update memory offsets when the game is patched.\nA list of all external dependencies/libraries used.\n\n- End -", "tags": ["C Programming", "Python", "Computer Security", "C# Programming", "Software Architecture", "C++ Programming"], "salary": "USD 30.0–250.0", "location": "", "first_seen": "2026-11-20T01:39:02.020517+00:00", "is_new": false}, {"id": "LinkedIn:https://www.linkedin.com/jobs/view/patriot-software-engineer-ii-python-development-at-raytheon-4484751649", "source": "LinkedIn", "kind": "Emprego remoto", "title": "Patriot Software Engineer II, Python Development", "company": "Raytheon", "url": "https://www.linkedin.com/jobs/view/patriot-software-engineer-ii-python-development-at-raytheon-4484751649", "date": "2026-11-19T00:00:00", "desc": "", "full": "", "tags": ["python"], "salary": "", "location": "Tewksbury, MA", "first_seen": "2026-11-20T01:39:02.020517+00:00", "is_new": false}, {"id": "LinkedIn:https://www.linkedin.com/jobs/view/backend-python-developer-entry-level-at-emonics-llc-4492186431", "source": "LinkedIn", "kind": "Emprego remoto", "title": "Backend Python Developer - Entry Level", "company": "Emonics LLC", "url": "https://www.linkedin.com/jobs/view/backend-python-developer-entry-level-at-emonics-llc-4492186431", "date": "2026-11-19T00:00:00", "desc": "", "tags": ["python"], "salary": "", "location": "St Paul, MN", "first_seen": "2026-11-20T01:39:02.020517+00:00", "is_new": false}, {"id": "LinkedIn:https://www.linkedin.com/jobs/view/python-software-engineer-at-morse-corp-4474493444", "source": "LinkedIn", "kind": "Emprego remoto", "title": "Python Software Engineer", "company": "MORSE Corp", "url": "https://www.linkedin.com/jobs/view/python-software-engineer-at-morse-corp-4474493444", "date": "2026-11-19T00:00:00", "desc": "", "tags": ["python"], "salary": "", "location": "Seattle, WA", "first_seen": "2026-11-20T01:39:02.020517+00:00", "is_new": false}, {"id": "Freelancer:https://www.freelancer.com/projects/roblox/Roblox-Trading-Automation-Backend", "source": "Freelancer", "kind": "Freela", "title": "Roblox Trading Automation Backend Integration", "company": "Cliente Freelancer", "url": "https://www.freelancer.com/projects/roblox/Roblox-Trading-Automation-Backend", "date": "2026-11-18T19:28:19+00:00", "desc": "# Hiring Experienced Roblox Automation Developer – Adopt Me Trading Bot System I'm looking for an experienced developer to build a Roblox Adopt Me trading bot system and integrate it with my existing website. (Please note that i am already aware of the risks and im completely fin…", "full": "# Hiring Experienced Roblox Automation Developer – Adopt Me Trading Bot System\n\nI'm looking for an experienced developer to build a Roblox Adopt Me trading bot system and integrate it with my existing website. (Please note that i am already aware of the risks and im completely fine with it and take full responsibility)\n\nThe website is already built using Node.js and SQLite. I'm not looking for someone to create a new website. I specifically need someone who can develop the bot infrastructure and connect it to my existing backend.\n\n### Project Requirements\n\n1. Automated Trading System\n\nI need a system that can manage multiple Roblox accounts assigned to different roles:\n\n- Deposit bots: Handle incoming pet deposits and report verified transactions to my backend.\n- Withdrawal bots: Handle pet withdrawals based on requests submitted through my website.\n- Middleman bots: Coordinate trades between users where required.\n\nThe system should manage trade requests, track transaction statuses and prevent duplicate transactions.\n\n2. Pet Recognition and Trade Verification\n\nI need a reliable way to identify pets offered in Adopt Me trades, including:\n\n- Pet names and quantities.\n- Neon and Mega Neon variations.\n- Fly and Ride variations.\n- Combinations such as NFR and MFR.\n- Changes to the items offered during a trade.\n\nI'm open to using Python, OpenCV, machine learning or another suitable technology.\n\nThe developer should explain how recognition accuracy will be tested and how successful trades can be independently verified.\n\n3. Roblox Client Automation\n\nI'm looking for a developer who can propose a technically feasible approach for interacting with Roblox and handling trades.\n\nThe developer should explain what tools would be required, whether the solution can run on cloud-hosted infrastructure.\n\n4. Backend Integration\n\nMy existing backend uses Node.js and SQLite.\n\nThe bot system should communicate with it using REST APIs and WebSockets.\n\nIt should support real-time trade updates, bot status monitoring, inventory management and transaction logging.\n\n5. Multiple Bot Management\n\nInitially, I'm considering running approximately 5–10 bots simultaneously, with the ability to scale further.\n\nI need an admin dashboard that allows me to:\n\n- Register and remove bots.\n- Assign deposit, withdrawal or middleman roles.\n- Monitor bot availability.\n- View recorded inventories.\n- Replace unavailable bot accounts.\n- Review failed or incomplete transactions.\n\n6. Hosting and Reliability\n\nThe system should be designed to operate on cloud-hosted infrastructure without requiring my personal computer to remain switched on.\n\nIt should include connection monitoring, automatic recovery from network failures, appropriate rate limiting and safeguards against duplicate trade processing.\n\nThe developer should also explain how the system handles disconnected users, interrupted trades and unavailable inventory.\n\n### Preferred Technologies\n\n- Node.js\n- SQLite\n- Socket.IO / WebSockets\n- Python\n- OpenCV\n- Roblox Luau, where supported\n- Cloud hosting\n\nI'm open to other technologies if they're more appropriate.\n\n### What I'm Looking For\n\nIdeally, you should have experience with Roblox development, automation systems, computer vision, backend integration and real-time applications.\n\nBefore development begins, I'd like to discuss the proposed architecture, technical feasibility and estimated development time \n\nPlease include the following in your application:\n\n1. Your previous experience with Roblox or similar automation projects.\n2. Your proposed approach to trade recognition and interaction.\n3. Whether you've built comparable systems before.\n4. Your estimated development timeline.\n\nI'm looking for someone who can build a reliable, maintainable system that integrates with my existing website rather than starting the entire project from scratch.", "tags": ["PHP", "JavaScript", "Python", "Software Architecture", "Inventory Management", "Node.js"], "salary": "GBP 20.0–250.0", "location": "", "first_seen": "2026-11-20T01:39:02.020517+00:00", "is_new": false}, {"id": "Freelancer:https://www.freelancer.com/projects/ai-chatbot/Mining-Reports-Summary-Chatbot", "source": "Freelancer", "kind": "Freela", "title": "Mining Reports Summary Chatbot", "company": "Cliente Freelancer", "url": "https://www.freelancer.com/projects/ai-chatbot/Mining-Reports-Summary-Chatbot", "date": "2026-11-18T19:00:15+00:00", "desc": "I need a small, secure web dashboard that lets me drop in our production and operational reports (PDF, Word, or Excel) and immediately returns a clean, human-readable summary. The bot’s output must emphasise risks, issues, and recommended actions above everything else, then surfa…", "full": "I need a small, secure web dashboard that lets me drop in our production and operational reports (PDF, Word, or Excel) and immediately returns a clean, human-readable summary. The bot’s output must emphasise risks, issues, and recommended actions above everything else, then surface any other key findings in plain language.\n\nCore flow \n• Upload or drag-and-drop a report behind login \n• File is processed, parsed, and summarised on the fly \n• Summary appears inside the dashboard and can be copied or exported (PDF/CSV)\n\nSecurity is paramount. Please enforce encrypted file transfer (HTTPS), server-side encryption at rest, and simple role-based access so only authorised staff can view reports or summaries. No report content should be stored longer than necessary for processing.\n\nDeliverables \n1. Front-end dashboard (React or similar) with secure authentication \n2. Back-end service (Python, Node, or comparable) that calls an LLM to generate the summary \n3. Prompt template tuned to spotlight risks, issues, and recommended actions for production & operational data \n4. Clear deployment instructions (Docker, AWS, or Azure) and a short read-me for our IT team \n5. One week of post-handover support for bug fixes\n\nAcceptance criteria \n• Summary length ≤ 250 words unless the report is flagged “long” \n• At least three risks/issues and three recommended actions identified when present \n• All file uploads rejected if mime-type or size limit (50 MB) is exceeded \n• OWASP Top 10 checks pass on code review\n\nIf you have experience building document-aware chatbots or secure dashboards, I’d love to see a quick demo or repo link along with your bid.", "tags": ["Java", "JavaScript", "Python", "Software Architecture", "AI Chatbot", "AI Model Development"], "salary": "INR 12500.0–37500.0", "location": "", "first_seen": "2026-11-20T01:39:02.020517+00:00", "is_new": false}, {"id": "Freelancer:https://www.freelancer.com/projects/business-analysis/Saudi-Research-Survey-Analysis", "source": "Freelancer", "kind": "Freela", "title": "Comparative Study of Conventional vs AI-Augmented Training & Development in Saudi Arabia", "company": "Cliente Freelancer", "url": "https://www.freelancer.com/projects/business-analysis/Saudi-Research-Survey-Analysis", "date": "2026-11-18T18:33:58+00:00", "desc": "I already have a fully-drafted questionnaire. What I need now is an end-to-end service that will: • Distribute the survey across Saudi Arabia to research institutes and universities, private companies, energy-sector organisations and the general public, reaching managers and deci…", "full": "I already have a fully-drafted questionnaire. What I need now is an end-to-end service that will:\n\n• Distribute the survey across Saudi Arabia to research institutes and universities, private companies, energy-sector organisations and the general public, reaching managers and decision-makers, employees/technical staff, students, researchers, academic staff, as well as instructors and trainers. \n• Gather a statistically meaningful number of responses and return them in a clean, tabulated data file (Excel or CSV). \n• Run a pilot test first, then calculate reliability metrics such as Cronbach’s alpha and refine if required. \n• Set out my hypotheses clearly (H₀ / H₁) and perform the appropriate tests. \n• Produce a Chapter 4-ready write-up that highlights key trends, significant relationships and any abnormalities in the data, followed by a concise conclusion and practical recommendations. \n• Deliver the complete, publication-quality report with all tables, charts, test outputs and supporting commentary.\n\nI am comfortable with standard tools like SPSS, R or Python/pandas, so feel free to use whichever package you prefer as long as the final files are fully editable. The emphasis is on clear, defensible analysis that will stand up to academic scrutiny and remain accessible to non-technical readers.", "tags": ["Python", "Research", "Report Writing", "Research Writing", "Business Analysis", "Statistical Analysis"], "salary": "USD 750.0–1500.0", "location": "", "first_seen": "2026-11-20T01:39:02.020517+00:00", "is_new": false}, {"id": "Freelancer:https://www.freelancer.com/projects/selenium/Accelerate-Web-Scraping-Automation", "source": "Freelancer", "kind": "Freela", "title": "Accelerate Web Scraping Automation", "company": "Cliente Freelancer", "url": "https://www.freelancer.com/projects/selenium/Accelerate-Web-Scraping-Automation", "date": "2026-11-18T17:30:46+00:00", "desc": "My current browser-based scraper does everything I need in terms of accuracy, yet it still feels sluggish. I want a specialist to dive into the code, spot the bottlenecks, and refactor or redesign whatever is necessary so the whole run completes significantly faster—from initial …", "full": "My current browser-based scraper does everything I need in terms of accuracy, yet it still feels sluggish. I want a specialist to dive into the code, spot the bottlenecks, and refactor or redesign whatever is necessary so the whole run completes significantly faster—from initial launch to the final data export. \n\nYou’ll be working with an existing setup that controls a headless browser (Selenium and Python right now, though I’m open to Playwright, Puppeteer, or other frameworks if they prove faster). Caching static assets, smarter wait conditions, asynchronous calls, or even switching drivers are all on the table—whatever reduces overall execution time without sacrificing reliability. \n\nDeliverables \n• A refactored script or module ready to drop into my project \n• A short performance report comparing before-and-after runtimes and explaining the changes made \n• Clear instructions for any new dependencies or environment tweaks \n\nI’ll test the new version against my standard batch of target pages; a successful hand-off is one that completes the scrape at noticeably higher speed while still returning the exact same data set.", "tags": ["Java", "Python", "Web Scraping", "Software Architecture", "Software Development", "Selenium"], "salary": "USD 10.0–30.0", "location": "", "first_seen": "2026-11-20T01:39:02.020517+00:00", "is_new": false}, {"id": "Freelancer:https://www.freelancer.com/projects/spring-boot/Migrate-App-AWS", "source": "Freelancer", "kind": "Freela", "title": "Migrate App & DB to AWS", "company": "Cliente Freelancer", "url": "https://www.freelancer.com/projects/spring-boot/Migrate-App-AWS", "date": "2026-11-18T15:25:36+00:00", "desc": "I need expert support migrating both an existing web-application and its underlying database to AWS. The current stack relies heavily on Java, Python, Spring Boot, RESTful micro-services, and we will keep those technologies after the move, so deep familiarity with them is essenti…", "full": "I need expert support migrating both an existing web-application and its underlying database to AWS. The current stack relies heavily on Java, Python, Spring Boot, RESTful micro-services, and we will keep those technologies after the move, so deep familiarity with them is essential. \n\nYour first task will be to review the current codebase, deployment scripts, and database schema, then craft a migration plan that minimises downtime and preserves data integrity. From there I expect you to provision the required AWS infrastructure (VPC, sub-nets, IAM, ECS/EKS or EC2, RDS/Aurora, CloudWatch, etc.), refactor or containerise services where it makes sense, and automate the deployment pipeline. Clean, well-documented code and repeatable Terraform/CloudFormation or CDK modules are part of the final hand-off. \n\nPlease include in your proposal: your relevant experience with similar AWS lift-and-shift or re-platform projects, links to a few representative repositories or live systems, an estimated timeline broken into key milestones, and whether you prefer an hourly or fixed-price arrangement. \n\nDeliverables I will use for acceptance: \n• Comprehensive migration plan with risk mitigation steps \n• Fully deployed application and database running in my AWS account \n• Automated CI/CD pipeline and infrastructure-as-code scripts \n• Verification report showing successful cut-over, functional smoke tests, and data validation \n\nIf you enjoy problem-solving at the intersection of backend engineering and cloud architecture, let’s discuss the details and get started.", "tags": ["Java", "Python", "Linux", "Amazon Web Services", "RESTful", "Microservices"], "salary": "USD 25.0–50.0", "location": "", "first_seen": "2026-11-20T01:39:02.020517+00:00", "is_new": false}, {"id": "Freelancer:https://www.freelancer.com/projects/automation/Automated-View-Testing", "source": "Freelancer", "kind": "Freela", "title": "Automated Ad View Testing", "company": "Cliente Freelancer", "url": "https://www.freelancer.com/projects/automation/Automated-View-Testing", "date": "2026-11-18T14:28:07+00:00", "desc": "I need a small-scale service that reliably views around 1,000 Google Ads each day through a pool of approved test accounts. The sole purpose is to confirm that the creative is served and counted, nothing more. Each account should open the impression, register the view, and move o…", "full": "I need a small-scale service that reliably views around 1,000 Google Ads each day through a pool of approved test accounts. The sole purpose is to confirm that the creative is served and counted, nothing more. Each account should open the impression, register the view, and move on—no clicks, no landing-page interactions.\n\nThe workflow can be fully headless: a lightweight script (Python + Selenium, Puppeteer, or similar) that rotates test logins, handles reasonable wait times to mimic human behaviour, and logs the ad ID, timestamp, and account used. I will provide the test account credentials once the core system is in place.\n\nReporting needs are simple: a daily CSV or database entry that lists the 1,000 impressions so I can reconcile them against Google Ads reporting. Should I later expand into Meta or a private in-house platform, the architecture must let me drop in new modules without rewriting the whole stack.\n\nDeliverables:\n• Source code and clear setup instructions \n• An example run that reaches 1,000 impressions in 24 h using my supplied test accounts \n• Daily log output showing ad ID, time viewed, and account ID \n\nAcceptance criteria: the Google Ads dashboard must show the matching number of impressions within ±5 % of the log you generate.\n\nIf you can get this automated viewing loop running smoothly and transparently, let’s talk details and timelines.", "tags": ["JavaScript", "Python", "Web Scraping", "Google App Engine", "Test Automation", "Selenium"], "salary": "USD 250.0–750.0", "location": "", "first_seen": "2026-11-20T01:39:02.020517+00:00", "is_new": false}, {"id": "Freelancer:https://www.freelancer.com/projects/python/Sistem-Otomasi-Konten-Video-Pendek", "source": "Freelancer", "kind": "Freela", "title": "Sistem Otomasi Konten Video Pendek", "company": "Cliente Freelancer", "url": "https://www.freelancer.com/projects/python/Sistem-Otomasi-Konten-Video-Pendek", "date": "2026-11-18T14:22:17+00:00", "desc": "Saya membutuhkan sebuah tool ringan—boleh berbentuk aplikasi desktop, web, atau skrip—dengan antarmuka yang benar-benar sederhana agar siapa pun di tim saya bisa memakainya tanpa kurva belajar. Fokus utamanya: membuat video pendek untuk Reels, TikTok, dan Shorts dengan cara otoma…", "full": "Saya membutuhkan sebuah tool ringan—boleh berbentuk aplikasi desktop, web, atau skrip—dengan antarmuka yang benar-benar sederhana agar siapa pun di tim saya bisa memakainya tanpa kurva belajar. Fokus utamanya: membuat video pendek untuk Reels, TikTok, dan Shorts dengan cara otomatis menggabungkan gambar, musik, dan teks.\n\nAlur kerja yang saya bayangkan\n• Saya menaruh gambar dan clip audio di sebuah folder; sistem juga boleh menarik materi bebas pakai dari internet. \n• Tool memilih kombinasi gambar-musik-teks secara otomatis (atau mengikuti template yang saya set). \n• Video 9:16 beres, resolusi minimal 1080×1920, tanpa watermark. \n• Begitu selesai, video langsung ter-posting ke YouTube Shorts, Facebook Reels, TikTok, dan Instagram Reels—bisa sekaligus atau terjadwal.\n\nFitur minimum\n• Drag & drop untuk folder lokal dan URL media bebas pakai. \n• Template overlay teks (judul, call-to-action). \n• Pilihan musik latar dan pengaturan volume otomatis. \n• Login/token management untuk tiap platform, lengkap dengan refresh. \n• Penjadwalan posting, log proses, dan notifikasi error. \n• Panel pratinjau sebelum publish.\n\nTeknologi fleksibel—Python + FFmpeg, Node.js, atau stack lain asalkan stabil dan didukung komunitas. Sertakan: \n1. Kode sumber lengkap. \n2. Panduan instalasi dan penggunaan singkat. \n3. Contoh video hasil build beserta bukti upload otomatis.\n\nVideo harus berhasil tayang di keempat platform melalui satu antarmuka, dan UI harus cukup jelas untuk user non-teknis. Mohon kirim portofolio serupa dan estimasi waktu penyelesaian.", "tags": ["Python", "Video Services", "After Effects", "Videography", "Node.js", "Video Editing"], "salary": "USD 10.0–30.0", "location": "", "first_seen": "2026-11-20T01:39:02.020517+00:00", "is_new": false}, {"id": "Freelancer:https://www.freelancer.com/projects/blender/Automated-Tile-Stair-Visualization", "source": "Freelancer", "kind": "Freela", "title": "Automated Tile-to-Stair Visualization Pipeline", "company": "Cliente Freelancer", "url": "https://www.freelancer.com/projects/blender/Automated-Tile-Stair-Visualization", "date": "2026-11-18T11:58:34+00:00", "desc": "AI pipeline: apply a tile from a raw photo onto existing stair images using masks (no 3D rendering) We make stairs clad with porcelain/ceramic tiles. We have about 42 stair images (different designs and angles). We do NOT want to render the tile in Blender. We need an AI pipeline…", "full": "AI pipeline: apply a tile from a raw photo onto existing stair images using masks (no 3D rendering)\nWe make stairs clad with porcelain/ceramic tiles. We have about 42 stair images (different designs and angles). We do NOT want to render the tile in Blender. We need an AI pipeline that puts the tile onto our existing stair images, using masks.\nInput:\nA raw, real-life tile photo. It is not cropped or scanned: shot at an angle, uneven light, reflections, background, low resolution.\nBase stair images (~42), plus masks for each surface: treads, risers and nosings/edges. If needed, we can also export extra passes from Blender: UV, depth, normal, object/material ID.\nWhat the AI must do:\nExtract the tile from the photo: find it, fix the perspective, crop it, and remove glare, shadows and noise.\nRecreate the tile in high quality while keeping it identical to the original: same pattern, veining, structure and colour distribution. No reinterpretation.\nApply the tile inside the masks with correct perspective, real-world scale (e.g. 60×120 cm), realistic tile layout and grout lines, and correct cuts on treads, risers and nosings.\nKeep the stair geometry, edges, lighting, shadows and reflections of the base image. The result must look like a real photo of the stairs.\nProcess all ~42 images automatically for each new tile.\nKey requirement:\nThe tile face must be exactly the same across all ~42 images. It's the same tile, not 42 variations. The pattern must not change or drift between images. Colour can be fine-tuned on our side; the tile face is the priority.\nDeliverables:\nA working tool I can run myself: ComfyUI workflow or Python script, local or API-based. Input = tile photo; output = 42 finished images.\nDocumentation and a handover session.\nAcceptance test on 5 of our real tile photos.\nIdeal candidate:\nStrong ComfyUI / Stable Diffusion / Flux experience: ControlNet, IP-Adapter, inpainting, relighting, upscaling\nTexture projection/warping onto masked surfaces using UV or depth\nPortfolio showing AI that preserves product details (product placement, material swaps, interior visualization)\nIn your proposal, please include:\nYour approach: how will you keep the tile pattern identical across all images and avoid AI hallucination?\nRelevant examples (material swap / product-preserving work)\nTimeline, budget and hardware requirements", "tags": ["Python", "3D Rendering", "3ds Max", "3D Modelling", "3D Animation", "Blender"], "salary": "USD 30.0–250.0", "location": "", "first_seen": "2026-11-20T01:39:02.020517+00:00", "is_new": false}, {"id": "Freelancer:https://www.freelancer.com/projects/image-processing/Python-Script-Image-Visio-Flowcharts", "source": "Freelancer", "kind": "Freela", "title": "Python Script: Image to Visio Flowcharts", "company": "Cliente Freelancer", "url": "https://www.freelancer.com/projects/image-processing/Python-Script-Image-Visio-Flowcharts", "date": "2026-11-18T11:37:38+00:00", "desc": "I have a folder full of PNG / JPEG screenshots of simple flowcharts and I need a Python script that will turn each image into a fully editable Visio (.vsdx) file. The end result I’m after is a Visio drawing where the arrows, “process” rectangles, “decision” diamonds, start / end …", "full": "I have a folder full of PNG / JPEG screenshots of simple flowcharts and I need a Python script that will turn each image into a fully editable Visio (.vsdx) file. The end result I’m after is a Visio drawing where the arrows, “process” rectangles, “decision” diamonds, start / end ovals and any other common flow-chart symbols are real Visio shapes with proper connectors, not a flat picture. Wherever the original image contains text inside a shape, that text must be copied into the matching Visio shape automatically so I can open the file in Visio and start rearranging or styling it right away.\n\nCore workflow I envision:\n• The script runs locally (Windows 10/11), pointed at a single image or an entire folder. \n• It detects the usual flowchart shapes, their positions and connections, recreates them in Visio using python-com or any reliable Visio API wrapper, and assigns detected text to each shape. \n• Output is a clean .vsdx file with the same layout and connectors as the source image.\n\nI’m happy for you to choose the best libraries—OpenCV or similar for image analysis, pytesseract or another OCR engine for text, and pywin32/Visio Interop for file creation—as long as the final script is self-contained, well-commented and easy for me to run from the command line.\n\nDeliverables that will let me sign off:\n1. Python source code (.py) and any helper files. \n2. A brief README explaining dependencies, setup, and usage. \n3. One converted sample image of mine that opens in Visio with editable shapes, connectors and text. \n\nIf you’ve tackled image-to-diagram conversion before, especially with Visio automation, that will be a big plus. Let me know any clarifying questions and your estimated turnaround time so we can get started.", "tags": ["Python", "Software Architecture", "Cartography & Maps", "OCR", "Geospatial", "Image Processing"], "salary": "INR 600.0–1500.0", "location": "", "first_seen": "2026-11-20T01:39:02.020517+00:00", "is_new": false}, {"id": "WeWorkRemotely:https://weworkremotely.com/remote-jobs/antora-energy-senior-power-procurement-manager", "source": "WeWorkRemotely", "kind": "Emprego remoto", "title": "Senior Power Procurement Manager", "company": "Antora Energy", "url": "https://weworkremotely.com/remote-jobs/antora-energy-senior-power-procurement-manager", "date": "2026-11-18T11:31:48+00:00", "desc": "Headquarters: United States URL: https://www.antora.com Antora Energy delivers affordable, reliable energy to industry, data centers, and the grid. Our thermal batteries turn low-cost electricity into always-on heat and power, without supply-constrained critical minerals or multi…", "full": "Headquarters: United States\n\nURL: https://www.antora.com\n\nAntora Energy delivers affordable, reliable energy to industry, data centers, and the grid. Our thermal batteries turn low-cost electricity into always-on heat and power, without supply-constrained critical minerals or multi-year construction timelines.\n\nWe are growing our company with people who put team and mission first, value connection through laughter and joy, and work with humility and openness. We are committed to building a diverse, passionate, and creative team dedicated to a future powered by abundant, clean, low-cost energy.\n\nPosition Summary\n\nThe Senior Power Procurement Manager will lead utility tariff and power purchase negotiations from first engagement through execution, owning a portfolio of medium- to high-complexity deals across one or more ISOs/RTOs. This is a hands-on individual contributor role with no direct reports: the person will draft and negotiate term sheets and definitive agreements, build and pressure-test deal models, coordinate cross-functional inputs, and serve as the day-to-day point of contact with utility counterparts. They will lead complex, multi-site negotiations, pilot new commercial constructs, and are expected to become Antora's recognized expert for a region.\n\nRoles & Responsibilities\n\n• \nDeal Execution & Negotiation\n\n• Lead day-to-day negotiations and the overall close plan for utility tariffs, energy service agreements, and PPAs.\n\n• Draft and negotiate term sheets; lead definitive agreement negotiations alongside counsel; negotiate standard tariff rate changes per playbook.\n\n• Support capacity and power sales origination, including preparing and negotiating MOUs, term sheets, and off-take agreements with utilities, hyperscalers, and other large-load customers.\n\n• Help shape deal structures that fit Antora's unique load profile.\n\n• Coordinate Finance, Legal, Policy, Business Development, and Engineering inputs; run cross-functional working sessions to align positions, timelines, and technical constraints.\n\n• Own financial model architecture for deals: select modeling approaches, set key assumptions, run sensitivities and stress tests, validate inputs, and QA models built by others.\n\nUtility & Counterparty Relationships\n\n• Serve as the primary point of contact with utility managers and directors.\n\n• Build deep regional knowledge of priority ISOs/RTOs, utilities, and tariff landscapes, growing into a go-to resource for at least one region.\n\n• Partner with Business Development to qualify and advance opportunities, ensuring smooth handoffs from early engagement to active negotiation.\n\nRegulatory Support & Team Contribution\n\n• Support regulatory work by drafting comments, exhibits, and data responses; may represent Antora in staff workshops and by testifying in regulatory forums.\n\n• Surface patterns across deals (common counterparty objections, emerging tariff structures, regulatory shifts) and propose playbook language updates for senior review.\n\n• Informally mentor junior team members on models, redlines, and negotiation prep.\n\nKey Qualifications\n\n• 6–12+ years of experience in power procurement, energy origination, utility negotiations, or energy commercial roles.\n\n• Demonstrated deal track record of leading successful Power Procurement Agreement or Electric Service Agreement negotiations.\n\n• Solid working knowledge of utility tariff design, wholesale power markets, and the commercial mechanics of how large loads contract for energy and grid services, with depth in at least one region or ISO.\n\n• Hands-on experience drafting and negotiating term sheets and definitive agreements alongside counsel.\n\n• Strong financial modeling skills, ability to build, stress-test, and QA deal models and translate results into negotiation positions.\n\n• Sound commercial judgment within guardrails: knowing which terms to hold, which to trade, and when a deviation needs to be escalated.\n\n• Clear written and verbal communication; able to write decision memos and present recommendations to internal leadership with minimal editing.\n\nAdditional Qualifications Desired\n\n• Experience with energy storage, thermal storage, or flexible load commercial structures.\n\n• Exposure to capacity sales or hyperscaler energy procurement.\n\n• Experience in high-growth or start-up environments where commercial processes are still being built.\n\n• Working relationships with utility procurement/rates teams and ISO/RTO stakeholders in MISO, SPP, ERCOT, or PJM.\n\n• Experience supporting regulatory proceedings (comments, data responses, staff workshops).\n\nWork Location:  Remote, USA\n\nSalary Range:  $158,000 USD - $225,000 USD\n\nSalary Basis:  Annual\n\nPlease note that the salary range listed above reflects Antora Energy's estimated pay for this position. The actual salary offered will be within the posted range and determined based on several factors including but not limited to a candidate's experiences, credentials and expertise, as they pertain to the position's requirements.\n\nIn addition to a competitive base salary, Antora Energy’s Total Rewards program includes equity compensation in the form of stock options, a premium health benefits package with life and disability insurance, a 401K plan with employer contributions, flexible spending accounts, and an industry leading paid-time-off policy that features flexible and inclusive holiday observance, as well as paid volunteer time off.\n  When it comes to stopping climate change, we need everyone. We believe that having a diversity of backgrounds and experiences strengthens all of us, and we strive to create an environment where every one of us is empowered to create meaningful change.\n\nTo apply: https://weworkremotely.com/remote-jobs/antora-energy-senior-power-procurement-manager", "tags": ["Management and Finance"], "salary": "", "location": "USA Only", "first_seen": "2026-11-20T01:39:02.020517+00:00", "is_new": false}, {"id": "Freelancer:https://www.freelancer.com/projects/data-analysis/Extract-JEE-Maths-Questions-Chapter", "source": "Freelancer", "kind": "Freela", "title": "Extract JEE Maths Questions by Chapter", "company": "Cliente Freelancer", "url": "https://www.freelancer.com/projects/data-analysis/Extract-JEE-Maths-Questions-Chapter", "date": "2026-11-18T09:32:29+00:00", "desc": "Title: Python/PDF Expert Needed to Extract and Sort JEE Maths Questions by Chapter (10,000-page PDF) Project description: I have a single PDF of about 10,000 pages containing JEE Advanced/JEE Mains level questions and solutions from Physics, Chemistry, and Maths. I need only the …", "full": "Title: Python/PDF Expert Needed to Extract and Sort JEE Maths Questions by Chapter (10,000-page PDF)\nProject description:\nI have a single PDF of about 10,000 pages containing JEE Advanced/JEE Mains level questions and solutions from Physics, Chemistry, and Maths. I need only the Maths questions separated and grouped chapter-wise.\nWhat I need done:\nExtract the text from the PDF (and handle math equations/symbols correctly where possible).\nIdentify and separate only the Maths questions. Physics and Chemistry should be excluded.\nSort the Maths questions into their chapters (e.g., Algebra, Calculus, Coordinate Geometry, Trigonometry, Probability, etc.).\nKeep each question together with its solution.\nDeliver one output file per chapter (PDF or Word), with a clear file name such as \"01_Calculus.pdf\".\nProvide a short list of any pages or questions that could not be classified, so I can review them.\n\nRequirements:\nProven experience with PDF processing and Python (please share examples or past work).\nAbility to handle large files (10,000 pages) without errors.\nAccuracy matters more than speed. Please describe your method briefly.\n\nDeliverables:\nChapter-wise Maths files (PDF or DOCX)\nA short summary of the number of questions per chapter\nThe script/code used (optional, but preferred)\n\nBudget/Timeline: [e.g., fixed price of ₹X, or per-page rate] | Delivery in [X] days\nProcess: Please start with a test batch of 100 to 200 pages before we agree on the full job. Payment is released after I approve the test batch and final output.\nPlease reply with: your relevant experience, your approach in 3 to 4 lines, your price, and your estimated delivery time.", "tags": ["Python", "Data Processing", "PDF", "LaTeX", "Mathematics", "Data Extraction"], "salary": "INR 1500.0–12500.0", "location": "", "first_seen": "2026-11-20T01:39:02.020517+00:00", "is_new": fals and easily into our existing Google GNM Blender workflow.\n\nOur goal is to use an automated Python rendering pipeline to randomize face shapes, skin profiles, hairstyles, facial hair, glasses, and headwear—generating diverse synthetic human portraits (similar in variety and framing to Microsoft’s FaceSynthetics dataset: https://github.com/microsoft/FaceSynthetics/blob/main/docs/img/dataset_samples.jpg), rendered to match real Near-Infrared (NIR) camera imagery.\n\nTarget IR Output & Eyeball References:\n- Sample IR Face Output: https://link.springer.com/article/10.1007/s11263-021-01432-4\n- High-Resolution NIR Eye & Iris Reference: https://www.researchgate.net/figure/High-resolution-NIR-face-images-and-corresponding-face-and-iris-images-a-High_fig1_221383633\n\n(These links—along with additional sample IR images we will share with you—serve as our visual target. We will iterate together on your initial sample renders to fine-tune the look so it closely matches our actual camera output.)\n\nWe are looking for an experienced Blender look-dev / character artist to deliver:\n1. An IR-accurate skin, eye, and mouth material library tailored to the Google GNM head.\n2. A modular library of hair and accessories that fit cleanly across Google GNM head variations.\n3. A calibrated lighting/render setup inside Blender that reproduces real NIR image characteristics.\n\n------------------------------------------------------------\n\n1. IR-ACCURATE SKIN, EYE & MOUTH MATERIAL LIBRARY\n- IR Skin Tones & Ages: Distinct skin profiles covering very fair to very deep tones (referencing the Monk Skin Tone Scale) plus age variations (smoother skin for younger faces, fine lines/pores/sunspots for older faces), calibrated specifically for how melanin, subsurface scattering, and skin reflectance behave in monochrome Near-Infrared imagery.\n- Close-Up Detail & Visible Skin Marks: High-resolution (2K minimum) PBR textures that hold up in tight portrait close-ups—ensuring pores, fine lines, and natural skin marks (moles, freckles, blemishes, scars, and light stubble shadow) remain clearly and accurately visible under IR illumination, with zero seams or stretching on the GNM head mesh.\n- Script-Friendly Master Shader: A single master skin shader with clearly exposed, easy-to-script controls for skin tone/IR reflectance, roughness/shine, subsurface scattering, freckle/mole/blemish intensity, and stubble shadow, alongside pre-configured presets for all profiles.\n- IR Eyeball & Iris Physics (Priority):\n * Eyeballs must accurately replicate real Near-Infrared optical behavior (matching the NIR eye reference link above):\n - Deep black pupil with a sharp white glint/dot (corneal specular reflection) when looking toward the camera.\n - Clearly defined grey iris with realistic iris pattern/texture and natural IR reflectance across different iris shades.\n - Bright white sclera with realistic wetness and a subtle tear line.\n * Natural IR-tuned materials for lips, eyebrows, eyelashes, and interior mouth parts (teeth, gums, tongue) on the GNM mesh.\n\n------------------------------------------------------------\n\n2. MODULAR ACCESSORY LIBRARY (COMPATIBLE WITH GOOGLE GNM HEADS)\nWe need a comprehensive library of modular, mix-and-match assets built at real-world scale with clean topology and PBR materials, designed to maximize visual variety and generate a wide range of unique synthetic combinations:\n- Head Hair & Eyebrows: A wide variety of hairstyles (short, medium, long, straight, wavy, curly, coily, tied back, shaved/buzz, etc.) plus diverse eyebrow shapes and densities in multiple natural shades (including grey and white).\n- Facial Hair: A broad selection of styles (light and heavy stubble, short beards, full beards, moustaches, goatees, sideburns, etc.) across multiple shades.\n- Eyewear: A diverse collection of prescription glasses (thin metal, thick acetate, rimless, half-rim) with clear refractive lenses, alongside sunglasses (aviator, square, round, wrap-around, oversized) with tinted, gradient, and mirrored lenses that behave realistically in IR.\n- Headwear & Face Coverings: A wide assortment of headwear options (caps, beanies, wide-brim hats, headscarves, turbans, hoods, etc.) plus various surgical and cloth face masks.\n\nGNM Compatibility & Automation Requirements:\n- Parametric Fit: Because Google GNM generates varying face shapes, head sizes, and expressions, accessories must adapt/fit cleanly to generated GNM heads with zero clipping or floating gaps (e.g., bound via surface/mesh deformers or rig/shape-key compatible setups so they follow head shape changes automatically).\n- Clean Layering: Accessories must combine together (for example, wearing glasses, a cap, and a beard simultaneously) without intersecting each other.\n- Automation-Ready Structure: Because we will randomize combinations via a Python script, all objects, collections, materials, and shader parameters must follow a strict, consistent naming convention and clean hierarchy.\n\n------------------------------------------------------------\n\nTECHNICAL & LICENSING REQUIREMENTS\n- Built and tested in Blender (Cycles) using native Blender tools and the free Google GNM extension—no paid add-ons required to open or render.\n- Textures saved with relative paths or packed cleanly into the .blend files.\n- Usage Rights: All work must be original or properly licensed so we have unrestricted rights to use the 3D assets internally to generate and use synthetic 2D image datasets commercially.\n\n-----…", "tags": ["3D Rendering", "Blender", "3D Visualization", "Blender 3D", "Character Design", "Texturing"], "salary": "INR 12500.0–37500.0", "location": "", "first_seen": "2026-11-20T01:39:02.020517+00:00", "is_new": false}, {"id": "Freelancer:https://www.freelancer.com/projects/3d-modelling/Intel-RealSense-Dimensioning-Software", "source": "Freelancer", "kind": "Freela", "title": "Intel RealSense D435if Dimensioning Software", "company": "Cliente Freelancer", "url": "https://www.freelancer.com/projects/3d-modelling/Intel-RealSense-Dimensioning-Software", "date": "2026-11-18T06:29:28+00:00", "desc": "I am building a small desktop station where a fixed Intel RealSense Depth Camera D435if sits roughly 2 m above a plain, single-colour table. Each time I place an item on that table—sometimes a perfect carton, other times an irregular bag—I need the program to capture its maximum …", "full": "I am building a small desktop station where a fixed Intel RealSense Depth Camera D435if sits roughly 2 m above a plain, single-colour table. Each time I place an item on that table—sometimes a perfect carton, other times an irregular bag—I need the program to capture its maximum length, width, and height (in millimetres) and display the three numbers instantly on a Windows PC. \n\nKey targets \n• Working volume: up to 530 × 530 × 530 mm. \n• Accuracy: within ±5 mm, to be proven in real-world trials. \n• Surfaces: black, grey and multi-coloured objects must be recognised reliably. \n\nThe simplest user flow is ideal: launch the app, the depth stream starts, one click (or automatic trigger) records a frame, and the bounding box results appear. A CSV or JSON export of each measurement would be a welcome extra but is not mandatory.\n\nI would like you to build it with the RealSense SDK, using Python or C++ together with OpenCV / Open3D—whichever stack you are most comfortable optimising. Please structure the code cleanly and comment it well; I intend to maintain it long term.\n\nDeliverables \n1. Executable application. \n2. Full, well-organised source code. \n3. Step-by-step installation and calibration guide that lets me re-establish the ±5 mm accuracy after camera relocation. \n\nOnce I can repeat your accuracy numbers on my side, the project will be considered successfully completed.", "tags": ["Python", "Windows Desktop", "C# Programming", "Software Architecture", "C++ Programming", "3D Modelling"], "salary": "USD 250.0–750.0", "location": "", "first_seen": "2026-11-20T01:39:02.020517+00:00", "is_new": false}, {"id": "Freelancer:https://www.freelancer.com/projects/ai-automation/Candidate-Sourcing-Automation", "source": "Freelancer", "kind": "Freela", "title": "AI Candidate Sourcing Automation", "company": "Cliente Freelancer", "url": "https://www.freelancer.com/projects/ai-automation/Candidate-Sourcing-Automation", "date": "2026-11-18T06:25:56+00:00", "desc": "The objective is to automate as much of our recruitment process as possible to improve recruiter productivity, reduce manual effort, speed up sourcing and bring greater efficiency to the overall recruitment cycle. We aim to build an AI-powered recruitment platform that integrates…", "full": "The objective is to automate as much of our recruitment process as possible to improve \nrecruiter productivity, reduce manual effort, speed up sourcing and bring greater efficiency to \nthe overall recruitment cycle. \nWe aim to build an AI-powered recruitment platform that integrates multiple job portals with \nour in-house ATS, and automates recruitment tracking and reporting. \n\nA. Centralised AI-Powered Job Search \nDevelop a new search interface with Claude AI integrated at the backend, connecting to the \nfollowing job portals: \n Naukri \n Shine \n Indeed \n LinkedIn \nThe system should: \n1. Allow recruiters to search across multiple job portals from a single interface. \n2. Accept Job Descriptions (JDs), keywords, skills, experience, location and other \nrelevant search criteria. \n3. Use AI to understand the JD and identify relevant candidate profiles. \n4. Display profiles ranked by their relevance to the requirement. \n5. Eliminate the need to individually visit and search each job portal.\n\nB. Candidate Profile Display & Shortlisting \nThe search interface should display candidate profiles in a list/summary format rather than \nautomatically opening individual profiles. \n Mobile numbers and contact details should not be visible in the search results. \n Profiles should not open automatically. \n Recruiters should be able to review basic candidate details and AI match scores. \n Recruiters will manually open only the profiles they wish to shortlist. \n Shortlisted profiles should then be added to our ats system recuitZ.\nIntegration nd automation\nAutomated MIS and weekly reporting\n\nCore scope \n• Build or train an AI/ML routine (Python, Node, or comparable stack) that scans job boards, LinkedIn-style networks, GitHub, and other open sources to identify profiles matching a role description I feed it. \n• Extract key fields—name, headline, skills, location, email or alternative contact, and profile URL—and normalise them to Recruit’s data model. \n• Push the enriched records into Recruit in real time, handling duplicates gracefully. \n• Provide a simple dashboard or command-line report that shows the number of leads pulled, success/error logs, and API response codes for traceability. \n\nDeliverables \nPhase 1 AI-powered search interface and job portal integration \nPhase 2 Candidate shortlisting and SpotRecruit integration \nPhase 3 Automated MIS, dashboards and weekly reporting \nPhase 4 Process optimisation and additional AI-based automation \n\nAcceptance criteria \n• At least 80 % of captured profiles populate correctly in Recruit with no manual cleanup. \n• Duplicate detection works against existing candidate IDs or email addresses. \n• Runtime for a single search stays under 5 minutes for 1,000 profiles. \n\nWhen you respond, highlight relevant experience building similar sourcing bots, Recruit (or comparable ATS) integrations, and any AI/NLP models you have deployed in production.", "tags": ["Website Design"], "salary": "INR 30000.0–250000.0", "location": "", "first_seen": "2026-11-20T01:39:02.020517+00:00", "is_new": false}, {"id": "Freelancer:https://www.freelancer.com/projects/api-testing/App", "source": "Freelancer", "kind": "Freela", "title": "App接口安全自动化测试", "company": "Cliente Freelancer", "url": "https://www.freelancer.com/projects/api-testing/App", "date": "2026-11-18T05:54:28+00:00", "desc": "我需要针对我们的移动应用（Android 与 iOS 双端）建立一套可重复的抓包与接口安全自动化测试方案。 重点说明如下： • 抓包方式 – 仅关注手机应用流量，优先在真实设备或模拟器上完成 HTTPS 抓取并成功还原请求 / 响应。 • 协议分析 – 完整列出所有接口、参数及调用逻辑，输出清晰的接口清单和协议说明文档。 • 自动化安全测试 – 在分析基础上编写脚本，重点检测： 1. 接口未登录即可访问或越权访问 2. 参数被篡改、注入等输入风险 3. 敏感信息泄露或传输未加密 – 测试完成后生成结构化报告，包含风险级别、复现步骤与修复建议。 • 交付物…", "full": "我需要针对我们的移动应用（Android 与 iOS 双端）建立一套可重复的抓包与接口安全自动化测试方案。 \n重点说明如下：\n\n• 抓包方式 \n – 仅关注手机应用流量，优先在真实设备或模拟器上完成 HTTPS 抓取并成功还原请求 / 响应。 \n\n• 协议分析 \n – 完整列出所有接口、参数及调用逻辑，输出清晰的接口清单和协议说明文档。 \n\n• 自动化安全测试 \n – 在分析基础上编写脚本，重点检测： \n 1. 接口未登录即可访问或越权访问 \n 2. 参数被篡改、注入等输入风险 \n 3. 敏感信息泄露或传输未加密 \n – 测试完成后生成结构化报告，包含风险级别、复现步骤与修复建议。 \n\n• 交付物 \n – 抓包脚本 / 配置（mitmproxy、Burp Suite Mobile Assistant、Frida 等均可） \n – 自动化测试代码（Python、Postman Collection 或其他主流框架）及运行文档 \n – 完整的接口分析文档与安全测试报告（PDF 或 Markdown） \n\n• 验收标准 \n – Android 与 iOS 设备均能一键复现抓包与测试 \n – 自动化脚本可独立运行并输出 JSON/HTML 结果 \n – 报告信息准确、无关键遗漏 \n\n在提案中请简要说明你计划采用的工具链及相关经验；若有类似项目案例，将优先考虑。", "tags": ["Python", "Web Security", "Mobile App Development", "iPhone", "Android", "Automation"], "salary": "USD 250.0–750.0", "location": "", "first_seen": "2026-11-20T01:39:02.020517+00:00", "is_new": false}, {"id": "Freelancer:https://www.freelancer.com/projects/api-developmet/Build-Secure-Government-API-Middleware", "source": "Freelancer", "kind": "Freela", "title": "Build Secure Government API Middleware", "company": "Cliente Freelancer", "url": "https://www.freelancer.com/projects/api-developmet/Build-Secure-Government-API-Middleware", "date": "2026-11-18T05:31:12+00:00", "desc": "Job Title: Founding Backend / API Middleware Engineer (Government & Enterprise Integrations – IIT Students, Grads, or Dropouts) About the Role We are building a high-security middleware platform that connects official government and institutional data APIs (such as transport, lic…", "full": "Job Title: Founding Backend / API Middleware Engineer (Government & Enterprise Integrations – IIT Students, Grads, or Dropouts)\nAbout the Role\nWe are building a high-security middleware platform that connects official government and institutional data APIs (such as transport, licensing, and social welfare verification systems) directly into our user-facing application. We are looking for an exceptional backend builder from the IIT community—whether you are a current student, a graduate, or a dropout—who thrives on solving tough architectural problems and wants 100% ownership over building the core engine from scratch. We care about your raw engineering talent, clean code, and dedication, not your GPA.\nWhat You Will Build\n• Government & Third-Party API Middleware. Architect a secure, low-latency middleware layer integrating official external APIs (such as driver licence verification, vehicle registry, and identity/benefit card validation services) with our mobile and web application.\n• Authentication & Security. Implement enterprise-grade security including OAuth 2.0, Mutual TLS (mTLS), API key rotation, rate-limiting, and encrypted payload handling.\n• Data Transformation & Reliability. Build fault-tolerant pipelines that translate REST and SOAP/XML responses into clean, real-time JSON endpoints for our app, complete with retry logic and error logging.\n• Privacy & Audit Architecture. Design database schemas and audit logs compliant with strict national data privacy and encryption laws.\nRequired Technical Skills & Qualifications\n• Education / Background. Current student, graduate, or dropout from any IIT.\n• Backend Languages. Strong hands-on proficiency in Python (FastAPI), Node.js (TypeScript), Go, or C# (.NET).\n• API & Protocol Mastery. Proven experience building and consuming RESTful APIs, handling SOAP/XML integrations, and working with JSON, Webhooks, and OAuth 2.0 / JWT.\n• Infrastructure & Databases. Solid grasp of PostgreSQL, Redis, Docker, and cloud deployment (AWS or Azure).\n• Mindset. Self-driven, obsessive about edge cases and security, and ready to commit 100% effort to deliver production-grade code without hand-holding.\nHow to Apply\nNo formal resume or cover letter required. Send us:\n1. Links to your GitHub, live projects, or hackathon builds (especially anything involving API integrations, security, or backend architecture).\n2. A brief message explaining how you would design a secure middleware between an external government API and a mobile app, plus your weekly availability.", "tags": ["Python", ".NET", "Cryptography", "Node.js", "RESTful", "Backend Development"], "salary": "INR 75000.0–150000.0", "location": "", "first_seen": "2026-11-20T01:39:02.020517+00:00", "is_new": false}, {"id": "Freelancer:https://www.freelancer.com/projects/latex/iGCSE-Math-PDF-LaTeX-Webapp", "source": "Freelancer", "kind": "Freela", "title": "iGCSE Math PDF-to-LaTeX Webapp", "company": "Cliente Freelancer", "url": "https://www.freelancer.com/projects/latex/iGCSE-Math-PDF-LaTeX-Webapp", "date": "2026-11-18T05:22:00+00:00", "desc": "I need the foundations of an online platform that can take iGCSE Mathematics exam papers (they are usually born-digital PDFs with selectable text, though every page carries a watermark) and turn them into clean, fully editable LaTeX while keeping every element intact—text, equati…", "full": "I need the foundations of an online platform that can take iGCSE Mathematics exam papers (they are usually born-digital PDFs with selectable text, though every page carries a watermark) and turn them into clean, fully editable LaTeX while keeping every element intact—text, equations, diagrams, tables, graphs, the lot. \r\n\nThe very first milestone is the conversion pipeline and automatic population of a question-bank; student practice screens and multi-user log-ins can follow once this backbone works flawlessly.\r\n\nHere is what the initial build must accomplish:\r\n\n• Upload: accept individual PDFs or batches. \r\n• Cleaning: strip out watermarks automatically during import. \r\n• Parsing: detect the page layout, slice each paper into individual question blocks, and preserve original numbering. \r\n• Tagging: write metadata for syllabus, year, series, variant and topic so each question is searchable. \r\n• Output: generate LaTeX that matches the original layout and push both the source and its metadata into a database that can later power the rest of the site.\r\n\nI am happy with whichever stack you prefer—Python (PyMuPDF / pdfminer), Node, Go, or another language—so long as the resulting LaTeX is production-ready and the database schema leaves room for future educator and student accounts. Please outline your proposed approach to PDF parsing, watermark removal, and layout detection when you reply, and feel free to flag any open-source libraries that could accelerate delivery.\r\n\nBoilerplate pages like Cover/Instructions, Formula Sheet blank \"Continuation of working space\" pages can be preserved if viewed as a complete exam paper, these can be dropped if viewed as a single question or grouped questions. Margins, repeating headers, footers, barcodes, and \"DO NOT WRITE IN THIS MARGIN\" sidebars using fixed bounding boxes can also be removed, unless viewed as a complete exam paper.\r\n\nFor student practice screen (per individual question), 3 tabs are available; tab #1 clean canvas for student to type working using LaTex scripts or upload an image of a handwritten work, tab #2 two dimensional Cartesian Coordinate Frame for student to sketch/draw graphs, like in DESMOS to help visualize his/her working (using something like JSXGraphs) and tab #3 for the educator to create a template for guided working for students to follow and complete each step in order to answer the problem.", "tags": ["Python", "PDF", "LaTeX", "Database Development", "Web Application"], "salary": "USD 15.0–25.0", "location": "", "first_seen": "2026-11-20T01:39:02.020517+00:00", "is_new": false}, {"id": "Freelancer:https://www.freelancer.com/projects/data-science/Data-Insight-Platform-Development", "source": "Freelancer", "kind": "Freela", "title": "AI Data Insight Platform Development -- 2", "company": "Cliente Freelancer", "url": "https://www.freelancer.com/projects/data-science/Data-Insight-Platform-Development", "date": "2026-11-18T05:21:14+00:00", "desc": "I’m building a small platform that turns a large collection of text, documents, and survey responses into a fully searchable, well-structured dataset with clear, shareable reports. To get there I need help across four overlapping tracks: prompt engineering, Python automation, dat…", "full": "I’m building a small platform that turns a large collection of text, documents, and survey responses into a fully searchable, well-structured dataset with clear, shareable reports. To get there I need help across four overlapping tracks: prompt engineering, Python automation, data work, and UI/UX.\n\nHere’s the flow I have in mind. \n• We start by crafting and fine-tuning prompts so a chosen LLM can classify, tag, and summarise the raw text at scale. \n• Clean Python code then ingests the source files, applies those prompts, and stores the results—think pandas, LangChain, and a lightweight vector or SQL store. \n• The processed data is reorganised into a tidy schema that powers interactive reports (Dash, Streamlit, or your preferred framework). \n• Finally, intuitive wireframes and a minimal front-end tie everything together so end-users can search, filter, and export insights without touching code.\n\nAcceptance criteria \n– Accurate prompt set that achieves agreed precision/recall on a validation set \n– Reusable Python package or script suite with documentation \n– Normalised dataset delivered in CSV/Parquet plus live exploratory dashboard \n– Clickable Figma or similar prototype matching the data flow\n\nIf this mix of AI/ML, data wrangling, and interface design is in your wheelhouse, share links to comparable projects, outline a rough timeline, and let me know your upcoming availability. I’m ready to start as soon as we align on scope.", "tags": ["Java", "Python", "Mobile App Development", "Software Architecture", "Machine Learning (ML)", "Data Science"], "salary": "INR 750.0–1250.0", "location": "", "first_seen": "2026-11-20T01:39:02.020517+00:00", "is_new": false}, {"id": "WeWorkRemotely:https://weworkremotely.com/remote-jobs/elvoro-ai-creative-engineer-social-media", "source": "WeWorkRemotely", "kind": "Emprego remoto", "title": "AI Creative Engineer (Social Media)", "company": "Elvoro", "url": "https://weworkremotely.com/remote-jobs/elvoro-ai-creative-engineer-social-media", "date": "2026-11-18T00:12:31+00:00", "desc": "Headquarters: Elvoro URL: https://elvoro.com/ Python AI Creative Engineer (Social Media) – Elvoro Ltd Engagement: Project-based contract with planned expansion to Full-time Location: Remote, Worldwide Compensation: To be agreed About & Mission Elvoro is a founder-led AI social me…", "full": "Headquarters: Elvoro\n\nURL: https://elvoro.com/\n\nPython AI Creative Engineer (Social Media) – Elvoro Ltd\n\nEngagement: Project-based contract with planned expansion to Full-time\nLocation: Remote, Worldwide\nCompensation: To be agreed\n\nAbout & Mission\n\nElvoro is a founder-led AI social media marketing and advertising company. We are on an important mission to deliver the world’s best AI-native marketing solutions to our clients for remarkable business growth (without AI slop). The AI revolution has changed what’s possible and our proprietary system, built around 100+ API’s, makes it work. We are now looking for an expert engineer with exceptional creative taste to lead this system.\n\nResponsibilities\n\n• \nLead the codebase and creative output of Elvoro’s proprietary social media engine\n\n• \nTurn client briefs into large-scale short-form videos, carousels, static posts and ads\n\n• \nUse your exceptional creative taste, knowledge on what type of content goes viral and converts well on social media, and large amounts of performance data to continuously, independently refine and improve the codebase to produce better content output.\n\n• \nSchedule-post our high-quality content across numerous accounts using social media APIs\n\n• \nCapture performance data via official APIs and use your creative taste and content conversion knowledge to refine content quality and test new creatives\n\n• \nMaintain and extend the production codebase. Integrate numerous media and publishing APIs, test changes and monitor failures and cost per approved post\n\n• \nFix weak creative hooks, ai slop and pacing and product inaccuracies. Turn successful results into reusable yet unique systems\n\n• \nRefine, manage and improve our code pipelines that produce thousands of different social media posts using unique processes\n\nTech Stack Qualifications\n\nProfessional software engineering experience building and maintaining large production codebases.\n\n• \nAdvanced Python\n\n• \nREST API integrations OAuth 2.0 (eg: Anthropic, Runway, SpaceXSI, Instagram, ...)\n\n• \nVideo, audio and image processing (FFmpeg, MoviePy, Pillow, ...)\n\n• \nGoogle Cloud Storage (GCS)\n\n• \nGit, GitHub, GitHub Actions\n\n• \nPreferred: SQL, HTML/CSS, JavaScript (React)\n\nAI-Native Workflow Qualifications\n\n• \nStrong prompt engineering skills. Proactively using AI for efficiency, speed, and quality. Agents such as: Claude Code, Cursor/xAI, Codex, etc.\n\n• \nJudgment to manually review AI output and full accountability for all AI-generated code.\n\nBenefits\n\nYou get to lead Elvoro’s proprietary AI marketing engine and shape its technical and creative direction alongside the founder. An engineer previously working with Elvoro's founder has now gained a high-level job at Meta. Build a track record leading both engineering and creative production. You’ll lead campaigns for many established consumer brands and learn firsthand which creative decisions build brand awareness with hundreds of millions of views across social media a s LLMs to deliver novel data insights and visually rich user experiences. For over a decade, we’ve serve…", "full": "About Mitre Media\n\nMitre Media is redefining FinTech with AI-driven tools that empower millions of investors. Our portfolio, including Dividend.com and MutualFunds.com, leverages LLMs to deliver novel data insights and visually rich user experiences. For over a decade, we’ve served individual investors, financial advisors, and top asset managers like BlackRock and Vanguard through our premium data, tools, and advertising solutions. Join our lean, entrepreneurial team to shape the future of AI-powered investing from your location ±3 hours from Eastern Time.\n\nOur users are deeply engaged, spending over 5 minutes per visit with a bounce rate below 10%, researching investments across hundreds of different categories. With 40 million brokerage accounts in the U.S., we take pride in building tools that make a real impact, fostering a culture of trust, innovation, and dynamism. If you’re passionate about financial technology and AI, we’d love to connect!\n\nAbout the Role\n\nAs a Full-Stack Rails Tech Lead, you’ll architect and implement LLM-powered web applications within our microservices-based Rails 8 platform. Reporting directly to our CTO, you’ll collaborate with a small, high-impact team to deliver user experiences across Dividend.com, MutualFunds.com and other brands within our portfolio. This role combines expert Ruby on Rails skills with AI integration expertise, requiring you to leverage LLMs in your development workflow, state management and user interactions.\n\nYou’ll work in a remote-first hybrid environment, which encourages in person collaboration, using ShapeUp to manage projects that trade-off on-time delivery for de-scoped outcomes. As a technical leader, you'll have a seat at the table shaping system architecture, implementing core features all while embracing an entrepreneurial mindset and a “get things done” mentality.\n\nResponsibilities\n\n• \nArchitect and maintain Rails applications (Rails 8)\n\n• \nIntegrate LLMs into our microservices architecture for state management and real-time user experiences.\n\n• \nEnhance front-end experiences with Hotwire, StimulusJS, or React, ensuring seamless AI-driven interactions.\n\n• \nOptimize LLM inference for low latency and cost, using caching and asynchronous processing.\n\nRequired Technical Skills\n\nBack-End\n\n• \nRuby (5+ years, expert-level)\n\n• \nRuby on Rails (Rails 6-8 preferred)\n\n• \nPostgreSQL (or MySQL)\n\n• \nElasticsearch\n\n• \nRedis\n\n• \nDocker\n\nFront-End\n\n• \nStimulusJS or JavaScript ES6\n\n• \nTailwind CSS\n\n• \nHTML\n\n• \nHTTP\n\nAI Integration\n\n• \nExperience integrating AI/ML models (e.g., LLMs, NLP) with web applications\n\n• \nFamiliarity with LLM frameworks (e.g., LangChain, Hugging Face) or APIs (e.g., xAI, Anthropic)\n\nNice-to-Have Technical Skills\n\n• \nKubernetes for microservices orchestration\n\n• \nReact for advanced front-end components\n\n• \nGraph databases for complex financial data\n\n• \nContributions to open-source RoR or AI projects\n\nRequired Soft Skills\n\n• \nEntrepreneurial mindset with a passion for AI and FinTech\n\n• \nNatural leader who mentors and inspires teammates\n\n• \nProblem-solver with a “get things done” mentality\n\n• \nExcellent communication, thriving in remote and cross-team collaboration\n\n• \nAttention to detail, ensuring clean, maintainable code\n\n• \nTeam player comfortable as an individual contributor\n\nWhy Join Us?\n\n• \nImpactful Work: Build AI-powered tools that help millions of investors make informed decisions from data-driven insights.\n\n• \nCutting-Edge Tech: Work with Rails 8, LLMs, and modern tools like Hotwire, Databricks, and xAI’s API in a microservices architecture.\n\n• \nAutonomy and Influence: Collaborate directly with our CEO and CTO to shape our AI-driven platform, with freedom to innovate.\n\n• \nCompetitive Compensation: $160,000–$200,000 CAD/USD (based on experience) and benefits.\n\n• \nRemote Flexibility: Remote-first (±3 hours from ET) with hybrid in office collaboration in Toronto or NYC\n\n• \nGrowth Opportunities: Budget for AI and Rails conferences (e.g., NeurIPS, RailsConf), plus access to cutting-edge AI tools for experimentation.\n\n• \nDynamic Culture: Join a small, no-ego team passionate about trust, innovation, and making a difference in FinTech.\n\nAbout Mitre Media’s AI-Driven Platform\n\nMitre Media powers premium financial brands like Dividend.com and MutualFunds.com with the Mitre Platform. This platform integrates traditional content management, financial data, first-party data, ad revenue, and subscription tools, all enhanced by LLMs for rich, user-focused experiences. Our data-derived insights delight users, while our advertising solutions deliver unmatched performance for partners like BlackRock and Vanguard, leveraging advanced targeting and first-party data.\n\nHow to Apply\n\nSubmit your resume, GitHub profile, and a brief note on why you’re excited about building AI-driven FinTech to jobs@mitremedia.com.", "tags": ["api", "CSS", "docker", "elasticsearch", "fullstack", "html"], "salary": "$170k - $200k", "location": "USA, Canada, USA timezones", "first_seen": "2026-11-20T01:39:02.020517+00:00", "is_new": false}, {"id": "LinkedIn:https://www.linkedin.com/jobs/view/senior-backend-software-engineer-%E2%80%94-iot-platform-at-e-space-4454172241", "source": "LinkedIn", "kind": "Emprego remoto", "title": "Senior Backend Software Engineer — IoT Platform", "company": "E-Space", "url": "https://www.linkedin.com/jobs/view/senior-backend-software-engineer-%E2%80%94-iot-platform-at-e-space-4454172241", "date": "2026-11-14T00:00:00", "desc": "", "full": "", "tags": ["python"], "salary": "", "location": "Santa Clara, CA", "first_seen": "2026-11-20T01:39:02.020517+00:00", "is_new": false}, {"id": "LinkedIn:https://www.linkedin.com/jobs/view/senior-backend-engineer-at-sphinx-defense-4434503003", " e MCP server, agent skills and the dashboard assistant, and as the space moves you'll build the tooling for new technologies too. You'll build it all eval-first: every tool ships with evals and metrics, so we know, with evidence, that it makes agents better rather than worse.\nYou'll work closely with the Docs, CLI, Frontend and SDK teams, and with the AI Tooling Infrastructure engineers who run these services in production. Other teams contribute to AI Tooling to improve Supabase's agentic capabilities, and you'll help them do that while keeping the quality bar high.\nThis role is ideal for someone who thrives in async, fast-paced environments and is excited about building developer tools that scale to millions.\n\nWhat Youâll Be Responsible For\n• Build and improve the AI tooling we run today, including the MCP server, agent skills, agents and the Assistant.\n\n• Make new Supabase products usable by agents from day one: tools, skills and evals for new product surfaces. Also build tooling for new AI technologies as they emerge: prototype quickly, evaluate honestly, and decide with the team what is worth taking to production.\n\n• Drive an eval-first approach: build and improve evals, instrumentation and feedback loops, measure tools against a no-tool baseline, and help define the quality KPIs and gates that stop regressions shipping.\n\n• Understand how customers and agents actually use what we ship, and turn that into improvements to our tooling, interfaces and documentation.\n\n• Design how documentation and product knowledge are exposed to agents, and measure whether it works.\n\n• Build patterns and tools that help customers add AI to their own apps, such as MCP on Edge Functions, vector embeddings and agents running on Edge Functions.\n\n• Enable teams to improve Supabase's agentic capabilities through contributions to AI Tooling: clear contribution paths, templates, documentation and review practice.\n\n• Centralise shared AI logic so teams reuse it rather than duplicate it.\n\n• Ship tools that are battle-tested, with strong tests, benchmarking and stress testing where it counts.\n\n• Work with the AI Tooling Infrastructure engineers on reliability, auth and hosting.\n\n• Work across Docs, CLI, Frontend, SDK and other teams to deliver one coherent developer experience, and stay close to the fast-moving AI ecosystem.\n\nYou Might Be a Good Fit If You\n\nMust have:\n• Have 5+ years of experience in professional software engineering experience.\n\n• Write strong TypeScript and know the JavaScript ecosystem well: npm, ES modules, bundlers, compatibility.\n\n• Are deeply familiar with the AI ecosystem: current tools, agent patterns and practical trade-offs. You can tell a durable pattern from hype.\n\n• Have built developer tools, product interfaces or platform primitives used by other engineers.\n\n• Have designed or used evaluation frameworks to measure AI quality, reliability and task success, and understand baselines, variance and cost.\n\n• Have strong judgement about where AI improves workflows and how to avoid fragile or gimmicky experiences.\n\n• Write tests and validate reliability in real-world conditions.\n\n• Know Postgres and relational database practice.\n\n• Communicate clearly in writing, work across product, engineering and docs, and thrive in async, globally distributed teams.\n\n• Are comfortable navigating ambiguity and moving quickly.\n\nNice to have:\n• Experience with vector databases and embeddings, ideally pgvector.\n\n• Examples of customer-facing AI features or agents you've shipped.\n\n• Examples of documentation or structured knowledge designed for developers or agents.\n\n• Experience with Braintrust or a similar eval and tracing platform, or setting up CI quality gates.\n\n• Open-source contributions or developer tooling you've maintained.\n\n• Experience across several product surfaces or teams.\n\nWhat We Offer\n• Fully Remote\nWe hire globally. We believe you can do your best work from anywhere. There are no Supabase offices, but we provide a WeWork membership or co-working allowance you can use anywhere in the world.\n\n• ESOP\nEvery team member receives ESOP (equity ownership) in the company. We want everyone to share in the upside of what weâre building together.\n\n• Tech Allowance\nUse this budget to set up your ideal work environmentâlaptop, monitor, headphones, or whatever helps you do your best work.\n\n• Health Benefits\nSupabase covers 100% of health insurance for employees and 80% for dependents, wherever you are. Your wellbeing and your familyâs health are important to us.\n\n• Annual Off-Sites\nOnce a year, the entire company gathers in a new city for a week of connection, collaboration, and fun. Itâs a highlight of our year.\n\n• Flexible Work\nWe operate asynchronously and trust you to manage your own time. You know what needs to be done and when.\n\n• Professional Development\nEvery team member receives an annual education allowance to spend on learningâcourses, books, conferences, or anything that supports your growth.\n\nAbout the Team\nSupabase was born-remote and open-source-first. We believe our globally distributed team is our secret weapon in building tools developers love.\n• ~400 team members\n\n• 60+ countries\n\n• 20+ languages spoken\n\n• Over $1B raised (including our $500M Series F)\n\n• 540,000+ community members\n\nWe move fast, build in public, and use what we ship. If itâs in your project, we probably use it in ours too. We believe deeply in the open-source ecosystem and strive to supportânot replaceâexisting tools and commu…", "tags": ["dev", "design", "front end", "customer support", "testing", "marketing"], "salary": "", "location": "", "first_seen": "2026-11-20T01:39:02.020517+00:00", "is_new": false}, {"id": "LinkedIn:https://www.linkedin.com/jobs/view/software-engineer-stf-enterprise-it-at-lockheed-martin-4488965868", "source": "LinkedIn", "kind": "Emprego remoto", "title": "Software Engineer S
