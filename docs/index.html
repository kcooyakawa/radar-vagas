air and open infrastructure for AI training data. Their …", "full": "Location: San Francisco or Singapore (on-site), or remote (Singapore or US Pacific time zones)\nStart Date: ASAP\nLanguages: English\nTeam: Engineering\n\nAbout the Role\nOur client is a fast-growing AI company building reliable, fair and open infrastructure for AI training data. Their marketplace helps the people who create data get value for it, and gives AI labs trustworthy data to train on. It is already used by startups, Fortune 500 companies and frontier labs, and the company is backed by leading venture investors, including Y Combinator. They are scaling quickly to meet strong demand.\nWe are looking for a Research Engineer, Privacy and Anonymization to build the systems that make sensitive, real-world data safe and still useful for AI training. You will develop methods to detect and remove personally identifiable information, secrets and other sensitive content from raw data before it enters processing and synthetic data pipelines â protecting privacy without destroying the structure and signal that make the data valuable for training agents.\nThis is a privacy and data-protection engineering seat, not a synthetic-task design role. You will own the pipeline that stands in front of downstream processing, training, evaluation and synthetic generation.\nThis is a full-time role, starting ASAP. Offices are in San Francisco and Singapore; remote candidates are welcome if their working hours can overlap about 70â80% with either San Francisco (US Pacific) or Singapore business hours. The exact daily schedule will be agreed during hiring.\n\nWhat You'll Do\n• Build systems to detect PII, quasi-identifiers, credentials and other sensitive information, and design transformations based on the data type and the downstream use case.\n\n• Develop and benchmark detection approaches that combine rules, statistical models, classifiers and LLM-based methods.\n\n• Build production pipelines that anonymize raw data before it enters downstream processing, training, evaluation or synthetic data generation.\n\n• Create evaluation frameworks that measure privacy risk and retained data utility, including recall-weighted metrics, leakage tests and adversarial re-identification attempts.\n\n• Design systems that stay robust to new data sources, schema drift, unusual formats and sensitive information embedded in unexpected fields.\n\n• Work with engineering, research, operations and customers to translate privacy requirements into practical technical policies and safeguards.\n\nWhat We're Looking For\n• Strong proficiency in Python, and experience building reliable production data or machine-learning systems.\n\n• Experience with information extraction, named-entity recognition, classification, or related methods for detecting rare or sensitive content.\n\n• Strong experimental instincts, and the ability to compare approaches across recall, precision, latency, cost and downstream data utility.\n\n• An understanding of the difference between redaction, masking, pseudonymization, anonymization and synthetic data â and when each is appropriate.\n\n• High attention to detail, and the ability to reason about subtle leakage paths, edge cases and adversarial failure modes.\n\n• Experience building data-processing pipelines end to end, including where there was no fully prescribed roadmap.\n\n• Clear written and spoken English, and comfort collaborating across teams and time zones.\n\n• Strong candidates may also have hands-on experience with privacy-enhancing technologies (such as differential privacy, k-anonymity, secure aggregation or format-preserving encryption); have worked with sensitive data in healthcare, finance or security; have built low-latency or high-throughput ML inference or data-processing systems; or have taken work from early research through to production.\n\n• Technical aptitude and learning potential matter more than years of experience. Motivated candidates are encouraged to apply even if they don't meet every point above.\n\nWhy This Role Matters for You\n• Make real-world data safe to train on: You will build the systems that let sensitive data be used for AI training without exposing people or secrets.\n\n• Privacy without wrecking utility: The job is not only to redact, but to keep the structure and signal that downstream training and synthetic pipelines need.\n\n• From detection to production: You will own the full path: detection methods, transformations, evaluation, and the pipeline that sits in front of training and generation.\n\n• Hard, high-stakes edge cases: Work on leakage paths, schema drift and adversarial failure modes, not only clean benchmark datasets.\n\n• San Francisco, Singapore, or remote: Work on-site in San Francisco or Singapore, or remotely, with hours that overlap about 70â80% with either US Pacific or Singapore business hours. The exact daily schedule will be agreed during hiring.\n\nPragmatike is an Equal Opportunity Employer and is committed to providing equal employment opportunities to all applicants without discrimination. We recruit on behalf of our clients and prohibit discrimination and harassment based on race, color, religion, age, sex, national origin, disability status, genetics, protected veteran status, sexual orientation, gender identity or expression, or any other characteristic protected by federal, state, or local laws. This policy applies to all terms and conditions of employment, including recruiting, hiring, placement, promotion, termination, layoff, recall, transfer, leaves of absence, compensation, and training. We are committed to a fair and inclusive hiring process. We process your personal data solely for recruitment purposes, in accordance with applicable privacy laws, and maintain reasonable safeguards to protect your information. Your data may be shared with our client(s) for hiring consideration, but will not be disclosed to third parties outside of the recru nd migrate the framework.\nThis is a hands-on engineering role with a significant architecture and system design component. You will work across the entire agentic AI lifecycle, from designing agent workflows, tools, and integrations to implementing evaluation frameworks, improving reliability, and delivering production-ready AI features.\n\nResponsibilities\n• Design, build, and evolve agentic AI workflows for data exploration, analysis, and conversational insights.\n\n• Develop and improve an extensible agentic framework, including orchestration, reusable tools, skills, and conversation management.\n\n• Build secure integrations with application services and governed data sources, including sandboxed code execution and AI-powered data visualizations.\n\n• Design configurable solutions supporting client-specific prompts, tools, skills, and data definitions without duplicating the core architecture.\n\n• Develop MCP servers and clients to enable communication and data exchange between agents and applications.\n\n• Contribute to architectural decisions and the evolution and migration of the existing LangChain-based solution.\n\n• Implement LLM evaluation, testing, observability, and security controls to ensure accurate, reliable, and data-grounded AI outputs.\n\n• Own features end to end, from technical design and implementation to production release and continuous improvement, collaborating with cross-functional teams.\n\nEssential Knowledge, Skills & Experience\nCore Requirements\n• 6+ years of experience in software engineering, data analytics, or related fields, including 2+ years in agentic AI engineering.\n\n• Strong Python development skills, with experience building, testing, and maintaining production-grade applications.\n\n• Hands-on experience building agentic AI systems using frameworks such as Pydantic AI, LangGraph, LangChain, or OpenAI Agents SDK.\n\n• Strong understanding of agentic patterns, including tool calling, multi-step orchestration, context management, guardrails, and human-in-the-loop workflows.\n\n• Experience with MCP (Model Context Protocol) and multi-agent or cross-application integrations.\n\n• Experience developing AI agents for data analysis, including dataset exploration, code generation and execution, and result interpretation.\n\n• Strong system design and architecture skills, including building configurable, extensible solutions and evaluating technical trade-offs.\n\n• Understanding of AI security, evaluation, and observability, including secure data access, LLM testing, tracing, and performance monitoring.\n\n• Strong ownership, communication, and cross-functional collaboration skills, with practical experience using AI coding assistants (Claude Code, Codex, or similar).\n\nStrongly Preferred\n• Experience with Pydantic AI / Pydantic AI Harness and LangChain, particularly migration between frameworks.\n\n• Familiarity with SQL, pandas, DuckDB, or Ibis for data analysis.\n\n• Experience with Azure OpenAI, Docker, and analytical visualization tools such as Plotly or Dash.\n\nNice-to-Have\n• Experience with retail, pricing, promotions analytics, or similar domains.\n\n• Experience delivering client-facing AI products from prototype to production.\n\n• Familiarity with React and FastAPI.\n\nInterview Process\n• Interview with GT Recruiter\n\n• Cultural Fit Interview\n\n• Technical Interview\n\n• Final Interview \n\n• Offer\n\nWhy Join Our Client?\n• Join a globally recognized consulting firm building innovative AI-powered products that solve real business problems.\n\n• Help shape the architecture and technical direction of an evolving agentic AI platform.\n\n• Build production AI solutions where accuracy, data security, and reliability are essential.\n\n• Work with modern AI technologies and development tools, including Pydantic AI, MCP, Claude Code, Cursor, and OpenAI Codex.\n\n• Collaborate with experienced engineers and product teams in an environment that encourages experimentation, continuous improvement, and technical ownership.\n\nPlease mention the word **UNCOMPLICATED** and tag RMjAuODAuMTY2LjE5OQ== when applying to show you read the job post completely (#RMjAuODAuMTY2LjE5OQ==). This is a beta feature to avoid spam applicants. Companies can search these wo…", "tags": ["design", "react", "sys admin", "infosec", "python", "consulting"], "salary": "", "location": "Warsaw", "first_seen": "2026-11-20T01:39:02.020517+00:00", "is_new": false}, {"id": "Vagas BR (GitHub):https://github.com/backend-br/vagas/issues/12493", "source": "Vagas BR (GitHub)", "kind": "Emprego BR", "title": "[Remoto] Desenvolvedor(a) Back-end Júnior - Python / AI Coding & Agentic AI - MKdigital", "company": "backend-br", "url": "https://github.com/backend-br/vagas/issues/12493", "date": "2026-11-07T20:58:13+00:00", "desc": "**Atualização (13/11/2026):** a oportunidade agora se concentra exclusivamente no AI Bookkeeping Assistant. ### Sobre a empresa A MKdigital é uma startup suíça de tecnologia e inteligência artificial, com foco em automação de processos empresariais. Esta publicação corresponde a …", "full": "**Atualização (13/11/2026):** a oportunidade agora se concentra exclusivamente no AI Bookkeeping Assistant.\n\n### Sobre a empresa\n\nA MKdigital é uma startup suíça de tecnologia e inteligência artificial, com foco em automação de processos empresariais.\n\nEsta publicação corresponde a **uma única oportunidade de desenvolvimento de software**, com foco em backend, APIs, dados e agentes inteligentes. A pessoa selecionada colaborará no produto AI Bookkeeping Assistant da MKdigital.\n\n### Site da empresa\n\nhttps://www.mkdigital.ch\n\n### Descrição da vaga\n\nBuscamos uma pessoa em início de carreira, preferencialmente recém-formada ou em fase final de formação em Engenharia, Ciência da Computação ou área relacionada. **Experiência profissional anterior não é obrigatória.** A atuação é prioritariamente em backend; haverá também integração com interfaces web conforme as necessidades dos produtos.\n\nO trabalho combina programação, compreensão de processos de negócio, especificação de soluções, orientação de coding agents, testes e validação. Não é necessário conhecer previamente contabilidade, mas **a disposição para aprender esse domínio é essencial**.\n\n#### 1. Projeto\n\n##### Projeto A — AI Bookkeeping Assistant (Suíça e Brasil)\n\nDesenvolvimento de uma plataforma de automação de processos contábeis utilizando inteligência artificial, LLMs e agentes inteligentes.\n\nAs principais atividades incluem:\n\n- Processamento e interpretação automática de documentos contábeis, incluindo notas fiscais, faturas, recibos e extratos bancários.\n- Integração de OCR, Document AI e modelos de linguagem.\n- Automação de lançamentos e classificação de transações contábeis.\n- Conciliação bancária e integração com sistemas financeiros.\n- Desenvolvimento de workflows inteligentes e agentes autônomos.\n- Integração com bancos de dados, APIs e serviços externos.\n- Testes, implantação e preparação da plataforma para utilização comercial.\n- Compreensão gradual dos processos contábeis e financeiros necessários à especificação e validação das funcionalidades.\n\n**Objetivo do projeto:** Contribuir para o desenvolvimento e lançamento comercial de uma solução operacional de automação contábil, inicialmente para o mercado suíço, com componentes específicos para o mercado brasileiro.\n\n#### 2. Tecnologias e ambiente de desenvolvimento\n\nO projeto envolve as seguintes tecnologias e práticas, entre outras:\n\n**AI Coding e agentes autônomos**\n- Claude Code, OpenAI Codex e outras ferramentas de programação assistida por IA.\n- Agentes autônomos de desenvolvimento de software (*Coding Agents*).\n- Agentic AI, LLMs, tool calling e orquestração de agentes.\n- Automação de tarefas de programação, testes, documentação e revisão de código.\n- Integração de agentes de programação em workflows de desenvolvimento.\n\n**Desenvolvimento paralelo e engenharia de software**\n- Git, GitHub, branches e Git worktrees.\n- Desenvolvimento paralelo utilizando múltiplos agentes de codificação.\n- Isolamento de ambientes e coordenação de alterações simultâneas.\n- Pull requests, code reviews e integração de código.\n- Testes automatizados, integração contínua (CI/CD) e documentação técnica.\n- Organização de projetos, atividades e entregas utilizando Azure DevOps.\n\n**Backend, frontend e dados**\n- Python e FastAPI.\n- REST APIs e integração entre sistemas.\n- JavaScript/TypeScript e React.\n- PostgreSQL, SQL e bancos de dados em grafos.\n- Processamento de documentos, OCR e pipelines de dados.\n\n**Infraestrutura e desenvolvimento**\n- Linux como ambiente de desenvolvimento e execução.\n- Docker e containers.\n- Servidores e infraestrutura em nuvem.\n- Ambientes automatizados de desenvolvimento, testes e implantação.\n- Conceitos de segurança, autenticação e gerenciamento de serviços.\n\nNão é necessário dominar todas essas tecnologias. Esperamos principalmente interesse em aprender, experimentar e aplicar novas ferramentas de maneira prática.\n\n#### 4. Desenvolvimento orientado ao domínio de aplicação\n\nUm aspecto importante dos projetos é a aproximação entre desenvolvimento de software e conhecimento dos processos que estão sendo automatizados.\n\n**No projeto de contabilidade**, será necessário compreender gradualmente conceitos como documentos contábeis, lançamentos, contas, conciliação bancária, impostos e fluxos financeiros.\n\nA expectativa não é encontrar alguém que já domine esse assunto, mas um profissional que tenha interesse em aprendê-lo e utilizá-lo para:\n\n- Compreender necessidades e requisitos funcionais.\n- Participar da definição de soluções e especificações técnicas.\n- Traduzir processos de negócio em modelos de dados, regras e workflows.\n- Orientar agentes de programação na implementação das funcionalidades.\n- Criar testes e critérios de aceitação baseados em situações reais.\n- Identificar inconsistências e validar os resultados produzidos pelo software e pelos agentes de IA.\n\n**Buscamos alguém interessado em evoluir da programação para a compreensão, especificação e construção de soluções completas, combinando tecnologia, IA e conhecimento de domínio.**\n\n#### 5. Modelo de contratação — Prestação de serviços e empreendedorismo\n\nA MKdigital busca estabelecer uma parceria comercial com um profissional ou uma **microempresa (ME/CNPJ) especializada em desenvolvimento de software**.\n\nA oportunidade é especialmente interessante para profissionais recém-formados que desejam iniciar sua trajetória empreendedora, constituindo sua própria empresa de tecnologia e oferecendo serviços a clientes no Brasil e no exterior.\n\n**Modalidade de contratação**\n\n- **Preferencialmente:** Prestação de serviços por meio de empresa própria (ME/CNPJ), com emissão de notas fiscais.\n- **Apoio ao início da atividade empreendedora:** Para profissionais que ainda estejam no processo de abertura de sua empresa, a MK Digital poderá aceitar, excepcionalmente, a contratação inicial como profissional autônomo (CPF), por até três meses, observadas as obrigações legais e tributárias aplicáveis.\n- Após esse período, a conti…", "tags": ["PJ", "Júnior", "JavaScript", "Python", "Remoto", "Testes automatizados"], "salary": "", "location": "Remoto", "first_seen": "2026-11-20T01:39:02.020517+00:00", "is_new": false}, {"id": "WeWorkRemotely:https://weworkremotely.com/remote-jobs/vertican-senior-applied-ai-engineer-document-intelligence", "source": "WeWorkRemotely", "kind": "Emprego remoto", "title": "Senior Applied AI Engineer, Document Intelligence", "company": "Vertican", "url": "https://weworkremotely.com/remote-jobs/vertican-senior-applied-ai-engineer-document-intelligence", "date": "2026-11-05T17:12:27+00:00", "desc": "Headquarters: New Jersey, USA URL: https://vertican.com About the role For 40 years Vertican has buildt software that runs law firms. One year ago we created a new modern AI platform for document automation (processing/extraction/redacting) which our customers have been adopting …", "full": "Headquarters: New Jersey, USA\n\nURL: https://vertican.com\n\nAbout the role\n\nFor 40 years Vertican has buildt software that runs law firms. One year ago we created a new modern AI platform for document automation (processing/extraction/redacting) which our customers have been adopting faster than any product we've ever had. Our suite of AI-enabled products save customers thousands of hours each week by processing high volumes of documents with precision and speed.The AI team is growing and we'd like you to join.\n\nWe are hiring an engineer to own the document processing pipelines end to end: design, benchmarking, experimenting with new architectures and tools, threshold required for deploying a new pipeline, etc.\n\nWe believe it's important to build our own tooling to help us run, improve, and measure our applications. Therefore, the ideal candidate thinks outside the box on how to not just build the product/pipeline, but also the tooling needed around it.\n\nYou will be the first dedicated ML hire on the product taking over from the engineering manager who build the current solution and will work directly with the founding engineering team.\n\nThis is a senior, hands-on individual-contributor role, but we are small team and you'll be involved in design, planning, roadmapping, and architectural decisions.\n\nWhat you will do\n\nDesign the pipelines. Own the architecture of the extraction-to-posting pipelines: page classification, field extraction, candidate retrieval, claim matching, confidence gating and the hand-off to human review, etc. Decide where rules end and models begin, and what each stage must guarantee to the next, what the separation of concerns are, etc.\n\nWe have different pipelines for different document types and expect that at any given point in time we may have new ones emerge and may consolidate others.\n\nEvaluate new systems before we adopt them. Run structured trials of candidate components and recommend what to keep. Examples include probabilistic record linkage (Splink), Azure AI Content Understanding and Document Intelligence, Azure OpenAI and Foundry-hosted models, and LLM agents with tools. Similarly, test new models with the existing pipeline as they are relased from the frontier labs.\n\nBuild the evaluation process. You'll own the process of evaluating false positives, false negatives, errors of ommission, etc, that we ultimately use to determine if we should upgrade the pipeline. \n\nShip and operate. Take components from trial to production in our python workers on the cloud, instrument them, watch cost and quota, and diagnose the cases reviewers send back.\n\nSet direction. Work with leadereship on the planing for accuracy, cost improvement, and overall product improvements.\n\nWhat we are looking for\n\nRequired\n\n• 6+ years building ML or data-intensive systems, at least 3 of them owning a production pipeline whose output people acted on.\n\n• Solid backend engineering understanding and ideally cloud architecture understanding.\n\n• Ideally hands-on experience with document understanding: OCR or layout models, field extraction from scanned PDFs, or intelligent document processing products.\n\n• Experience with entity resolution or record linkage at scale (Splink, Dedupe, Zingg, or your own blocking-and-scoring system) against databases of hundreds of thousands of rows.\n\n• You have designed an evaluation from scratch: built a labeled ground-truth set, chosen the metrics, and defended a threshold to a non-technical stakeholder.\n\n• Production experience with LLM APIs, including structured output, tool calling and cost or rate-limit management; you can say when an LLM is the wrong tool.\n\n• Strong Python and SQL. Comfortable reading Postgres query plans and writing the raw query when the ORM gets in the way.\n\n• Engineering/Scientist mindset: you are scientific about testing the pipeline and how results are interpeted/presented.\n\nNice to have\n\n• Azure AI services (Content Understanding, Document Intelligence, Azure OpenAI, Foundry) or the AWS and GCP equivalents.\n\n• Financial document processing: checks, remittance advices, lockbox files, payment matching, or accounts receivable automation.\n\n• Exposure to collections, legal operations or other regulated workflows handling PII.\n\n• Probabilistic matching theory (Fellegi-Sunter) or active-learning labeling workflows.\n\n• Experience building human-review tooling or feedback loops that feed back into training and evaluation data.\n\nHow we work and what we offer\n\nSmall team, direct access to large datasets, weekly planning, daily standup, everyone remote in US timezones.\n\nWhat we offer:\n\n• A small team of tight-knit, like-minded people passionate about high quality software\n\n• Competitive compensation, commensurate with a senior individual-contributor role.\n\n• Monthly payments in USD\n\nVertican is an equal opportunity employer. We hire on merit and do not discriminate on the basis of race, color, religion, sex, sexual orientation, gender identity, national origin, age, disability or veteran status.\n\nTo apply: https://weworkremotely.com/remote-jobs/vertican-senior-applied-ai-engineer-document-intelligence", "tags": ["Back-End Programming"], "salary": "", "location": "Anywhere in the World", "first_seen": "2026-11-20T01:39:02.020517+00:00", "is_new": false}, {"id": "RemoteOK:https://remoteOK.com/remote-jobs/remote-operations-expert-with-python-for-ai-supply-chain-task-design-toptal-1137690", "source": "RemoteOK", "kind": "Emprego remoto", "title": "Operations Expert with Python for AI Supply Chain Task Design", "company": "Toptal", "url": "https://remoteOK.com/remote-jobs/remote-operations-expert-with-python-for-ai-supply-chain-task-design-toptal-1137690", "date": "2026-11-05T15:01:09+00:00", "desc": "Overview A fast-growing AI data company is hiring supply chain practitioners to design expert-level Terminal-Bench tasks for evaluating AI agents. You will turn real planning work into end-to-end challenges, each with files, a working solution and an automated correctness check. …", "full": "Overview\nA fast-growing AI data company is hiring supply chain practitioners to design expert-level Terminal-Bench tasks for evaluating AI agents. You will turn real planning work into end-to-end challenges, each with files, a working solution and an automated correctness check. The goal is to build a benchmark grounded in real operations work.\n***THIS IS A TASK BASED COMPENSATION MODEL. PLEASE CHECK THE APPLICATION QUESTIONS FOR MORE DETAILS.***\nResponsibilities\nâ¢ Design expert-level Terminal-Bench tasks by turning a real supply chain task from your work into a challenge an AI agent solves end to end.\nâ¢ Define the files, data exports and systems each task runs on, such as ERP, MES and WMS extracts, so the scenario reflects realistic planning conditions.\nâ¢ Write a working solution for each task, for example a 5-day production plan, and confirm it can be solved in 60 to 75 minutes.\nâ¢ Build the automated check that proves the result is correct, using tests or scripts that accept valid answers and catch planning errors objectively.\nâ¢ Document the written rules, constraints and SOPs that decide each case, along with realistic edge cases, data inconsistencies and common planner errors from your process.\nâ¢ Iterate on tasks based on reviewer feedback, keeping instructions unambiguous, data consistent and the solution and verification reproducible in a command-line environment.\nSkills/Experience\nâ¢ 3+ years of hands-on supply chain or production planning work (not only studying, selling or managing it), or a PhD with active research in the subfield\nâ¢ Did the work within the last 3 years and can name the systems, tools, data and rules used\nâ¢ Personally executed a process where each case is decided by written rules such as SOPs, planning rules or constraints\nâ¢ Worked inside systems of record (ERP, WMS) and with their exports or reports\nâ¢ Can describe edge cases, data inconsistencies and common planner errors, and how a mistake would be caught\nâ¢ Technical fluency in Python or another language and the command line, plus files, CSV/JSON, APIs or databases\nâ¢ Available to start around November 4, 2026\nNice-to-have\nâ¢ Automated or audited the process with scripts, SQL, RPA or rules engines\nâ¢ 5+ years in the same process family\nâ¢ Docker, Git and experience writing tests\nâ¢ Hands-on experience with SAP or other ERPs and TMS/WMS platforms\nâ¢ Advanced Excel skills\nProcess\nâ¢ Task-based engagement paid per task, with each task taking about 60 to 75 minutes\nâ¢ Vetting task instead of a live interview\nâ¢ Tasks are reviewed by the client before approval\n\nPlease mention the word **EXELLENT** and tag RMjAuODAuMTY2LjE5OQ== when applying to show you read the job post completely (#RMjAuODAuMTY2LjE5OQ==). This is a beta feature to avoid spam applicants. Companies can search these words to find applicants that read this and see they're human.", "tags": ["Docker", "Git", "Inventory Management", "Supply Chain", "Microsoft Excel", "Python"], "salary": "", "location": "Anywhere in the World", "first_seen": "2026-11-20T01:39:02.020517+00:00", "is_new": false}, {"id": "RemoteOK:https://remoteOK.com/remote-jobs/remote-ai-content-reviewer-video-annotation-imerit-1137686", "source": "RemoteOK", "kind": "Emprego remoto", "title": "AI Content Reviewer Video Annotation", "company": "iMerit", "url": "https://remoteOK.com/remote-jobs/remote-ai-content-reviewer-video-annotation-imerit-1137686", "date": "2026-11-04T22:25:19+00:00", "desc": "100% Remote | Independent Contractor | 35 - 40 USD/hour Help shape the future of AI. Artificial Intelligence is evolving rapidly, and high-quality data plays a key role in making it smarter. We're looking for detail-oriented individuals to contribut t: Experience with device deployment and inventory tracking across partner sites.\n\n• Multi-country: Experience running partner operations across several countries and time zones.\n\n• Languages: Working fluency in one or more of our regionsâ main business languages, alongside professional English.\n\nIf you don't check every box above but believe you can do the job, we encourage you to apply â we're looking for capability and trajectory, not a perfect checklist match.\nWe strive to create an inclusive work environment for all; we welcome applicants from all backgrounds and are committed to providing equal opportunities. Should you require any accommodations during the recruitment process, we will partner with you to meet your needs.\nWe may use AI-assisted tools to help evaluate applications against the requirements of this role. These tools support our recruiting team in identifying qualified candidates but do not replace human judgment or limit which applications may be reviewed or considered.\n\nPlease mention the word **UPLIFTMENT** and tag RMjAuODAuMTY2LjE5OQ== when applying to show you read the job post completely (#RMjAuODAuMTY2LjE5OQ==). This is a beta feature to avoid spam applicants. Companies can search these words to find applicants that read this and see they're human.", "tags": ["exec", "design", "education", "customer support", "marketing", "quality assurance"], "salary": "US$ 80,000–100,000", "location": "", "first_seen": "2026-11-20T01:39:02.020517+00:00", "is_new": false}, {"id": "Vagas BR (GitHub):https://github.com/react-brasil/vagas/issues/3039", "source": "Vagas BR (GitHub)", "kind": "Emprego BR", "title": "[Remoto] Mobile Developer React Native (Pleno) na Coodesh", "company": "react-brasil", "url": "https://github.com/react-brasil/vagas/issues/3039", "date": "2026-10-30T18:32:24+00:00", "desc": "## Descrição da vaga: Esta é uma vaga de um parceiro da plataforma Coodesh, ao candidatar-se você terá acesso as informações completas sobre a e neer (Automation) is responsible for designing, building, operating and improving production-grade automation for Smile Digital Health, its clients and partners. This role will be responsible for the pipelines, infrastructure as code, environments and recovery procedures, that the platform runs on. \n\nThis Engineer will merge direct platform engineering expertise with driving strategic changes in how the department designs, deploys, and maintains its infrastructure. Key responsibilities include managing build and release engineering, orchestrating the Terraform and Helm infrastructure, provisioning on-demand environments, and implementing automated recovery. This role works closely with Platform Engineering, Solution Engineering, Service Operations and Engineering Practice & QA to remove unnecessary repetitive, manual work and effectively optimize a build from the time the client commits to a running environment faster, decrease platform costs, and utilize AI to enhance the platformâs engineering and operations.\n\n\\n\n\nResponsibilities: \n\n• Own build and release engineering by reviewing the current repositories and CI setup, then consolidate duplicated Azure DevOps pipeline YAML onto shared reusable templates with change detection and automated quality gates.\n\n• Identify and eliminate manual efforts for cross-functional teams and replace them with scheduled, auditable automation. For example, automating patching, certificate and secret rotation, environment scaling, and recurring reports\n\n• Implement GitOps-based continuous delivery - declarative, Git-driven deployments with automated reconciliation, drift detection and rollback.\n\n• Automate line-of-business environments end to end, provisioned and torn down on demand across every Azure service and application involved.\n\n• Automate business continuity and disaster recovery through backup validation, restore and failover, recurring DR drills, and measured RTO and RPO.\n\n• Ensure Helm and Terraform are easy to upgrade by charting reuse and configuration validation, versioned modules, and state boundaries that limit how far an upgrade reaches.\n\n• Run in-cluster platform services deployed through Helm, harden workloads for availability and capacity: health probes, replica counts, and right-sized requests, limits and autoscaling.\n\n• Ensure that the Terraform configuration is regularly maintained.\n\n• Build and maintain Build Agent images for streamlining tooling available for the builds. \n\n• Automate the guardrails such as policy-as-code, security and IaC scanning in the pipeline, and alerts and dashboards defined as code.\n\n• Implement AI-assisted engineering in the platform teamâs day-to-day work\n\n• Contribute to the departmentâs AI enablement, package knowledge into reusable skills and runbooks in the shared skill library.\n\n• Work with the development and operations teams to find automation gaps, prioritize them, and close them.\n\n• Troubleshoot production and staging issues and document what you automate so others can operate it.\n\nRequirements:\n\n• 6+ years of hands-on cloud engineering, DevOps and/or platform engineering experience, including at least 1-2+ years with infrastructure as code and CI/CD automation on Microsoft Azure in production.\n\n• Post-secondary education in Computer Science, Engineering, or similar and/or equivalent work experience. \n\n• Practical in-depth knowledge and expertise in Terraform, Helm and Azure DevOps pipelines, and GitOps delivery (Argo CD or Flux). \n\n• Strong Terraform skills including, but not limited to, experience with module design, provider version management, state management and refactoring.\n\n• Expertise in Helm chart authoring and refactoring, including recent experience with Kubernetes and AKS.\n\n• Demonstrated knowledge across Azure (AKS, Key Vault, Storage, Azure SQL, PostgreSQL, networking, identity) and observability as code (Azure Monitor and/or Grafana, Prometheus, OpenTelemetry).\n\n• ently to engage with local stakeholders.\n\nPreferred qualifications:\n\n• Direct experience as a people manager for a software engineering or technical solutions team.\n\n• Technical expertise in building scalable systems, APIs, or data pipelines, with the ability to lead technical discussions and contribute to design decisions.\n\n• Experience in the ad-tech industry.\n\n• Strong project management skills and experience leading teams through the full software development lifecycle (ideation, design, implementation, launch, and support).\n\n• Excellent communication and collaboration skills, with a passion for developing talent and building a positive team culture.\n\nAbout the job\ngTech Ads is responsible for all support and media and technical services for customers big and small across our entire Ad products stack. We help our customers get the most out of our Ad and Publisher products and guide them when they need help. We provide a range of services from enabling better self help and in-product support, to providing better support through interactions, setting up accounts and implementing ad campaigns, and providing media solutions for customers business and marketing needs and providing complex technical and measurement solutions along with consultative support for our large customers. These solutions range from bespoke and customized ones for our customers to scalable support for millions of customers worldwide. Based on the evolving needs of our ads customers, we partner with Sales, Product and Engineering teams within Google to develop better solutions, tools, and services to improve our products and enhance our client experience. As a cross-functional and global team, we ensure our customers get the best return on investment with Google and we remain a trusted partner.\n\nGoogle creates products and services that make the world a better place, and gTech’s role is to help bring them to life. Our teams of trusted advisors support customers globally. Our solutions are rooted in our technical skill, product expertise, and a thorough understanding of our customers’ complex needs. Whether the answer is a bespoke solution to solve a unique problem, or a new tool that can scale across Google, everything we do aims to ensure our customers benefit from the full potential of Google products.\n\nTo learn more about gTech, check out our video.\n\nResponsibilities\n\n• Be a dedicated people manager for a team of individual contributors. Hire, set clear expectations, coaching team members, providing feedback, supporting career development, and creating a high-trust environment where your team can do their best work.\n\n• Own the day-to-day execution of the engineering roadmap in partnership with GCS teams. Manage project timelines, unblock technical challenges, and be accountable for the on-time delivery of your team's projects.\n\n• Act as the primary technical mentor for your team. Lead design reviews, participate in code reviews, and set a high bar for engineering excellence, ensuring the solutions team builds are reliable, scalable, and maintainable.\n\n• Work with other engineering managers, product managers, and the gAP Delivery teams to ensure team's work is aligned with organization's goals. Communicate status, risks, and progress to the gAP Engineering lead and other stakeholders.\n\nGoogle is proud to be an equal opportunity workplace and is an affirmative action employer. We are committed to equal employment opportunity regardless of race, color, ancestry, religion, sex, national origin, sexual orientation, age, citizenship, marital status, disability, gender identity or Veteran status. We also consider qualified applicants regardless of criminal histories, consistent with legal requirements. See also Google's EEO Policy and EEO is the Law. If you have a disability or special need that requires accommodation, please let us know by completing our Accommodations for Applicants form.\n## Google: \n A problem isn't truly s s, and EMR partners, your solutions will transform how clinicians access dataâmoving from external tools and workarounds to seamless, in-workflow decision support via CDS Hooks and real-time APIs. \n\nYou will own the technical foundation for Clinical Decision Support (CDS) Hooks, REST APIs, and the architectural patterns that ensure clinical data is accessible, trustworthy, and performant at the moment of care. This role sits at the intersection of healthcare interoperability standards, modern API design, and operational excellence. You will establish reliability metrics and SLAs that ensure CDS Hooks and APIs serve clinician workflows with consistent quality and performance. You will be part of a small, high-performing healthcare engineering team where engineers support each other's growth through mentorship and tight collaboration.\nPrimary Responsibilities\n• Lead design and implementation of the CDS Hooks platform, including card orchestration, hook context handling, EHR-side logic orchestration, and integration with downstream data services\n\n• Own CDS Hook API contracts and evolution, ensuring compliance with SMART CDS Hooks specification while adding performance, reliability, and healthcare-specific optimizations\n\n• Lead technical integration with EMR systems (Epic, NextGen, Athena, ECW) for CDS Hook discovery, execution, card rendering, and user action handling\n\n• Design, build, and maintain public-facing REST and event-driven APIs exposing clinical data, quality metrics, care gaps, attribution data, and decision support content to partners and provider-facing applications\n\n• Establish API contracts, versioning strategies, and deprecation policies that balance innovation with stability for external consumers\n\n• Implement and maintain API security patterns including OAuth 2.0, scope-based authorization, rate limiting, and audit logging for compliant clinical data access\n\n• Design and optimize real-time or near-real-time data pipelines feeding CDS Hooks and APIsâensuring low latency, high freshness, and graceful failure modes\n\n• Design and implement comprehensive testing and QA frameworks for CDS Hooks and APIs â including hook context validation, card rendering verification, and clinical workflow testing across EMR systems\n\n• Establish reliability metrics and SLAs (latency, availability, freshness) for CDS Hook delivery and API performance; measure and track against clinical requirements\n\n• Define and measure clinical impact metrics â adoption of CDS Hooks, clinician interaction rates, workflow integration success, and patient outcome influence\n\n• Exercise architectural judgment across tradeoffs in correctness, latency, scalability, maintainability, and operational risk in clinical data systems\n\n• Design and implement reliability patterns for CDS and API services including monitoring, alerting, failure detection, graceful degradation, and incident recovery\n\n• Partner with Data Reliability Engineer to define and operate SLAs for CDS Hook delivery, API response times, and data freshness aligned to clinical needs\n\n• Establish and uphold engineering standards for API design, data schemas, integration patterns, and interoperability; maintain high-quality technical documentation and OpenAPI specifications\n\n• Partner with Data Engineering to align upstream data models, gold-layer datasets, and platform capabilities with clinical decision support and API requirements\n\n• Serve as the technical authority on clinical interoperability standards (SMART CDS Hooks, FHIR, HL7, CDS Hooks, EHR integration patterns)\n\n• Collaborate with Product, Clinical Operations, and Business stakeholders to clarify requirements, translate clinical workflows into platform features, and shape product direction\n\n• Act as trusted technical advisor to EMR partners, healthcare systems, and external API consumers; ensure expectations and delivery are well-defined and predictable\n\n• Ensure all CDS and API services comply with healthcare security, privacy, and regulatory requirements (HIPAA, state regulations, payer mandates)\n\n• Partner with IT Security and Compliance teams to implement secure access controls, audit logging, encryption, and data protection measures across delivery mechanisms\n\n• Design and implement audit trails for all clinical data access; support compliance audits and regulatory reporting\n\n• Mentor team members through design reviews, pairing, and architectural guidance on clinical data integration and API design\n\n• Document new and existing systems, designs, processes, and procedures\n\nRequired Qualifications\n• 8+ years of experience designing, building, and operating API platforms, service-oriented systems, or backend infrastructure at scale\n\n• Demonstrated experience operating at a senior or staff-level individual contributor scope, owning complex systems end-to-end\n\n• 3+ years of direct experience with healthcare data integrations, EMR workflows, clinical data exchange, or healthcare interoperability standards (FHIR, HL7, CDA, claims data)\n\n• 2+ years of hands-on experience with CDS Hooks, SMART on FHIR, or similar clinical decision support APIs\n\n• Strong experience designing and operating REST APIs, including contract design, versioning, error handling, and authentication/authorization patterns\n\n• Deep understanding of healthcare data integrations, EMR workflows, and interoperability patterns (FHIR, HL7, CDS Hooks, SMART on FHIR)\n\n• Expertise in designing for reliability, SLAs, and operational metrics; ability to translate clinical requirements into technical SLOs\n\n• Experience defining and measuring API performance metrics (latency, availability, error rates); fam…", "tags": ["dev", "design", "infosec", "python", "docker", "technical"], "salary": "", "location": "Kansas ", "first_seen": "2026-11-20T01:39:02.020517+00:00", "is_new": false}, {"id": "Vagas BR (GitHub):https://github.com/backend-br/vagas/issues/12434", "source": "Vaga  $("#grid").innerHTML=list.length?list.map((j,i)=>`<article class="card ${seen.has(j.id)?"seen":""}" data-i="${i}" style="animation-delay:${Math.min(i,20)*18}ms">
  ${j.is_new?'<span class="badge b-new">NOVA</span>':""}
  <div class="head">${av(j.company)}<div class="t"><h3>${esc(j.title)}</h3><div class="co">${esc(j.company)}</div></div></div>
  <div class="meta">${metaHTML(j)}</div>
  ${j.desc?`<p class="desc">${esc(j.desc)}</p>`:""}
  <div class="foot"><span>${saved.has(j.id)?"★ salva · ":""}${ago(j.date)}</span><span class="go">Ver detalhes →</span></div></article>`).join("")
  :'<div class="empty">🔭 Nenhuma vaga com esses filtros.</div>';
}
$("#grid").onclick=e=>{const c=e.target.closest(".card");if(c)openJob(list[+c.dataset.i])};

let cur=null;
function openJob(j){cur=j;
 $("#mhead").innerHTML=`<div class="head">${av(j.company)}<div class="t"><h2>${esc(j.title)}</h2><div class="co">${esc(j.company)} · ${ago(j.date)}</div></div></div><div class="meta" style="margin-top:14px">${metaHTML(j)}</div>`;
 const tags=j.tags.filter(Boolean);
 $("#mbody").innerHTML=(tags.length?`<div class="tags">${tags.map(t=>`<span class="m">#${esc(t)}</span>`).join("")}</div>`:"")+
  `<div class="full">${esc(j.full||j.desc||"A descrição completa está na página da vaga. Clique em Candidatar-se para ver todos os detalhes.")}</div>`;
 $("#apply").href=j.url;$("#apply").textContent=j.kind=="Freela"?"Enviar proposta →":"Candidatar-se →";
 $("#save").textContent=saved.has(j.id)?"★ Salva":"☆ Salvar";
 $("#ov").classList.add("open");document.body.style.overflow="hidden";$("#mbody").scrollTop=0;
}
const close=()=>{$("#ov").classList.remove("open");document.body.style.overflow="";render()};
$("#x").onclick=close;$("#ov").onclick=e=>{if(e.target.id=="ov")close()};document.onkeydown=e=>{if(e.key=="Escape")close()};
$("#apply").onclick=()=>{seen.add(cur.id);persist()};
$("#save").onclick=()=>{saved.has(cur.id)?saved.delete(cur.id):saved.add(cur.id);persist();$("#save").textContent=saved.has(cur.id)?"★ Salva":"☆ Salvar"};
render();
</script></body></html>
