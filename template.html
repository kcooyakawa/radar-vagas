<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#04060d;--ink:#e9eefc;--mute:#7d89a8;--faint:#46506b;--line:rgba(120,150,255,.12);--glass:rgba(16,24,48,.55);--glass2:rgba(22,32,64,.7);--blue:#3b82f6;--sky:#7cc4ff;--vio:#8b5cf6}
*{box-sizing:border-box}html,body{margin:0}
body{background:radial-gradient(1200px 700px at 50% -10%,#0e1a3d 0%,transparent 60%),radial-gradient(900px 500px at 50% 110%,#0b1a4a 0%,transparent 60%),var(--bg);background-attachment:fixed;color:var(--ink);font:14px/1.5 Inter,-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px}
/* hero */
.hero{text-align:center;padding:64px 0 26px}
.mark{font-size:clamp(56px,9vw,104px);line-height:1;letter-spacing:-.045em;margin:0;display:inline-flex;align-items:baseline}
.mark .a{font-weight:300;background:linear-gradient(180deg,#fff,#b9c6ea);-webkit-background-clip:text;color:transparent}
.mark .s{font-weight:800;margin:0 .02em;background:linear-gradient(180deg,#8fd0ff,#2563eb);-webkit-background-clip:text;color:transparent;transform:skewX(-8deg);display:inline-block;filter:drop-shadow(0 0 18px rgba(59,130,246,.55))}
.mark .b{font-weight:800;background:linear-gradient(180deg,#fff 20%,#c7d2fe);-webkit-background-clip:text;color:transparent}
.tag{margin-top:20px;font-size:11px;letter-spacing:.42em;text-transform:uppercase;color:#c9d3ef}
/* search */
.searchbox{max-width:620px;margin:34px auto 0;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 18px;border-radius:999px;background:var(--glass);border:1px solid rgba(110,150,255,.35);box-shadow:0 0 0 1px rgba(59,130,246,.08),0 10px 50px -10px rgba(59,130,246,.45),inset 0 1px 0 rgba(255,255,255,.05);backdrop-filter:blur(16px)}
.searchbox svg{flex:none;opacity:.6}
.searchbox input{flex:1;background:none;border:0;outline:none;color:var(--ink);font:inherit;font-size:15px;padding:8px 0}
.searchbox input::placeholder{color:var(--faint)}
.count{flex:none;font-size:12px;color:var(--mute);padding:9px 14px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.srcs{margin-top:14px;font-size:11px;color:var(--faint);display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.srcs span:before{content:"•";margin-right:6px;color:#2c3655}
/* segmented */
.segs{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:22px}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(12px)}
.seg button{border:0;background:none;color:var(--mute);font:500 12.5px Inter,sans-serif;padding:8px 15px;border-radius:999px;cursor:pointer;transition:.2s;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button.on{color:#fff;background:linear-gradient(180deg,#1d3f8f,#13285e);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 4px 18px -4px rgba(59,130,246,.6)}
/* section */
.sec{display:flex;justify-content:space-between;align-items:end;margin:46px 0 16px}
.sec h2{font-weight:400;font-size:20px;margin:0;letter-spacing:-.01em}
.sec small{color:var(--mute);font-size:12px}
/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;padding-bottom:40px}
.card{position:relative;border-radius:22px;padding:20px;background:linear-gradient(180deg,var(--glass2),var(--glass));border:1px solid var(--line);backdrop-filter:blur(14px);cursor:pointer;display:flex;flex-direction:column;gap:14px;transition:transform .2s,border-color .2s,box-shadow .2s;animation:rise .4s both}
.card:hover{transform:translateY(-3px);border-color:rgba(120,160,255,.32);box-shadow:0 20px 50px -24px rgba(59,130,246,.55)}
.card.seen{opacity:.45}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
/* neon TOP */
.card.top{border-color:transparent;background:linear-gradient(180deg,#0f1838,#0b1230) padding-box,conic-gradient(from var(--a),#3b82f6,#7cc4ff,#8b5cf6,#22d3ee,#3b82f6) border-box;border:1.5px solid transparent;animation:rise .4s both,spin 6s linear infinite;box-shadow:0 0 0 1px rgba(59,130,246,.15),0 0 32px -6px rgba(59,130,246,.55),0 0 70px -20px rgba(139,92,246,.5)}
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes spin{to{--a:360deg}}
.topb{position:absolute;top:16px;right:16px;font:700 10px Inter;letter-spacing:.18em;padding:5px 10px;border-radius:999px;color:#fff;background:linear-gradient(90deg,#2563eb,#8b5cf6);box-shadow:0 0 16px rgba(99,102,241,.7)}
.newb{position:absolute;top:16px;right:16px;font:600 10px Inter;letter-spacing:.14em;padding:5px 10px;border-radius:999px;color:var(--sky);border:1px solid rgba(124,196,255,.35);background:rgba(59,130,246,.08)}
.card.top .newb{display:none}
.hd{display:flex;gap:14px;align-items:center;padding-right:64px}
.logo{flex:none;width:50px;height:50px;border-radius:14px;overflow:hidden;display:grid;place-items:center;background:#0c1430;border:1px solid var(--line);font-weight:700;font-size:19px;color:#cfe0ff}
.logo img{width:100%;height:100%;object-fit:contain;background:#fff}
.co{font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card h3{margin:0;font-size:16px;font-weight:600;line-height:1.35;letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.desc{margin:0;color:var(--mute);font-size:13px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.p{font-size:11.5px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.035);border:1px solid var(--line);color:#a9b5d3}
.p.free{color:#86efac;border-color:rgba(134,239,172,.25)}.p.job{color:var(--sky);border-color:rgba(124,196,255,.25)}
.p.money{color:#fff;font-weight:600;background:rgba(59,130,246,.12);border-color:rgba(59,130,246,.35)}
.ft{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:4px;font-size:11.5px;color:var(--faint)}
.ft b{font-weight:500;color:#9fb4ff}
.empty{grid-column:1/-1;text-align:center;padding:70px 0;color:var(--mute);border:1px solid var(--line);border-radius:22px;background:var(--glass)}
footer{text-align:center;padding:40px 0 34px;border-top:1px solid var(--line);margin-top:20px}
.pw{font-size:10px;letter-spacing:.36em;color:#aab5d4}.pw b{font-size:22px;letter-spacing:-.02em;color:#fff;margin-left:10px;font-weight:800;vertical-align:middle}
.st{margin-top:12px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* modal */
.ov{position:fixed;inset:0;z-index:30;background:rgba(2,4,12,.72);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:24px}
.ov.open{display:flex;animation:fade .2s}@keyframes fade{from{opacity:0}}
.modal{position:relative;width:min(780px,100%);max-height:90vh;display:flex;flex-direction:column;border-radius:28px;overflow:hidden;background:linear-gradient(180deg,#0e1736,#080d20);border:1px solid rgba(110,150,255,.25);box-shadow:0 30px 120px -20px rgba(59,130,246,.45);animation:pop .3s cubic-bezier(.2,.9,.25,1.15)}
.modal.top{border:1.5px solid transparent;background:linear-gradient(180deg,#0e1736,#080d20) padding-box,conic-gradient(from var(--a),#3b82f6,#7cc4ff,#8b5cf6,#22d3ee,#3b82f6) border-box;animation:pop .3s cubic-bezier(.2,.9,.25,1.15),spin 6s linear infinite}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.97)}}
.mh{padding:30px 32px 22px;border-bottom:1px solid var(--line);background:radial-gradient(500px 160px at 20% 0%,rgba(59,130,246,.18),transparent)}
.mh .hd{padding-right:44px}.mh .logo{width:64px;height:64px;border-radius:18px;font-size:24px}
.mh h2{margin:0 0 4px;font-size:24px;line-height:1.2;letter-spacing:-.02em;font-weight:700}
.mh .pills{margin-top:16px}
.x{position:absolute;top:18px;right:18px;width:38px;height:38px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);cursor:pointer;font-size:15px}
.mb{flex:1;overflow:auto;padding:24px 32px;white-space:pre-line;font-size:14.5px;line-height:1.75;color:#c3cce4}
.mf{display:flex;gap:10px;padding:18px 32px 24px;border-top:1px solid var(--line)}
.btn{flex:1;text-align:center;text-decoration:none;color:#fff;font-weight:600;font-size:15px;padding:15px;border-radius:999px;background:linear-gradient(180deg,#3b82f6,#1d4ed8);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 10px 36px -8px rgba(59,130,246,.8);transition:.2s}
.btn:hover{filter:brightness(1.12);transform:translateY(-1px)}
.gh{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);font:500 14px Inter;padding:15px 22px;border-radius:999px;cursor:pointer}
@media(max-width:640px){.wrap{padding:0 16px}.hero{padding-top:40px}.tag{letter-spacing:.25em}.ov{padding:0;align-items:flex-end}.modal{border-radius:26px 26px 0 0;max-height:94vh}.mh,.mb,.mf{padding-left:20px;padding-right:20px}.segs{justify-content:flex-start;overflow-x:auto;flex-wrap:nowrap}}
</style></head><body>
<div class="wrap">
 <section class="hero">
  <h1 class="mark"><span class="a">radar</span><span class="s">/</span><span class="b">vagas</span></h1>
  <div class="tag">Design · Direção de arte · Vídeo · Social · IA</div>
  <div class="searchbox"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9fb4ff" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
   <input id="q" placeholder="Buscar cargo, empresa, ferramenta…"><span class="count" id="count"></span></div>
  <div class="srcs" id="srcs"></div>
  <div class="segs">
   <div class="seg" id="kind"></div>
   <div class="seg" id="tog"><button data-t="onlyTop">★ Top</button><button data-t="onlyNew">Novas</button><button data-t="onlySaved">Salvas</button><button data-t="hideSeen">Ocultar vistas</button></div>
  </div>
 </section>
 <div class="sec"><h2>Oportunidades</h2><small id="upd"></small></div>
 <main class="grid" id="grid"></main>
 <footer><div class="pw">POWERED BY<b>kco</b></div><div class="st" id="st"></div></footer>
</div>
<div class="ov" id="ov"><div class="modal" id="modal" role="dialog" aria-modal="true">
 <button class="x" id="x" aria-label="Fechar">✕</button>
 <div class="mh" id="mh"></div><div class="mb" id="mb"></div>
 <div class="mf"><button class="gh" id="save">☆ Salvar</button><a class="btn" id="apply" target="_blank" rel="noopener">Candidatar-se</a></div>
</div></div>
<script>
const D=/*__DATA__*/null;const $=s=>document.querySelector(s);
const LS=k=>{try{return new Set(JSON.parse(localStorage[k]||"[]"))}catch(e){return new Set}};
const seen=LS("seen"),saved=LS("saved");const persist=()=>{try{localStorage.seen=JSON.stringify([...seen]);localStorage.saved=JSON.stringify([...saved])}catch(e){}};
const st={kind:"",onlyTop:false,onlyNew:false,onlySaved:false,hideSeen:false};
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ago=d=>{const h=(Date.now()-new Date(d))/36e5;return h<1?"agora":h<24?`há ${h|0}h`:`há ${h/24|0}d`};
const logo=j=>{const l=(j.company||"?").trim()[0].toUpperCase();return `<div class="logo">${j.logo?`<img src="${esc(j.logo)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.textContent='${esc(l).replace(/'/g,"")}'">`:esc(l)}</div>`};
const pills=j=>`<span class="p ${j.kind=="Freela"?"free":"job"}">${esc(j.kind)}</span>${j.salary?`<span class="p money">${esc(j.salary)}</span>`:""}${j.location?`<span class="p">${esc(j.location)}</span>`:""}`;
// header
$("#upd").textContent="Atualizado "+new Date(D.updated).toLocaleString("pt-BR",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})+" · a cada 3h";
$("#srcs").innerHTML=Object.keys(D.status).map(s=>`<span>${esc(s)}</span>`).join("");
$("#st").textContent=Object.entries(D.status).map(([k,v])=>k+" "+v).join(" · ");
const kinds=["",...new Set(D.jobs.map(j=>j.kind))];
$("#kind").innerHTML=kinds.map(k=>`<button class="${k?"":"on"}" data-k="${esc(k)}">${k?esc(k):"Tudo"}</button>`).join("");
$("#kind").onclick=e=>{const b=e.target.closest("button");if(!b)return;st.kind=b.dataset.k;[...$("#kind").children].forEach(x=>x.classList.toggle("on",x==b));render()};
$("#tog").onclick=e=>{const b=e.target.closest("button");if(!b)return;st[b.dataset.t]=!st[b.dataset.t];b.classList.toggle("on");render()};
$("#q").oninput=render;
let list=[];
function render(){const q=$("#q").value.toLowerCase().trim();
 list=D.jobs.filter(j=>(!st.kind||j.kind==st.kind)&&(!st.onlyTop||j.top)&&(!st.onlyNew||j.is_new)&&(!st.onlySaved||saved.has(j.id))&&(!st.hideSeen||!seen.has(j.id))
  &&(!q||[j.title,j.company,j.desc,j.tags.join(" "),j.location].join(" ").toLowerCase().includes(q)))
  .sort((a,b)=>(b.top-a.top)||(new Date(b.date)-new Date(a.date)));
 $("#count").textContent=list.length+" vagas";
 $("#grid").innerHTML=list.length?list.map((j,i)=>`<article class="card ${j.top?"top":""} ${seen.has(j.id)?"seen":""}" data-i="${i}" style="animation-delay:${Math.min(i,18)*20}ms">
  ${j.top?'<span class="topb">TOP</span>':""}${j.is_new?'<span class="newb">NOVA</span>':""}
  <div class="hd">${logo(j)}<div style="min-width:0"><div class="co">${esc(j.company)}</div></div></div>
  <h3>${esc(j.title)}</h3>
  ${j.desc?`<p class="desc">${esc(j.desc)}</p>`:""}
  <div class="pills">${pills(j)}</div>
  <div class="ft"><span>${esc(j.source)} · ${ago(j.date)}${saved.has(j.id)?" · ★":""}</span><b>Ver detalhes →</b></div></article>`).join("")
  :'<div class="empty">Nenhuma oportunidade com esses filtros.</div>'}
$("#grid").onclick=e=>{const c=e.target.closest(".card");if(c)openJob(list[+c.dataset.i])};
let cur;
function openJob(j){cur=j;
 $("#modal").classList.toggle("top",!!j.top);
 $("#mh").innerHTML=`<div class="hd">${logo(j)}<div style="min-width:0"><h2>${esc(j.title)}</h2><div class="co">${esc(j.company)} · ${esc(j.source)} · ${ago(j.date)}</div></div></div><div class="pills">${j.top?'<span class="p money">★ Oportunidade top</span>':""}${pills(j)}${j.tags.map(t=>`<span class="p">#${esc(t)}</span>`).join("")}</div>`;
 $("#mb").textContent=j.full||j.desc||"A descrição completa está na página original — clique em Candidatar-se.";
 $("#apply").href=j.url;$("#apply").textContent=j.kind=="Freela"?"Enviar proposta →":"Candidatar-se →";
 $("#save").textContent=saved.has(j.id)?"★ Salva":"☆ Salvar";
 $("#ov").classList.add("open");document.body.style.overflow="hidden";$("#mb").scrollTop=0}
const close=()=>{$("#ov").classList.remove("open");document.body.style.overflow="";render()};
$("#x").onclick=close;$("#ov").onclick=e=>{if(e.target.id=="ov")close()};document.onkeydown=e=>{if(e.key=="Escape")close()};
$("#apply").onclick=()=>{seen.add(cur.id);persist()};
$("#save").onclick=()=>{saved.has(cur.id)?saved.delete(cur.id):saved.add(cur.id);persist();$("#save").textContent=saved.has(cur.id)?"★ Salva":"☆ Salvar"};
render();
</script></body></html>
