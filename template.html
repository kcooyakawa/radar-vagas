<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ef;--panel:#fbfaf7;--ink:#141413;--mute:#7a776f;--faint:#b9b5ab;--line:#e4e0d6;--hover:#efece5;--dot:#1f6f4a}
@media(prefers-color-scheme:dark){:root{--bg:#0e0e0d;--panel:#151514;--ink:#ecE8e0;--mute:#8d8a82;--faint:#55534e;--line:#252523;--hover:#1a1a19;--dot:#6fcf97}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 Inter,-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:0 32px}
header{padding:72px 0 36px;display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
h1{font:400 64px/1 "Instrument Serif",Georgia,serif;letter-spacing:-.02em;margin:0}h1 i{color:var(--mute)}
.upd{color:var(--mute);font-size:12px;margin-top:14px;letter-spacing:.02em}
.nums{display:flex;gap:36px}.nums div{text-align:right}.nums b{display:block;font:400 34px/1 "Instrument Serif",serif}.nums span{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.12em}
.bar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:22px;height:56px;overflow-x:auto}
.bar input{flex:1;min-width:180px;border:0;background:none;color:var(--ink);font:inherit;outline:none}.bar input::placeholder{color:var(--faint)}
.f{border:0;background:none;color:var(--mute);font:500 12.5px Inter,sans-serif;cursor:pointer;padding:0;white-space:nowrap;letter-spacing:.01em}
.f:hover{color:var(--ink)}.f.on{color:var(--ink);text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:1px}
select.f{appearance:none}.sep{width:1px;height:16px;background:var(--line);flex:none}
ul{list-style:none;margin:0;padding:8px 0 80px}
li{display:grid;grid-template-columns:1fr auto;gap:6px 24px;padding:22px 16px;margin:0 -16px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:4px;transition:background .15s}
li:hover{background:var(--hover)}li.seen{opacity:.45}
.tt{font-size:16px;font-weight:500;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.new{width:6px;height:6px;border-radius:50%;background:var(--dot);flex:none}
.sub{color:var(--mute);font-size:13px}.sub em{font-style:normal;color:var(--faint);margin:0 8px}
.rt{text-align:right;color:var(--mute);font-size:12.5px;white-space:nowrap}.rt .k{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--faint);margin-top:4px}
.sal{color:var(--ink)}
.empty{padding:120px 0;text-align:center;color:var(--mute);font:italic 400 26px "Instrument Serif",serif}
footer{color:var(--faint);font-size:11px;padding:0 0 40px;letter-spacing:.02em}
/* sheet */
.ov{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 55%,transparent);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.ov.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:21;transform:translateX(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.sheet.open{transform:none}
.sh{padding:40px 44px 28px;border-bottom:1px solid var(--line)}
.sh .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--mute)}
.sh h2{font:400 36px/1.1 "Instrument Serif",serif;letter-spacing:-.01em;margin:14px 0 12px}
.sh .sub{line-height:1.8}
.x{position:absolute;top:28px;right:32px;border:0;background:none;color:var(--mute);font:400 13px Inter;cursor:pointer}.x:hover{color:var(--ink)}
.sb{flex:1;overflow:auto;padding:30px 44px;font-size:14.5px;line-height:1.8;white-space:pre-line;color:color-mix(in srgb,var(--ink) 82%,var(--bg))}
.tags{margin-bottom:22px;color:var(--mute);font-size:12px;white-space:normal}.tags span{margin-right:14px}
.sf{padding:22px 44px 30px;border-top:1px solid var(--line);display:flex;gap:12px}
.btn{flex:1;display:block;text-align:center;text-decoration:none;background:var(--ink);color:var(--bg);font:500 14px Inter;padding:15px;border-radius:999px;letter-spacing:.01em;transition:opacity .15s}.btn:hover{opacity:.85}
.ghost{border:1px solid var(--line);background:none;color:var(--ink);font:500 14px Inter;padding:15px 22px;border-radius:999px;cursor:pointer}
@media(max-width:640px){.wrap{padding:0 20px}header{padding-top:48px}h1{font-size:46px}.nums{gap:22px}.sh,.sb,.sf{padding-left:24px;padding-right:24px}li{grid-template-columns:1fr}.rt{text-align:left}.rt .k{display:inline;margin-left:10px}}
</style></head><body>
<div class="wrap"><header><div><h1>Radar <i>de vagas</i></h1><div class="upd" id="upd"></div></div><div class="nums" id="nums"></div></header></div>
<div class="bar"><div class="wrap" id="bar">
 <input id="q" placeholder="Buscar">
 <span class="sep"></span><div id="kinds" style="display:flex;gap:22px"></div>
 <span class="sep"></span><select class="f" id="src"><option value="">Todas as fontes</option></select>
 <span class="sep"></span><button class="f" data-t="onlyNew">Novas</button><button class="f" data-t="onlySaved">Salvas</button><button class="f" data-t="hideSeen">Ocultar vistas</button>
</div></div>
<div class="wrap"><ul id="list"></ul><footer id="foot"></footer></div>
<div class="ov" id="ov"></div>
<aside class="sheet" id="sheet" aria-hidden="true"><button class="x" id="x">Fechar  ✕</button>
 <div class="sh" id="sh"></div><div class="sb" id="sb"></div>
 <div class="sf"><button class="ghost" id="save">Salvar</button><a class="btn" id="apply" target="_blank" rel="noopener">Candidatar-se</a></div></aside>
<script>
const D=/*__DATA__*/null;const $=s=>document.querySelector(s);
const LS=k=>{try{return new Set(JSON.parse(localStorage[k]||"[]"))}catch(e){return new Set}};
const seen=LS("seen"),saved=LS("saved");const persist=()=>{try{localStorage.seen=JSON.stringify([...seen]);localStorage.saved=JSON.stringify([...saved])}catch(e){}};
const st={kind:"",src:"",onlyNew:false,onlySaved:false,hideSeen:false};
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ago=d=>{const h=(Date.now()-new Date(d))/36e5;return h<1?"agora":h<24?`${h|0} h`:`${h/24|0} d`};
$("#upd").textContent="Atualizado "+new Date(D.updated).toLocaleString("pt-BR",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});
const n=k=>D.jobs.filter(k).length;
$("#nums").innerHTML=[[D.jobs.length,"vagas"],[n(j=>j.is_new),"novas"],[n(j=>j.kind=="Freela"),"freelas"]].map(([b,s])=>`<div><b>${b}</b><span>${s}</span></div>`).join("");
$("#foot").textContent=Object.entries(D.status).map(([k,v])=>k+" "+v).join("  ·  ");
const kinds=["",...new Set(D.jobs.map(j=>j.kind))];
$("#kinds").innerHTML=kinds.map(k=>`<button class="f ${k?"":"on"}" data-k="${esc(k)}">${k?esc(k):"Tudo"}</button>`).join("");
[...new Set(D.jobs.map(j=>j.source))].sort().forEach(s=>$("#src").add(new Option(s,s)));
$("#bar").onclick=e=>{const b=e.target.closest("button");if(!b)return;
 if("k" in b.dataset){st.kind=b.dataset.k;document.querySelectorAll("[data-k]").forEach(x=>x.classList.toggle("on",x==b))}
 else{st[b.dataset.t]=!st[b.dataset.t];b.classList.toggle("on")}render()};
$("#src").onchange=e=>{st.src=e.target.value;render()};$("#q").oninput=render;
let list=[];
function render(){const q=$("#q").value.toLowerCase().trim();
 list=D.jobs.filter(j=>(!st.kind||j.kind==st.kind)&&(!st.src||j.source==st.src)&&(!st.onlyNew||j.is_new)&&(!st.onlySaved||saved.has(j.id))&&(!st.hideSeen||!seen.has(j.id))
  &&(!q||[j.title,j.company,j.desc,j.tags.join(" "),j.location].join(" ").toLowerCase().includes(q)));
 $("#list").innerHTML=list.length?list.map((j,i)=>`<li data-i="${i}" class="${seen.has(j.id)?"seen":""}">
  <div><div class="tt">${j.is_new?'<span class="new"></span>':""}${esc(j.title)}</div>
  <div class="sub">${esc(j.company)}${j.location?`<em>/</em>${esc(j.location)}`:""}${j.salary?`<em>/</em><span class="sal">${esc(j.salary)}</span>`:""}${saved.has(j.id)?'<em>/</em>Salva':""}</div></div>
  <div class="rt">${ago(j.date)}<span class="k">${esc(j.kind)} · ${esc(j.source)}</span></div></li>`).join(""):'<div class="empty">Nada por aqui.</div>'}
$("#list").onclick=e=>{const l=e.target.closest("li");if(l)open(list[+l.dataset.i])};
let cur;
function open(j){cur=j;
 $("#sh").innerHTML=`<div class="k">${esc(j.kind)} · ${esc(j.source)} · ${ago(j.date)}</div><h2>${esc(j.title)}</h2><div class="sub">${esc(j.company)}${j.location?`<em>/</em>${esc(j.location)}`:""}${j.salary?`<em>/</em><span class="sal">${esc(j.salary)}</span>`:""}</div>`;
 const t=j.tags.filter(Boolean);
 $("#sb").innerHTML=(t.length?`<div class="tags">${t.map(x=>`<span>${esc(x)}</span>`).join("")}</div>`:"")+esc(j.full||j.desc||"A descrição completa está na página original.");
 $("#apply").href=j.url;$("#apply").textContent=j.kind=="Freela"?"Enviar proposta":"Candidatar-se";
 $("#save").textContent=saved.has(j.id)?"Salva":"Salvar";
 $("#sb").scrollTop=0;$("#sheet").classList.add("open");$("#ov").classList.add("open");}
const close=()=>{$("#sheet").classList.remove("open");$("#ov").classList.remove("open");render()};
$("#x").onclick=close;$("#ov").onclick=close;document.onkeydown=e=>{if(e.key=="Escape")close()};
$("#apply").onclick=()=>{seen.add(cur.id);persist()};
$("#save").onclick=()=>{saved.has(cur.id)?saved.delete(cur.id):saved.add(cur.id);persist();$("#save").textContent=saved.has(cur.id)?"Salva":"Salvar"};
render();
</script></body></html>
